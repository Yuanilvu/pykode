  - id: "sq8-3"
    judul: "Duel Tenang vs Liar"
    sulit: "sedang"
    cerita: |
      Ada dua saham yang mau dibandingkan. Masing-masing punya 4 harga.
      Baca nama saham pertama, empat harganya, lalu nama saham kedua dan
      empat harganya. Hitung simpangan keduanya, lalu cetak kesimpulan
      siapa yang lebih liar. Kalau sama, cetak sama tenangnya.
      Tulis nama sahamnya sama persis seperti di input ya!
    input: "Lima baris saham pertama: nama lalu 4 harganya. Lalu lima baris saham kedua."
    output: "Dua baris '<nama>: <angka>', lalu 'Kesimpulan: <nama> lebih liar' atau 'Kesimpulan: sama tenangnya'"
    contoh:
      - input: "TLKM\n900\n900\n1100\n1100\nBBRI\n800\n800\n1200\n1200"
        output: "TLKM: 100\nBBRI: 200\nKesimpulan: BBRI lebih liar"
      - input: "AAA\n800\n800\n1200\n1200\nBBB\n900\n900\n1100\n1100"
        output: "AAA: 200\nBBB: 100\nKesimpulan: AAA lebih liar"
    tes:
      - input: "TLKM\n900\n900\n1100\n1100\nBBRI\n800\n800\n1200\n1200"
        output: "TLKM: 100\nBBRI: 200\nKesimpulan: BBRI lebih liar"
      - input: "AAA\n800\n800\n1200\n1200\nBBB\n900\n900\n1100\n1100"
        output: "AAA: 200\nBBB: 100\nKesimpulan: AAA lebih liar"
      - input: "P\n900\n900\n1100\n1100\nQ\n900\n900\n1100\n1100"
        output: "P: 100\nQ: 100\nKesimpulan: sama tenangnya"
      - input: "GOTO\n500\n500\n1500\n1500\nASII\n1000\n1000\n1200\n1200"
        output: "GOTO: 500\nASII: 100\nKesimpulan: GOTO lebih liar"
      - input: "UNVR\n1000\n1000\n1000\n1000\nICBP\n2000\n2000\n2000\n2000"
        output: "UNVR: 0\nICBP: 0\nKesimpulan: sama tenangnya"
    solusi: |
      def simpangan(data):
          total = 0
          for x in data:
              total = total + x
          rata = total / len(data)
          jumlah = 0
          for x in data:
              selisih = x - rata
              jumlah = jumlah + selisih * selisih
          return int((jumlah / len(data)) ** 0.5)


      nama1 = input()
      d1 = []
      for i in range(4):
          d1.append(int(input()))

      nama2 = input()
      d2 = []
      for i in range(4):
          d2.append(int(input()))

      s1 = simpangan(d1)
      s2 = simpangan(d2)

