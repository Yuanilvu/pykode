pelajaran:
  - id: "q8-1"
    judul: "Rata-rata & Jarak"
    menit: 6
    materi: |
      Kamu sudah tahu rata-rata: jumlah semua data dibagi banyaknya data. 📊
      Sekarang kita pakai rata-rata itu untuk melihat **jarak** tiap data.

      Contoh: harga sahammu 1000, 1100, dan 1200.
      Rata-ratanya 1100.

      Jarak itu selisih tiap harga dari rata-rata.

      ```python
      harga = [1000, 1100, 1200]
      rata = 1100
      for h in harga:
          print(h - rata)
      ```

      Hasilnya -100, 0, dan 100. Perhatikan tandanya.
      Harga 1000 ada di bawah rata-rata, jadi hasilnya minus.

      **Jarak selalu kita anggap positif.** Kalau minus, kita balik jadi plus.

      ```python
      selisih = 1000 - 1100
      if selisih < 0:
          selisih = -selisih
      print(selisih)
      ```

      Hasilnya 100. Artinya harga 1000 berjarak 100 dari rata-rata.
      Harga 1200 juga berjarak 100. Harga 1100 jaraknya 0, karena pas di rata-rata.

      Jarak paling besar disebut **jarak terjauh**.
      Mencarinya pakai pola juara, seperti waktu mencari harga termahal.

      Ayo hitung rata-rata dan jaraknya di contoh bawah!
    contoh:
      - kode: |
          harga = [1000, 1100, 1200]
          total = 0
          for h in harga:
              total = total + h
          rata = total / 3
          print("Rata-rata:", int(rata))

          for h in harga:
              selisih = h - rata
              if selisih < 0:
                  selisih = -selisih
              print("Jarak:", int(selisih))
        penjelasan: "Rata-ratanya 1100. Jarak tiap harga: 100, 0, lalu 100."
      - kode: |
          harga = [800, 1000, 1200, 1400]
          total = 0
          for h in harga:
              total = total + h
          rata = total / 4

          terjauh = 0
          for h in harga:
              selisih = h - rata
              if selisih < 0:
                  selisih = -selisih
              if selisih > terjauh:
                  terjauh = selisih

          print("Rata-rata:", int(rata))
          print("Jarak terjauh:", int(terjauh))
        penjelasan: "Rata-ratanya 1100. Harga 800 dan 1400 sama-sama berjarak 300."
    kuis:
      - soal: "Data harganya 1000 dan 1200. Rata-ratanya..."
        pilihan: ["1200", "1100", "1000", "2200"]
        jawaban: 1
        penjelasan: "Jumlahnya 2200, dibagi 2 hasilnya 1100."
      - soal: "Jarak harga 1000 dari rata-rata 1100 adalah..."
        pilihan: ["-100", "0", "100", "2100"]
        jawaban: 2
        penjelasan: "Selisihnya -100, tapi jarak selalu positif, jadi 100."
      - soal: "Harga yang jaraknya 0 adalah harga yang..."
        pilihan: ["pas sama rata-rata", "paling mahal", "paling murah", "tidak ada"]
        jawaban: 0
        penjelasan: "Kalau harganya sama dengan rata-rata, jaraknya 0."

  - id: "q8-2"
    judul: "Getaran Harga (Volatilitas)"
    menit: 7
    materi: |
      Harga saham itu bergoyang naik-turun. Goyangan itu bisa diukur! 📊

      Ukurannya bernama **varians** dan **simpangan**.

      Caranya: cari rata-rata dulu, lalu hitung jarak tiap harga dari rata-rata.
      Setelah itu kuadratkan tiap jarak, jumlahkan, lalu bagi banyaknya data.

      ```python
      harga = [1000, 1200]
      rata = 1100

      jumlah = 0
      for h in harga:
          selisih = h - rata
          jumlah = jumlah + selisih * selisih
      print(jumlah)
      ```

      Harga 1000 jaraknya -100, kuadratnya 10000.
      Harga 1200 jaraknya 100, kuadratnya juga 10000.
      Jumlahnya 20000. Dibagi 2 data, hasilnya 10000. Itulah **varians**.

      **Simpangan** itu akar dari varians. Di Python, akarnya pakai `** 0.5`.

      ```python
      varians = 10000
      print(int(varians ** 0.5))
      ```

      Hasilnya 100. Jadi harga itu biasanya bergoyang sekitar 100 dari rata-ratanya.
      Varians yang besar artinya harga getarannya liar.

      Ayo hitung varians dan simpangannya di contoh bawah!
    contoh:
      - kode: |
          harga = [1000, 1200]
          total = 0
          for h in harga:
              total = total + h
          rata = total / 2

          jumlah_kuadrat = 0
          for h in harga:
              selisih = h - rata
              jumlah_kuadrat = jumlah_kuadrat + selisih * selisih

          varians = jumlah_kuadrat / 2
          print("Varians:", int(varians))
          print("Simpangan:", int(varians ** 0.5))
        penjelasan: "Kuadrat jaraknya 10000 dan 10000. Variansnya 10000, simpangannya 100."
      - kode: |
          harga = [800, 800, 1200, 1200]
          total = 0
          for h in harga:
              total = total + h
          rata = total / 4

          jumlah_kuadrat = 0
          for h in harga:
              selisih = h - rata
              jumlah_kuadrat = jumlah_kuadrat + selisih * selisih

          varians = jumlah_kuadrat / 4
          print("Varians:", int(varians))
          print("Simpangan:", int(varians ** 0.5))
        penjelasan: "Rata-ratanya 1000, jaraknya 200. Variansnya 40000, simpangannya 200."
    kuis:
      - soal: "Varians itu..."
        pilihan: ["harga tertinggi", "jumlah semua harga", "rata-rata dari kuadrat jarak", "nama saham"]
        jawaban: 2
        penjelasan: "Varians itu jumlah kuadrat jarak dibagi banyaknya data."
      - soal: "Simpangan dihitung dengan cara..."
        pilihan: ["varians * 2", "varians ** 0.5", "varians + 1", "varians - 1"]
        jawaban: 1
        penjelasan: "Simpangan itu akar dari varians, jadi pakai ** 0.5."
      - soal: "Variansnya 40000. Simpangannya..."
        pilihan: ["200", "400", "2000", "20"]
        jawaban: 0
        penjelasan: "Akar dari 40000 adalah 200."

  - id: "q8-3"
    judul: "Saham Tenang vs Saham Liar"
    menit: 7
    materi: |
      Sekarang saatnya membandingkan dua saham. 🥊

      Saham yang harganya stabil disebut **tenang**.
      Saham yang harganya naik-turun tajam disebut **liar**.

      Caranya: hitung simpangan masing-masing, lalu bandingkan.

      ```python
      def simpangan(data):
          total = 0
          for x in data:
              total = total + x
          rata = total / len(data)
          jumlah = 0
          for x in data:
              selisih = x - rata
              jumlah = jumlah + selisih * selisih
          return int((jumlah / len(data)) ** 0.5)

      a = [900, 900, 1100, 1100]
      b = [800, 800, 1200, 1200]
      print(simpangan(a))
      print(simpangan(b))
      ```

      Hasilnya 100 dan 200. Jadi saham b lebih liar.

      Simpangan yang lebih besar artinya getarannya lebih besar.
      Kita bisa menutup laporan dengan kesimpulan pakai if dan else:

      ```python
      if simpangan(b) > simpangan(a):
          print("b lebih liar")
      else:
          print("a lebih tenang")
      ```

      Fungsi `simpangan` kamu tulis sekali, lalu dipakai berkali-kali.
      Itu kekuatan fungsi!

      Ayo bandingkan sahammu di contoh bawah!
    contoh:
      - kode: |
          def simpangan(data):
              total = 0
              for x in data:
                  total = total + x
              rata = total / len(data)
              jumlah = 0
              for x in data:
                  selisih = x - rata
                  jumlah = jumlah + selisih * selisih
              return int((jumlah / len(data)) ** 0.5)

          tenang = [900, 900, 1100, 1100]
          liar = [800, 800, 1200, 1200]
          s1 = simpangan(tenang)
          s2 = simpangan(liar)
          print("Tenang:", s1)
          print("Liar:", s2)
          if s2 > s1:
              print("Pemenang: saham liar")
          else:
              print("Pemenang: saham tenang")
        penjelasan: "Saham tenang simpangannya 100, saham liar 200. Yang liar menang getar."
      - kode: |
