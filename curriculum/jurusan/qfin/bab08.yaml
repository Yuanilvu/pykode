          print("Kesimpulan:", nama1, "lebih liar")
      elif s2 > s1:
          print("Kesimpulan:", nama2, "lebih liar")
      else:
          print("Kesimpulan: sama tenangnya")
    petunjuk:
      - "Bikin dulu fungsi simpangan(data) yang mengembalikan simpangan."
      - "Baca 4 harga tiap saham ke dalam list dengan loop range(4)."
      - "Bandingkan s1 dan s2: yang lebih besar lebih liar. Kalau sama, cetak sama tenangnya."

  - id: "sq8-4"
    judul: "Laporan Risiko Pak Otong"
    sulit: "sulit"
    cerita: |
      Pak Otong minta laporan risiko satu saham. Baca nama saham, lalu n,
      lalu n harganya. Cetak laporan lengkap: judulnya, nama sahamnya,
      banyak datanya, rata-rata, varians, dan simpangan. Kalau simpangannya
      lebih dari 150, sahamnya LIAR. Kalau tidak, TENANG. Ikuti contoh ya,
      laporannya harus rapi baris demi baris!
    input: "Baris pertama nama saham, lalu n, lalu n baris harga."
    output: "Tujuh baris: judul, 'Saham: <nama>', 'Banyak data: <n>', 'Rata-rata: <angka>', 'Varians: <angka>', 'Simpangan: <angka>', lalu 'Kesimpulan: TENANG/LIAR'"
    contoh:
      - input: "TLKM\n4\n900\n900\n1100\n1100"
        output: "=== LAPORAN RISIKO ===\nSaham: TLKM\nBanyak data: 4\nRata-rata: 1000\nVarians: 10000\nSimpangan: 100\nKesimpulan: TENANG"
      - input: "BBRI\n4\n800\n800\n1200\n1200"
        output: "=== LAPORAN RISIKO ===\nSaham: BBRI\nBanyak data: 4\nRata-rata: 1000\nVarians: 40000\nSimpangan: 200\nKesimpulan: LIAR"
    tes:
      - input: "TLKM\n4\n900\n900\n1100\n1100"
        output: "=== LAPORAN RISIKO ===\nSaham: TLKM\nBanyak data: 4\nRata-rata: 1000\nVarians: 10000\nSimpangan: 100\nKesimpulan: TENANG"
      - input: "BBRI\n4\n800\n800\n1200\n1200"
        output: "=== LAPORAN RISIKO ===\nSaham: BBRI\nBanyak data: 4\nRata-rata: 1000\nVarians: 40000\nSimpangan: 200\nKesimpulan: LIAR"
      - input: "ASII\n2\n1000\n1300"
        output: "=== LAPORAN RISIKO ===\nSaham: ASII\nBanyak data: 2\nRata-rata: 1150\nVarians: 22500\nSimpangan: 150\nKesimpulan: TENANG"
      - input: "GOTO\n4\n500\n500\n500\n500"
        output: "=== LAPORAN RISIKO ===\nSaham: GOTO\nBanyak data: 4\nRata-rata: 500\nVarians: 0\nSimpangan: 0\nKesimpulan: TENANG"
      - input: "UNVR\n2\n100\n700"
        output: "=== LAPORAN RISIKO ===\nSaham: UNVR\nBanyak data: 2\nRata-rata: 400\nVarians: 90000\nSimpangan: 300\nKesimpulan: LIAR"
    solusi: |
      def rata_rata(data):
          total = 0
          for x in data:
              total = total + x
          return int(total / len(data))


      def varians(data):
          rata = rata_rata(data)
          jumlah = 0
          for x in data:
              selisih = x - rata
              jumlah = jumlah + selisih * selisih
          return int(jumlah / len(data))


      nama = input()
      n = int(input())
      data = []
      for i in range(n):
          data.append(int(input()))

      v = varians(data)
      s = int(v ** 0.5)

      print("=== LAPORAN RISIKO ===")
      print("Saham:", nama)
      print("Banyak data:", n)
      print("Rata-rata:", rata_rata(data))
      print("Varians:", v)
      print("Simpangan:", s)
      if s > 150:
          print("Kesimpulan: LIAR")
      else:
          print("Kesimpulan: TENANG")
    petunjuk:
      - "Bikin fungsi rata_rata(data) dan varians(data) dulu. varians memakai rata_rata di dalamnya."
      - "Cetak laporan baris demi baris sesuai contoh, mulai dari judulnya."
      - "Simpangan = varians ** 0.5. Kalau simpangan lebih dari 150, kesimpulannya LIAR."
