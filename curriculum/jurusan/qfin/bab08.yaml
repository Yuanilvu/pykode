    kuis:
      - soal: "Saham disebut liar kalau..."
        pilihan: ["harganya tetap terus", "harganya naik-turun tajam", "namanya panjang", "tidak punya data"]
        jawaban: 1
        penjelasan: "Saham liar harganya bergoyang tajam."
      - soal: "Simpangan saham A 150 dan saham B 90. Yang lebih tenang adalah..."
        pilihan: ["A", "B", "dua-duanya", "tidak ada"]
        jawaban: 1
        penjelasan: "Simpangan B lebih kecil, jadi B lebih tenang."
      - soal: "Kenapa kita pakai satu fungsi simpangan() untuk dua saham?"
        pilihan: ["tulis sekali, pakai berkali-kali", "biar kodenya panjang", "supaya angkanya berubah", "biar filenya hilang"]
        jawaban: 0
        penjelasan: "Fungsi ditulis sekali lalu bisa dipakai untuk data apa saja."

soal:
  - id: "sq8-1"
    judul: "Jarak Terjauh Harga Kancil"
    sulit: "mudah"
    cerita: |
      Kancil mencatat beberapa harga saham. Ia ingin tahu rata-ratanya dan
      harga yang paling jauh dari rata-rata itu. Baca n dulu, lalu n harga
      satu per satu. Hitung rata-ratanya, lalu cari jarak terjauhnya.
      Jarak itu selalu angka positif. Cetak rata-rata dan jarak terjauh!
    input: "Baris pertama n. Lalu n baris: harga tiap hari."
    output: "Dua baris: 'Rata-rata: <angka>' lalu 'Selisih terjauh: <angka>'"
    contoh:
      - input: "4\n900\n1000\n1100\n1200"
        output: "Rata-rata: 1050\nSelisih terjauh: 150"
      - input: "3\n1000\n1000\n1000"
        output: "Rata-rata: 1000\nSelisih terjauh: 0"
    tes:
      - input: "4\n900\n1000\n1100\n1200"
        output: "Rata-rata: 1050\nSelisih terjauh: 150"
      - input: "3\n1000\n1000\n1000"
        output: "Rata-rata: 1000\nSelisih terjauh: 0"
      - input: "5\n500\n600\n700\n800\n900"
        output: "Rata-rata: 700\nSelisih terjauh: 200"
      - input: "2\n800\n1000"
        output: "Rata-rata: 900\nSelisih terjauh: 100"
      - input: "4\n2000\n2000\n4000\n4000"
        output: "Rata-rata: 3000\nSelisih terjauh: 1000"
    solusi: |
      n = int(input())
      data = []
      for i in range(n):
          data.append(int(input()))

      total = 0
      for x in data:
          total = total + x
      rata = int(total / n)

      terjauh = 0
      for x in data:
          selisih = x - rata
          if selisih < 0:
              selisih = -selisih
          if selisih > terjauh:
              terjauh = selisih

      print("Rata-rata:", rata)
      print("Selisih terjauh:", terjauh)
    petunjuk:
      - "Baca semua harga dulu, simpan ke dalam list."
      - "Rata-rata = jumlah semua harga dibagi n. Bungkus dengan int()."
      - "Hitung jarak tiap harga dari rata-rata. Kalau minus, balik jadi plus dengan -selisih."

