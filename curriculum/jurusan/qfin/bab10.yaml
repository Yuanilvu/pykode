    solusi: |
      class Saham:
          def __init__(self, nama, harga):
              self.nama = nama
              self.harga = harga

          def analisis(self):
              total = 0
              for h in self.harga:
                  total = total + h
              rata = total // len(self.harga)

              jumlah = 0
              for h in self.harga:
                  selisih = h - rata
                  jumlah = jumlah + selisih * selisih
              simpangan = int((jumlah / len(self.harga)) ** 0.5)

              return {"rata": rata, "maks": max(self.harga), "min": min(self.harga),
                      "simpangan": simpangan}

          def rekomendasi(self):
              hasil = self.analisis()
              akhir = self.harga[len(self.harga) - 1]
              if akhir < hasil["rata"]:
                  return "BELI"
              elif akhir > hasil["rata"]:
                  return "JUAL"
              else:
                  return "TAHAN"


      n = int(input())
      daftar = []
      for i in range(n):
          baris = input().split()
          harga = []
          for x in baris[1:]:
              harga.append(int(x))
          daftar.append(Saham(baris[0], harga))

      for s in daftar:
          hasil = s.analisis()
          print(f"=== LAPORAN SAHAM {s.nama} ===")
          print("Rata-rata:", hasil["rata"])
          print("Tertinggi:", hasil["maks"])
          print("Terendah:", hasil["min"])
          print("Simpangan:", hasil["simpangan"])
          print("Harga terakhir:", s.harga[len(s.harga) - 1])
          print("Rekomendasi:", s.rekomendasi())

      paling_tenang = daftar[0]
      for s in daftar:
          if s.analisis()["simpangan"] < paling_tenang.analisis()["simpangan"]:
              paling_tenang = s

      print("Total saham:", n)
      print("Paling tenang:", paling_tenang.nama)
      f = open("laporan.txt", "w")
      f.write("Paling tenang: " + paling_tenang.nama)
      f.close()
    petunjuk:
      - "Tiap baris data: baris = input().split(). Nama = baris[0], sisanya harga."
      - "Pakai for x in baris[1:] untuk mengubah harga jadi angka dengan int(x)."
      - "Simpan semua objek di list. Lalu loop dua kali: cetak laporan, dan cari simpangan terkecil."
