  - id: "q10-2"
    judul: "Fungsi Analisis"
    menit: 8
    materi: |
      Analis butuh angka ringkasan. Di Modul 8 kamu sudah belajar statistik:
      rata-rata, jarak, varians, dan simpangan. Sekarang semua itu kita bungkus
      jadi **satu fungsi** bernama `analisis()`.

      Fungsinya menerima daftar harga, lalu mengembalikan **dict**. Dict itu seperti
      kamus: ada nama kunci dan ada isinya.

      ```python
      def analisis(harga):
          total = 0
          for h in harga:
              total = total + h
          rata = total // len(harga)

          jumlah = 0
          for h in harga:
              selisih = h - rata
              jumlah = jumlah + selisih * selisih
          simpangan = int((jumlah / len(harga)) ** 0.5)

          return {"rata": rata, "maks": max(harga), "min": min(harga),
                  "simpangan": simpangan}
      ```

      - `rata` = jumlah semua harga dibagi banyaknya harga (pakai bagi bulat).
      - `maks` = harga tertinggi, `min` = harga terendah.
      - `simpangan` = akar dari rata-rata kuadrat jarak, seperti di Modul 8.
        Makin besar simpangannya, makin liar harganya bergoyang.

      Cara mengambil isinya: tulis kuncinya dalam kurung siku.

      ```python
      hasil = analisis([3000, 4000, 5000])
      print(hasil["rata"])
      ```

      Hasilnya `4000`. Fungsi ini dipakai berkali-kali nanti, jadi tulis sekali saja.
      Ayo coba di contoh bawah!
    contoh:
      - kode: |
          def analisis(harga):
              total = 0
              for h in harga:
                  total = total + h
              rata = total // len(harga)

              jumlah = 0
              for h in harga:
                  selisih = h - rata
                  jumlah = jumlah + selisih * selisih
              simpangan = int((jumlah / len(harga)) ** 0.5)

              return {"rata": rata, "maks": max(harga), "min": min(harga),
                      "simpangan": simpangan}


          hasil = analisis([3000, 4000, 5000])
          print("Rata-rata:", hasil["rata"])
          print("Tertinggi:", hasil["maks"])
          print("Terendah:", hasil["min"])
          print("Simpangan:", hasil["simpangan"])
        penjelasan: "Rata-ratanya 4000, tertinggi 5000, terendah 3000, simpangannya 816."
      - kode: |
          def analisis(harga):
              total = 0
              for h in harga:
                  total = total + h
              rata = total // len(harga)

              jumlah = 0
