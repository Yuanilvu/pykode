pelajaran:
  - id: "q10-1"
    judul: "Gabung Semua: Kelas + Data"
    menit: 8
    materi: |
      Saatnya jadi analis saham sungguhan! 💼 Di proyek ini semua jurusmu dipakai.
      Kita mulai dari **kelas** yang kamu rakit di Modul 6.

      Ingat kelas Saham? Isinya nama dan harga. Sekarang kita tambah **method
      ringkasan**. Method itu jurus milik objek, dipanggil pakai titik.

      ```python
      class Saham:
          def __init__(self, nama, harga):
              self.nama = nama
              self.harga = harga

          def ringkasan(self):
              return f"{self.nama}: {self.harga}"
      ```

      `ringkasan()` mengembalikan kalimat siap cetak.

      ```python
      s = Saham("TLKM", 4000)
      print(s.ringkasan())
      ```

      Hasilnya `TLKM: 4000`. Kenapa pakai kelas? Karena data saham dipakai
      bersama-sama terus. Dengan kelas, nama dan harganya tidak gampang tertukar.

      **Datanya banyak?** Masukkan objeknya ke list, lalu loop satu-satu.
      Persis seperti cara kumpulkan objek di Modul 6.

      ```python
      daftar = [Saham("TLKM", 4000), Saham("BBRI", 5000)]
      for s in daftar:
          print(s.ringkasan())
      ```

      Ayo coba di contoh bawah. Ini pondasinya; nanti kita hitung statistiknya!
    contoh:
      - kode: |
          class Saham:
              def __init__(self, nama, harga):
                  self.nama = nama
                  self.harga = harga

              def ringkasan(self):
                  return f"{self.nama}: {self.harga}"


          s = Saham("TLKM", 4000)
          print(s.ringkasan())
        penjelasan: "ringkasan() mengembalikan 'TLKM: 4000', lalu dicetak."
