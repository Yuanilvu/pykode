bab: 3
judul: "String & Angka"
emoji: "🔢"
warna: "#f59e0b"
deskripsi: "Hitung angka dan rakit kalimat: aritmatika & f-string."

pelajaran:
  - id: "3-1"
    judul: "Angka Main Hitung"
    menit: 8
    materi: |
      Python itu kalkulator super! Sekarang saatnya berhitung. Tanda
      hitung di Python:

      - `+` tambah
      - `-` kurang
      - `*` kali (bintang, bukan huruf x!)
      - `/` bagi

      Pembagian di Python selalu memberi angka desimal. Jadi `10 / 4`
      hasilnya `2.5`, bukan `2`.

      ## Urutan hitung

      Python mengikuti aturan matematika biasa. Yang di dalam kurung
      dikerjakan paling dulu. Lalu kali dan bagi. Baru tambah dan kurang.

      - `2 + 3 * 4` hasilnya 14 (kali dulu: 3 * 4 = 12, baru ditambah 2)
      - `(2 + 3) * 4` hasilnya 20 (kurung dulu: 2 + 3 = 5, baru dikali 4)

      Kalau ragu, pakai saja tanda kurung. Tidak ada salahnya. Kode juga
      jadi lebih jelas dibaca.

      Angka bisa datang dari variabel juga. Simpan dulu ke variabel,
      lalu hitung pakai nama variabelnya. Python mengambil isinya dan
      menghitung. Contoh pertama memakai angka langsung. Contoh kedua
      memakai variabel. Jalankan keduanya dan bandingkan hasilnya!
    contoh:
      - kode: |
          print(2 + 3 * 4)
        penjelasan: "Kali dikerjakan dulu: 3 * 4 = 12, lalu 2 + 12 = 14."
      - kode: |
          a = 10
          b = 4
          print('Hasil bagi:', a / b)
        penjelasan: "10 / 4 hasilnya 2.5. Pembagian di Python selalu memberi desimal."
    kuis:
      - soal: "Berapa hasil 10 / 4 di Python?"
        pilihan:
          - "2"
          - "2.5"
          - "2 sisa 2"
          - "error"
        jawaban: 1
        penjelasan: "Pembagian di Python selalu memberi desimal: 10 / 4 = 2.5."
      - soal: "Berapa hasil 2 + 3 * 4?"
        pilihan:
          - "20"
          - "14"
          - "24"
          - "9"
        jawaban: 1
        penjelasan: "Kali dulu: 3 * 4 = 12. Baru ditambah 2, jadi 14."
      - soal: "Berapa hasil (2 + 3) * 4?"
        pilihan:
          - "14"
          - "9"
          - "20"
          - "24"
        jawaban: 2
        penjelasan: "Yang di dalam kurung dikerjakan dulu: 2 + 3 = 5. Lalu 5 * 4 = 20."
      - soal: "Berapa hasil 10 + 2 * 3?"
        pilihan:
          - "36"
          - "16"
          - "12"
          - "32"
        jawaban: 1
        penjelasan: "Kali dulu: 2 * 3 = 6. Lalu 10 + 6 = 16."
      - soal: "Berapa hasil 100 / 4?"
        pilihan:
          - "25"
          - "25.0"
          - "25 sisa 0"
          - "error"
        jawaban: 1
        penjelasan: "Pembagian selalu memberi angka desimal. 100 / 4 = 25.0."

  - id: "3-2"
    judul: "Kalimat Ajaib: f-string"
    menit: 7
    materi: |
      Pernah lihat poster yang rapi? Isinya kalimat lengkap dengan angka
      yang menyatu. Di Python, kita bisa membuat kalimat seperti itu
      dengan f-string. f-string itu singkatan dari "format string".

      Cara pakainya: tulis huruf `f` di depan tanda kutip. Lalu sisipkan
      variabel di dalam kurung kurawal `{}`:

      `nama = 'Budi'`
      `print(f'Halo, {nama}!')`

      Python mengganti `{nama}` dengan isi variabelnya. Jadi hasilnya:
      `Halo, Budi!`

      Kerennya, di dalam kurung kurawal kita boleh langsung menulis
      hitungan:

      `print(f'Total: {1500 + 2500}')`

      Hasilnya `Total: 4000`. Python menghitung dulu, baru mencetak.

      Kenapa f-string lebih baik daripada print dengan koma? Karena kita
      bisa mengatur spasi dan tanda baca dengan bebas. Dengan koma,
      Python menaruh spasi di antara nilai. Kadang muncul di tempat yang
      tidak kita mau, misalnya sebelum tanda seru. Dengan f-string,
      semua yang kita tulis di dalam kutipan tercetak apa adanya.

      Mulai sekarang, f-string jadi senjata andalanmu untuk mencetak
      kalimat yang rapi!

      Satu lagi: f-string bisa memuat banyak variabel sekaligus. Tinggal
      tulis beberapa pasang kurung kurawal dalam satu kalimat. Python
      mengganti semuanya satu per satu.
    contoh:
      - kode: |
          nama = 'Kancil'
          print(f'Selamat datang, {nama}!')
        penjelasan: "Kurung kurawal {nama} diganti isi variabelnya. Jadi tercetak 'Selamat datang, Kancil!'."
      - kode: |
          uang = 5000
          harga = 1500
          print(f'Uangku {uang} rupiah, sisa jajan {uang - harga}')
        penjelasan: "Di dalam kurung kurawal boleh langsung ada hitungan: 5000 - 1500 = 3500."
    kuis:
      - soal: "Kode ini mencetak apa?\n\nnama = 'Budi'\nprint(f'Halo, {nama}!')"
        pilihan:
          - "Halo, {nama}!"
          - "Halo, Budi!"
          - "f'Halo, Budi!'"
          - "error"
        jawaban: 1
        penjelasan: "f-string mengganti {nama} dengan isi variabelnya, yaitu 'Budi'."
      - soal: "Huruf apa yang ditulis di depan tanda kutip untuk membuat f-string?"
        pilihan:
          - "s"
          - "f"
          - "p"
          - "x"
        jawaban: 1
        penjelasan: "f-string diawali huruf f. Contoh: f'halo {nama}'."
      - soal: "Apa hasil dari print(f'Total: {1500 + 2500}')?"
        pilihan:
          - "Total: {1500 + 2500}"
          - "Total: 4000"
          - "Total: 1500 + 2500"
          - "error"
        jawaban: 1
        penjelasan: "Di dalam kurung kurawal boleh ada hitungan. Python menghitung dulu: 1500 + 2500 = 4000."
      - soal: "Kode ini mencetak apa?\n\numur = 13\nprint(f'Umurku {umur} tahun')"
        pilihan:
          - "Umurku {umur} tahun"
          - "Umurku 13 tahun"
          - "Umurku umur tahun"
          - "error"
        jawaban: 1
        penjelasan: "f-string mengganti {umur} dengan isi variabelnya, yaitu 13."
      - soal: "Kode ini mencetak apa?\n\nharga = 2500\nprint(f'Harga: {harga * 2}')"
        pilihan:
          - "Harga: 2500 * 2"
          - "Harga: 5000"
          - "Harga: harga * 2"
          - "error"
        jawaban: 1
        penjelasan: "Di dalam kurung kurawal boleh ada hitungan. 2500 * 2 = 5000."

  - id: "3-3"
    judul: "Rakit Kalimat & Ukur Panjang"
    menit: 8
    materi: |
      Kalau f-string merakit kalimat dengan kurung kurawal, ada cara
      lain. Menyambung tulisan dengan tanda tambah `+`. Ini namanya
      menggabungkan string.

      `'Py' + 'thon'` hasilnya `'Python'`.

      ## Angka dan tulisan belum tentu akur

      Coba tebak: `'Umurku ' + 13` — hasilnya? Error! Python tidak mau
      menyambung tulisan dengan angka. Solusinya: ubah angka jadi tulisan
      dulu pakai `str()`.

      `'Umurku ' + str(13)` hasilnya `'Umurku 13'`.

      Jadi `str()` mengubah angka menjadi tulisan. Kebalikan dari `int()`
      dan `float()` yang kamu pelajari di Bab 2.

      ## Mengukur panjang tulisan

      Pernah penasaran berapa huruf dalam namamu? Python bisa
      menghitungnya dengan `len()`:

      `len('Python')` hasilnya 6.

      `len()` menghitung semua karakter: huruf, angka, dan spasi. Jadi
      `len('SMPN 1')` hasilnya 6 juga — huruf S, M, P, N, spasi, dan
      angka 1.

      Mana yang kamu pakai, f-string atau tanda tambah? Dua-duanya boleh.
      Banyak programmer memakai f-string karena lebih rapi. Tapi kamu
      tetap harus paham `+` dan `str()` karena sering muncul di kode
      orang lain.
    contoh:
      - kode: |
          kata1 = 'Py'
          kata2 = 'thon'
          print(kata1 + kata2)
        penjelasan: "Tanda + menyambung dua tulisan tanpa spasi: 'Py' + 'thon' = 'Python'."
      - kode: |
          nama = 'Python'
          print('Jumlah huruf:', len(nama))
        penjelasan: "len() menghitung karakter: P-y-t-h-o-n ada 6 huruf."
    kuis:
      - soal: "Berapa hasil 'Py' + 'thon'?"
        pilihan:
          - "'Py thon'"
          - "'Python'"
          - "error"
          - "'Py+'thon'"
        jawaban: 1
        penjelasan: "Tanda + menyambung dua tulisan tanpa spasi: 'Py' + 'thon' = 'Python'."
      - soal: "Apa yang terjadi kalau kita menulis 'Umurku ' + 13?"
        pilihan:
          - "menjadi 'Umurku 13'"
          - "error"
          - "menjadi 13"
          - "menjadi 'Umurku '"
        jawaban: 1
        penjelasan: "Python tidak bisa menyambung tulisan dengan angka. Ubah dulu angkanya dengan str(13)."
      - soal: "Berapa hasil len('Python')?"
        pilihan:
          - "5"
          - "6"
          - "7"
          - "error"
        jawaban: 1
        penjelasan: "len() menghitung jumlah karakter: P-y-t-h-o-n ada 6 huruf."
      - soal: "Berapa hasil len('Aku' + ' hebat')?"
        pilihan:
          - "8"
          - "9"
          - "10"
          - "error"
        jawaban: 1
        penjelasan: "'Aku' + ' hebat' jadi 'Aku hebat'. Hitung karakternya: A-k-u-spasi-h-e-b-a-t = 9."
      - soal: "Kode ini mencetak apa?\n\nprint(str(7) + ' hari')"
        pilihan:
          - "7 hari"
          - "error"
          - "14"
          - "'7' hari"
        jawaban: 0
        penjelasan: "str(7) mengubah angka 7 jadi tulisan '7'. Lalu disambung dengan ' hari' jadi '7 hari'."

  - id: "3-4"
    judul: "Besar atau Kecil"
    menit: 6
    materi: |
      Pernah mengetik kata sandi dan lupa memakai huruf besar? Komputer
      menganggap 'Kancil' dan 'kancil' sebagai dua tulisan yang berbeda!
      Untungnya Python punya alat untuk merapikan huruf besar-kecil.

      ## Huruf besar semua: upper()

      `'kancil'.upper()` hasilnya `'KANCIL'`.

      ## Huruf kecil semua: lower()

      `'KANCIL'.lower()` hasilnya `'kancil'`.

      Perhatikan cara menulisnya: nama tulisan dulu, lalu titik, lalu
      nama caranya. Ini disebut metode — cara khusus yang menempel pada
      tulisan. Kamu akan sering melihat pola seperti ini di Python.

      ## Buat apa sih?

      - Merapikan ketikan dari user. Supaya 'KANCIL', 'Kancil', dan
        'kancil' dianggap sama
      - Membuat tulisan di game jadi besar semua untuk efek teriak
      - Membandingkan jawaban tanpa peduli besar-kecil huruf

      Metode tidak mengubah tulisan aslinya. `upper()` dan `lower()`
      membuat tulisan baru sebagai hasil. Kalau mau menyimpannya,
      masukkan ke variabel baru:

      `teks_besar = teks.upper()`

      Coba dua contoh di bawah ini, lalu ubah-ubah hurufnya dan lihat
      hasilnya!

      Coba juga tulisan campuran seperti 'PyThOn'. `.upper()` membuat
      semua hurufnya besar. `.lower()` membuat semuanya kecil. Seru,
      kan? Sekarang kamu bisa merapikan tulisan apa pun!
    contoh:
      - kode: |
          print('kancil'.upper())
        penjelasan: "upper() mengubah semua huruf menjadi besar: KANCIL."
      - kode: |
          print('PYTHON'.lower())
        penjelasan: "lower() mengubah semua huruf menjadi kecil: python."
    kuis:
      - soal: "Apa hasil 'Python'.upper()?"
        pilihan:
          - "'python'"
          - "'PYTHON'"
          - "'Python'"
          - "error"
        jawaban: 1
        penjelasan: "upper() mengubah semua huruf menjadi besar: PYTHON."
      - soal: "Apa hasil 'Belajar'.lower()?"
        pilihan:
          - "'BELAJAR'"
          - "'belajar'"
          - "'Belajar'"
          - "error"
        jawaban: 1
        penjelasan: "lower() mengubah semua huruf menjadi kecil: belajar."
      - soal: "Mengapa 'Kancil' dan 'kancil' dianggap berbeda oleh Python?"
        pilihan:
          - "karena yang satu lebih panjang"
          - "karena Python membedakan huruf besar dan kecil"
          - "karena ada spasi"
          - "sebenarnya sama saja"
        jawaban: 1
        penjelasan: "Python membedakan huruf besar dan kecil. upper() dan lower() bisa dipakai untuk menyamakan."
      - soal: "Kode ini mencetak apa?\n\nprint('pyKode'.upper())"
        pilihan:
          - "pyKode"
          - "PYKODE"
          - "pykode"
          - "error"
        jawaban: 1
        penjelasan: "upper() membuat semua huruf jadi besar: PYKODE."
      - soal: "Kode ini mencetak apa?\n\nkata = 'Seru'\nprint(kata.lower())\nprint(kata)"
        pilihan:
          - "seru lalu seru"
          - "seru lalu Seru"
          - "Seru lalu seru"
          - "error"
        jawaban: 1
        penjelasan: "lower() membuat tulisan baru 'seru'. Tulisan di variabel kata tetap 'Seru'."

  - id: "3-5"
    judul: "Mengulang Teks dengan Bintang"
    menit: 6
    materi: |
      Tahu fotokopi? Satu kertas bisa digandakan berkali-kali.
      Di Python, tulisan juga bisa digandakan! Pakai tanda bintang `*`.

      `'ha' * 3` hasilnya `'hahaha'`. Tanda `*` mengulang tulisan sebanyak
      angka di belakangnya.

      ## Buat apa mengulang teks?

      - Membuat garis pemisah: `'=' * 10` hasilnya `==========`. Bagus
        untuk memisahkan bagian di layar.
      - Membuat efek suara di game: `'Tuk ' * 3` hasilnya `Tuk Tuk Tuk`.
      - Membuat pola dekorasi: `'*' * 5` hasilnya `*****`.

      ## Aturannya

      Angka pengulang harus bilangan bulat. `'ha' * 2` boleh.
      Tapi `'ha' * 2.5` error! Python tidak bisa mengulang setengah kali.

      Urutan tidak masalah: `3 * 'ha'` hasilnya sama dengan `'ha' * 3`.
      Dua-duanya `'hahaha'`.

      Beda dengan tanda `+` yang menyambung, tanda `*` menggandakan.
      Sambung dan gandakan bisa dipakai bareng:
      `'Ayo ' * 2 + 'semangat!'` hasilnya `'Ayo Ayo semangat!'`.

      Mengulang teks itu seperti mesin stempel. Satu cap, berkali-kali dipakai.
      Coba ganti angka dan tulisannya di contoh, lalu jalankan!
    contoh:
      - kode: |
          print('ha' * 3)
        penjelasan: "Tanda * mengulang tulisan. 'ha' diulang 3 kali jadi 'hahaha'."
      - kode: |
          print('=' * 8)
          print('Ayo ' * 2 + 'semangat!')
        penjelasan: "'=' diulang 8 kali jadi garis. Lalu 'Ayo ' diulang 2 kali dan disambung."
    kuis:
      - soal: "Kode ini mencetak apa?\n\nprint('ha' * 3)"
        pilihan:
          - "hahaha"
          - "ha3"
          - "ha ha ha"
          - "error"
        jawaban: 0
        penjelasan: "Tanda * mengulang tulisan 3 kali: 'ha' + 'ha' + 'ha' = 'hahaha'."
      - soal: "Kode ini mencetak apa?\n\nprint('=' * 5)"
        pilihan:
          - "=5"
          - "====="
          - "=====5"
          - "error"
        jawaban: 1
        penjelasan: "'=' diulang 5 kali. Hasilnya lima tanda sama dengan."
      - soal: "Mengapa 'ha' * 2.5 error?"
        pilihan:
          - "karena 2.5 bukan bilangan bulat"
          - "karena 'ha' terlalu pendek"
          - "karena tanda * hanya untuk angka besar"
          - "sebenarnya tidak error"
        jawaban: 0
        penjelasan: "Pengulang harus bilangan bulat. Tidak bisa mengulang setengah kali."


soal:
  - id: "s3-1"
    judul: "Uang Kembalian Kantin"
    sulit: "mudah"
    cerita: |
      Si Kancil jajan di kantin sekolah. Dia membayar dengan uang
      lembaran. Bu Kantin menghitung kembaliannya. Hari ini Kancil
      membayar 5000 rupiah. Jajannya seharga 3500, jadi kembaliannya
      1500. Program membaca dua angka: uang yang dibayar dan harga
      jajanan. Bantuin Bu Kantin: kurangkan harga dari uang, lalu cetak
      hasilnya.
    input: "Dua baris: uang yang dibayar (int), lalu harga jajanan (int)."
    output: "Satu baris: Kembalian: lalu angka kembalian."
    contoh:
      - input: "5000\n3500"
        output: "Kembalian: 1500"
      - input: "10000\n7500"
        output: "Kembalian: 2500"
    tes:
      - input: "5000\n3500"
        output: "Kembalian: 1500"
      - input: "10000\n7500"
        output: "Kembalian: 2500"
      - input: "2000\n2000"
        output: "Kembalian: 0"
      - input: "15000\n12300"
        output: "Kembalian: 2700"
      - input: "5000\n1500"
        output: "Kembalian: 3500"
    solusi: |
      uang = int(input())
      harga = int(input())
      print('Kembalian:', uang - harga)
    petunjuk:
      - "Baca dua angka dengan int(input()) berurutan."
      - "Kembalian = uang dikurangi harga."
      - "Cetak dengan print('Kembalian:', uang - harga)."

  - id: "s3-2"
    judul: "Rata-Rata Nilai Ulangan"
    sulit: "sedang"
    cerita: |
      Bu Guru memberi Kancil tiga nilai ulangan. Kancil penasaran,
      berapa rata-ratanya? Program membaca tiga nilai angka bulat. Lalu
      mencetak rata-ratanya. Rata-rata dihitung dengan menjumlahkan
      ketiga nilai. Lalu membaginya dengan tiga. Hasilnya bisa angka
      desimal, jadi jangan dibulatkan. Bantuin Kancil menghitung dan
      mencetak rata-ratanya!
    input: "Tiga baris: nilai pertama, kedua, dan ketiga (int)."
    output: "Satu baris: Rata-rata: lalu angka rata-rata (bisa desimal)."
    contoh:
      - input: "7\n8\n9"
        output: "Rata-rata: 8.0"
      - input: "10\n20\n30"
        output: "Rata-rata: 20.0"
    tes:
      - input: "7\n8\n9"
        output: "Rata-rata: 8.0"
      - input: "10\n20\n30"
        output: "Rata-rata: 20.0"
      - input: "5\n5\n5"
        output: "Rata-rata: 5.0"
      - input: "8\n9\n10"
        output: "Rata-rata: 9.0"
      - input: "6\n6\n9"
        output: "Rata-rata: 7.0"
    solusi: |
      a = int(input())
      b = int(input())
      c = int(input())
      print('Rata-rata:', (a + b + c) / 3)
    petunjuk:
      - "Baca tiga nilai dan simpan di variabel a, b, c."
      - "Jumlahkan lalu bagi tiga. Pakai tanda kurung supaya penjumlahan dikerjakan dulu."
      - "Cetak dengan print('Rata-rata:', (a + b + c) / 3)."

  - id: "s3-3"
    judul: "Kartu Anggota Perpustakaan"
    sulit: "sulit"
    cerita: |
      Perpustakaan sekolah punya komputer baru untuk membuat kartu
      anggota. Saat anggota baru mendaftar, mereka mengetik nama.
      Komputer mencetak kartu berisi: nama asli, jumlah huruf dalam
      nama, nama huruf besar semua, dan nama huruf kecil semua.
      Contohnya, nama 'Kancil' punya 6 huruf. Huruf besarnya 'KANCIL',
      huruf kecilnya 'kancil'. Bantuin Kancil menulis programnya: baca
      satu nama, cetak empat baris persis seperti contoh.
    input: "Satu baris: nama anggota (tulisan)."
    output: "Empat baris: Kartu untuk <nama>, Jumlah huruf: <n>, Huruf besar: <NAMA>, Huruf kecil: <nama>."
    contoh:
      - input: "Kancil"
        output: "Kartu untuk Kancil\nJumlah huruf: 6\nHuruf besar: KANCIL\nHuruf kecil: kancil"
      - input: "budi"
        output: "Kartu untuk budi\nJumlah huruf: 4\nHuruf besar: BUDI\nHuruf kecil: budi"
    tes:
      - input: "Kancil"
        output: "Kartu untuk Kancil\nJumlah huruf: 6\nHuruf besar: KANCIL\nHuruf kecil: kancil"
      - input: "budi"
        output: "Kartu untuk budi\nJumlah huruf: 4\nHuruf besar: BUDI\nHuruf kecil: budi"
      - input: "SITI"
        output: "Kartu untuk SITI\nJumlah huruf: 4\nHuruf besar: SITI\nHuruf kecil: siti"
      - input: "Andi Pratama"
        output: "Kartu untuk Andi Pratama\nJumlah huruf: 12\nHuruf besar: ANDI PRATAMA\nHuruf kecil: andi pratama"
      - input: "Rina"
        output: "Kartu untuk Rina\nJumlah huruf: 4\nHuruf besar: RINA\nHuruf kecil: rina"
    solusi: |
      nama = input()
      print(f'Kartu untuk {nama}')
      print(f'Jumlah huruf: {len(nama)}')
      print(f'Huruf besar: {nama.upper()}')
      print(f'Huruf kecil: {nama.lower()}')
    petunjuk:
      - "Simpan nama di variabel, lalu pakai f-string untuk mencetak kalimat."
      - "Jumlah huruf didapat dari len(nama)."
      - "Huruf besar pakai nama.upper(). Huruf kecil pakai nama.lower()."

  - id: "s3-4"
    judul: "Dua Buku"
    sulit: "mudah"
    cerita: |
      Kancil ke toko buku. Dia membeli dua buku.
      Buku pertama harganya 3000 rupiah. Buku kedua 4000 rupiah.
      Kasir menghitung totalnya: 3000 + 4000 = 7000.
      Bantuin kasir: baca harga dua buku, lalu cetak totalnya.
      Cetak dengan f-string, persis: Total: 7000
    input: "Dua baris: harga buku pertama (int), lalu harga buku kedua (int)."
    output: "Satu baris: Total: lalu jumlah kedua harga."
    contoh:
      - input: "3000\n4000"
        output: "Total: 7000"
      - input: "1500\n2500"
        output: "Total: 4000"
    tes:
      - input: "3000\n4000"
        output: "Total: 7000"
      - input: "1500\n2500"
        output: "Total: 4000"
      - input: "500\n500"
        output: "Total: 1000"
      - input: "10000\n2500"
        output: "Total: 12500"
      - input: "0\n999"
        output: "Total: 999"
    solusi: |
      a = int(input())
      b = int(input())
      print(f'Total: {a + b}')
    petunjuk:
      - "Baca dua harga dengan int(input())."
      - "Total = a + b. Boleh langsung ditulis di dalam kurung kurawal."
      - "Cetak dengan print(f'Total: {a + b}')."

  - id: "s3-5"
    judul: "Kata Ajaib"
    sulit: "sedang"
    cerita: |
      Kancil menemukan mesin kata ajaib di laboratorium komputer.
      Kita memasukkan satu kata, mesin mencetak tiga hal:
      kata huruf besar semua, jumlah hurufnya, dan dua kali jumlah hurufnya.
      Contoh kata 'Python' punya 6 huruf. Dua kalinya 12.
      Baca satu kata, lalu cetak tiga baris persis seperti contoh.
    input: "Satu baris: sebuah kata (tulisan)."
    output: "Tiga baris: Kata: <KATA BESAR>, Panjang: <n>, Dua kali panjang: <2n>."
    contoh:
      - input: "Python"
        output: "Kata: PYTHON\nPanjang: 6\nDua kali panjang: 12"
      - input: "Halo"
        output: "Kata: HALO\nPanjang: 4\nDua kali panjang: 8"
    tes:
      - input: "Python"
        output: "Kata: PYTHON\nPanjang: 6\nDua kali panjang: 12"
      - input: "Halo"
        output: "Kata: HALO\nPanjang: 4\nDua kali panjang: 8"
      - input: "kancil"
        output: "Kata: KANCIL\nPanjang: 6\nDua kali panjang: 12"
      - input: "A"
        output: "Kata: A\nPanjang: 1\nDua kali panjang: 2"
      - input: "Seru"
        output: "Kata: SERU\nPanjang: 4\nDua kali panjang: 8"
    solusi: |
      kata = input()
      print(f'Kata: {kata.upper()}')
      print(f'Panjang: {len(kata)}')
      print(f'Dua kali panjang: {len(kata) * 2}')
    petunjuk:
      - "Simpan kata di variabel. Pakai f-string untuk mencetak."
      - "Huruf besar semua: kata.upper(). Jumlah huruf: len(kata)."
      - "Dua kali panjang dihitung langsung di dalam kurung kurawal: len(kata) * 2."

  - id: "s3-6"
    judul: "Luas Halaman"
    sulit: "sedang"
    cerita: |
      Kancil membantu ayah mengukur halaman rumah. Halamannya berbentuk
      persegi panjang. Luasnya dihitung dengan panjang kali lebar.
      Kalau panjangnya 4 meter dan lebarnya 5 meter, luasnya 20 meter
      persegi. Baca panjang lalu lebar. Cetak luasnya dengan f-string:
      'Luas: 20'. Bantuin Kancil menghitung, ya!
    input: "Dua baris: panjang (int), lalu lebar (int)."
    output: "Satu baris: Luas: lalu hasil panjang kali lebar."
    contoh:
      - input: "4\n5"
        output: "Luas: 20"
      - input: "7\n3"
        output: "Luas: 21"
    tes:
      - input: "4\n5"
        output: "Luas: 20"
      - input: "7\n3"
        output: "Luas: 21"
      - input: "10\n10"
        output: "Luas: 100"
      - input: "2\n9"
        output: "Luas: 18"
      - input: "6\n6"
        output: "Luas: 36"
    solusi: |
      p = int(input())
      l = int(input())
      print(f'Luas: {p * l}')
    petunjuk:
      - "Baca panjang dan lebar dengan int(input())."
      - "Luas = panjang kali lebar, ditulis p * l."
      - "Cetak dengan f-string: print(f'Luas: {p * l}')."

  - id: "s3-7"
    judul: "Kartu Pemain Game"
    sulit: "sulit"
    cerita: |
      Kancil membuat kartu pemain untuk game buatannya. Pemain mengetik
      nama dan umur. Komputer mencetak tiga baris: nama huruf besar
      semua, jumlah huruf nama, dan umur tahun depan. Contoh: nama
      'Kancil' punya 6 huruf. Kalau umurnya 13, tahun depan 14. Baca
      nama lalu umur. Cetak tiga baris persis seperti contoh.
    input: "Dua baris: nama (tulisan), lalu umur (int)."
    output: "Tiga baris: Pemain: <NAMA>, Huruf nama: <n>, Umur tahun depan: <umur+1>."
    contoh:
      - input: "Kancil\n13"
        output: "Pemain: KANCIL\nHuruf nama: 6\nUmur tahun depan: 14"
      - input: "budi\n12"
        output: "Pemain: BUDI\nHuruf nama: 4\nUmur tahun depan: 13"
    tes:
      - input: "Kancil\n13"
        output: "Pemain: KANCIL\nHuruf nama: 6\nUmur tahun depan: 14"
      - input: "budi\n12"
        output: "Pemain: BUDI\nHuruf nama: 4\nUmur tahun depan: 13"
      - input: "SITI\n15"
        output: "Pemain: SITI\nHuruf nama: 4\nUmur tahun depan: 16"
      - input: "Rina\n10"
        output: "Pemain: RINA\nHuruf nama: 4\nUmur tahun depan: 11"
      - input: "Andi\n14"
        output: "Pemain: ANDI\nHuruf nama: 4\nUmur tahun depan: 15"
    solusi: |
      nama = input()
      umur = int(input())
      print(f'Pemain: {nama.upper()}')
      print(f'Huruf nama: {len(nama)}')
      print(f'Umur tahun depan: {umur + 1}')
    petunjuk:
      - "Simpan nama di variabel. Baca umur dengan int(input())."
      - "Huruf besar semua: nama.upper(). Jumlah huruf: len(nama)."
      - "Umur tahun depan dihitung di dalam f-string: {umur + 1}."
  - id: "s3-8"
    judul: "Bagi Jajan Rata"
    sulit: "sedang"
    cerita: |
      Kancil membawa jajan untuk dibagi ke teman-temannya.
      Dia ingin tiap teman dapat bagian sama rata.
      Jumlah jajan dibagi jumlah teman. Hasilnya bisa
      angka desimal, jadi jangan dibulatkan. Baca jumlah
      jajan lalu jumlah teman. Cetak dengan f-string:
      'Tiap teman: 2.5'. Bantuin Kancil, ya!
    input: "Dua baris: jumlah jajan (int), lalu jumlah teman (int)."
    output: "Satu baris: Tiap teman: lalu hasil bagi (bisa desimal)."
    contoh:
      - input: "10\n4"
        output: "Tiap teman: 2.5"
      - input: "100\n4"
        output: "Tiap teman: 25.0"
    tes:
      - input: "10\n4"
        output: "Tiap teman: 2.5"
      - input: "100\n4"
        output: "Tiap teman: 25.0"
      - input: "7\n2"
        output: "Tiap teman: 3.5"
      - input: "9\n3"
        output: "Tiap teman: 3.0"
      - input: "15\n4"
        output: "Tiap teman: 3.75"
    solusi: |
      a = int(input())
      b = int(input())
      print(f'Tiap teman: {a / b}')
    petunjuk:
      - "Baca dua angka dengan int(input()). Simpan di a dan b."
      - "Hasil bagi = a / b. Pakai tanda garis miring."
      - "Cetak dengan f-string: print(f'Tiap teman: {a / b}')."
  - id: "s3-9"
    judul: "Nama Lengkap Keren"
    sulit: "sulit"
    cerita: |
      Kancil membuat kartu nama keren untuk teman-temannya.
      Kartu berisi nama depan dan nama belakang. Lalu nama
      dengan huruf besar semua. Terakhir jumlah semua huruf
      dari dua kata itu. Contoh: 'kancil' dan 'pintar'.
      Jumlah hurufnya 12. Baca dua kata berurutan. Cetak
      tiga baris persis seperti contoh.
    input: "Dua baris: nama depan (tulisan), lalu nama belakang (tulisan)."
    output: "Tiga baris: Nama: <depan> <belakang>, Huruf besar: <DEPAN> <BELAKANG>, Total huruf: <n>."
    contoh:
      - input: "kancil\npintar"
        output: "Nama: kancil pintar\nHuruf besar: KANCIL PINTAR\nTotal huruf: 12"
      - input: "budi\nsantoso"
        output: "Nama: budi santoso\nHuruf besar: BUDI SANTOSO\nTotal huruf: 11"
    tes:
      - input: "kancil\npintar"
        output: "Nama: kancil pintar\nHuruf besar: KANCIL PINTAR\nTotal huruf: 12"
      - input: "budi\nsantoso"
        output: "Nama: budi santoso\nHuruf besar: BUDI SANTOSO\nTotal huruf: 11"
      - input: "siti\namina"
        output: "Nama: siti amina\nHuruf besar: SITI AMINA\nTotal huruf: 9"
      - input: "raka\npratama"
        output: "Nama: raka pratama\nHuruf besar: RAKA PRATAMA\nTotal huruf: 11"
      - input: "a\nb"
        output: "Nama: a b\nHuruf besar: A B\nTotal huruf: 2"
    solusi: |
      a = input()
      b = input()
      print(f'Nama: {a} {b}')
      print(f'Huruf besar: {a.upper()} {b.upper()}')
      print(f'Total huruf: {len(a) + len(b)}')
    petunjuk:
      - "Simpan dua kata di variabel a dan b."
      - "Huruf besar semua: a.upper() dan b.upper()."
      - "Total huruf = len(a) + len(b). Hitung di dalam f-string."

  - id: "s3-10"
    judul: "Mesin Gema"
    sulit: "sulit"
    cerita: |
      Kancil menemukan mesin gema di pasar malam.
      Kamu memasukkan satu kata dan satu angka.
      Mesin mencetak empat baris.
      Baris pertama: kata huruf besar semua.
      Baris kedua: kata huruf kecil semua.
      Baris ketiga: jumlah huruf kata.
      Baris keempat: kata yang diulang.
      Kata diulang sebanyak angkamu.
      Contoh: kata 'ha' dan angka 3.
      Huruf besarnya 'HA'. Jumlah hurufnya 2. Ulangannya 'hahaha'.
      Baca kata lalu angka.
      Cetak persis seperti contoh.
    input: "Dua baris: kata (tulisan), lalu angka (int)."
    output: "Empat baris: Besar: <KATA>, Kecil: <kata>, Panjang: <n>, Gema: <kata diulang>."
    contoh:
      - input: "ha\n3"
        output: "Besar: HA\nKecil: ha\nPanjang: 2\nGema: hahaha"
      - input: "yo\n4"
        output: "Besar: YO\nKecil: yo\nPanjang: 2\nGema: yoyoyoyo"
    tes:
      - input: "ha\n3"
        output: "Besar: HA\nKecil: ha\nPanjang: 2\nGema: hahaha"
      - input: "yo\n4"
        output: "Besar: YO\nKecil: yo\nPanjang: 2\nGema: yoyoyoyo"
      - input: "A\n5"
        output: "Besar: A\nKecil: a\nPanjang: 1\nGema: AAAAA"
      - input: "Mie\n1"
        output: "Besar: MIE\nKecil: mie\nPanjang: 3\nGema: Mie"
      - input: "kancil\n0"
        output: "Besar: KANCIL\nKecil: kancil\nPanjang: 6\nGema: "
    solusi: |
      kata = input()
      n = int(input())
      print(f'Besar: {kata.upper()}')
      print(f'Kecil: {kata.lower()}')
      print(f'Panjang: {len(kata)}')
      print(f'Gema: {kata * n}')
    petunjuk:
      - "Simpan kata di variabel. Baca angka dengan int(input())."
      - "Huruf besar: kata.upper(). Huruf kecil: kata.lower(). Panjang: len(kata)."
      - "Mengulang kata: tulis kata * n di dalam f-string. Kalau n = 0, hasilnya kosong."

  - id: "s3-11"
    judul: "Tebak Panjang Nama"
    sulit: "sulit"
    cerita: |
      Kancil dan Siti main tebak panjang.
      Kancil mengetik satu kata.
      Siti mengetik satu kata.
      Komputer mencetak lima baris.
      Baris pertama: kata pertama huruf besar semua.
      Baris kedua: kata kedua huruf kecil semua.
      Baris ketiga: panjang kata pertama.
      Baris keempat: panjang kata kedua.
      Baris kelima: selisih panjangnya.
      Selisih dihitung dari panjang kata pertama dikurangi panjang kata kedua.
      Bisa hasilnya angka negatif.
      Baca dua kata.
      Cetak persis seperti contoh.
    input: "Dua baris: kata pertama (tulisan), lalu kata kedua (tulisan)."
    output: "Lima baris: Kata 1: <KATA PERTAMA>, Kata 2: <kata kedua>, Panjang 1: <n1>, Panjang 2: <n2>, Selisih: <n1-n2>."
    contoh:
      - input: "kancil\npintar"
        output: "Kata 1: KANCIL\nKata 2: pintar\nPanjang 1: 6\nPanjang 2: 6\nSelisih: 0"
      - input: "budi\nsantoso"
        output: "Kata 1: BUDI\nKata 2: santoso\nPanjang 1: 4\nPanjang 2: 7\nSelisih: -3"
    tes:
      - input: "kancil\npintar"
        output: "Kata 1: KANCIL\nKata 2: pintar\nPanjang 1: 6\nPanjang 2: 6\nSelisih: 0"
      - input: "budi\nsantoso"
        output: "Kata 1: BUDI\nKata 2: santoso\nPanjang 1: 4\nPanjang 2: 7\nSelisih: -3"
      - input: "A\nB"
        output: "Kata 1: A\nKata 2: b\nPanjang 1: 1\nPanjang 2: 1\nSelisih: 0"
      - input: "Andi Pratama\nRina"
        output: "Kata 1: ANDI PRATAMA\nKata 2: rina\nPanjang 1: 12\nPanjang 2: 4\nSelisih: 8"
      - input: "siti\naminah"
        output: "Kata 1: SITI\nKata 2: aminah\nPanjang 1: 4\nPanjang 2: 6\nSelisih: -2"
    solusi: |
      a = input()
      b = input()
      print(f'Kata 1: {a.upper()}')
      print(f'Kata 2: {b.lower()}')
      print(f'Panjang 1: {len(a)}')
      print(f'Panjang 2: {len(b)}')
      print(f'Selisih: {len(a) - len(b)}')
    petunjuk:
      - "Simpan dua kata di variabel a dan b."
      - "Huruf besar: a.upper(). Huruf kecil: b.lower(). Panjang: len(a) dan len(b)."
      - "Selisih = len(a) - len(b). Kalau kata pertama lebih pendek, hasilnya negatif."
