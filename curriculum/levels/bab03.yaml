bab: 3
judul: "String & Angka"
emoji: "🔢"
warna: "#f59e0b"
deskripsi: "Hitung angka dan rakit kalimat: aritmatika & f-string."

pelajaran:
  - id: "3-1"
    judul: "Angka Main Hitung"
    menit: 8
    materi: |
      Python adalah kalkulator super! Dengan variabel yang sudah kamu
      kenal, sekarang saatnya berhitung. Operator aritmatika di Python:

      - `+` tambah
      - `-` kurang
      - `*` kali (bintang, bukan huruf x!)
      - `/` bagi

      Pembagian di Python selalu menghasilkan bilangan desimal. Jadi
      `10 / 4` hasilnya `2.5`, bukan `2`.

      ## Urutan hitung

      Python mengikuti aturan matematika biasa: yang di dalam kurung
      dikerjakan paling dulu, lalu kali dan bagi, baru tambah dan kurang.

      - `2 + 3 * 4` hasilnya 14 (kali dulu: 3 * 4 = 12, baru ditambah 2)
      - `(2 + 3) * 4` hasilnya 20 (kurung dulu: 2 + 3 = 5, baru dikali 4)

      Kalau ragu, pakai saja tanda kurung — tidak ada salahnya, malah
      membuat kode lebih jelas dibaca.

      Angka bisa datang dari variabel juga. Simpan dulu ke variabel,
      lalu hitung pakai nama variabelnya. Python akan mengambil isinya
      dan menghitung. Contoh pertama di bawah memakai angka langsung,
      contoh kedua memakai variabel. Jalankan keduanya dan bandingkan
      hasilnya!
    contoh:
      - kode: |
          print(2 + 3 * 4)
        penjelasan: "Kali dikerjakan dulu: 3 * 4 = 12, lalu 2 + 12 = 14."
      - kode: |
          a = 10
          b = 4
          print('Hasil bagi:', a / b)
        penjelasan: "10 / 4 menghasilkan 2.5 karena pembagian di Python selalu memberi desimal."
    kuis:
      - soal: "Berapa hasil 10 / 4 di Python?"
        pilihan:
          - "2"
          - "2.5"
          - "2 sisa 2"
          - "error"
        jawaban: 1
        penjelasan: "Pembagian di Python selalu menghasilkan desimal: 10 / 4 = 2.5."
      - soal: "Berapa hasil 2 + 3 * 4?"
        pilihan:
          - "20"
          - "14"
          - "24"
          - "9"
        jawaban: 1
        penjelasan: "Kali dulu: 3 * 4 = 12, baru ditambah 2, jadi 14."
      - soal: "Berapa hasil (2 + 3) * 4?"
        pilihan:
          - "14"
          - "9"
          - "20"
          - "24"
        jawaban: 2
        penjelasan: "Yang di dalam kurung dikerjakan dulu: 2 + 3 = 5, lalu 5 * 4 = 20."

  - id: "3-2"
    judul: "Kalimat Ajaib: f-string"
    menit: 7
    materi: |
      Pernah lihat poster yang rapi? Isinya kalimat lengkap dengan angka
      yang menyatu, bukan angka yang terpisah. Di Python, kita bisa
      membuat kalimat seperti itu dengan f-string — singkatan dari
      "format string".

      Cara pakainya: tulis huruf `f` di depan tanda kutip, lalu sisipkan
      variabel di dalam tanda kurung kurawal `{}`:

      `nama = 'Budi'`
      `print(f'Halo, {nama}!')`

      Python akan mengganti `{nama}` dengan isi variabelnya, jadi
      hasilnya: `Halo, Budi!`

      Kerennya, di dalam kurung kurawal kita boleh langsung menulis
      hitungan:

      `print(f'Total: {1500 + 2500}')`

      hasilnya `Total: 4000`. Python menghitung dulu, baru mencetak.

      Kenapa f-string lebih baik daripada print dengan koma? Karena kita
      bisa mengatur spasi dan tanda baca dengan bebas. Dengan koma,
      Python menaruh spasi di antara nilai — kadang muncul di tempat yang
      tidak kita mau, misalnya sebelum tanda seru. Dengan f-string,
      semua yang kita tulis di dalam kutipan tercetak apa adanya.

      Mulai sekarang, f-string jadi senjata andalanmu untuk mencetak
      kalimat yang rapi!

      Satu lagi: f-string bisa memuat banyak variabel sekaligus. Tinggal
      tulis beberapa pasang kurung kurawal dalam satu kalimat, dan
      Python mengganti semuanya satu per satu.
    contoh:
      - kode: |
          nama = 'Kancil'
          print(f'Selamat datang, {nama}!')
        penjelasan: "Kurung kurawal {nama} diganti isi variabelnya, jadi tercetak 'Selamat datang, Kancil!'."
      - kode: |
          uang = 5000
          harga = 1500
          print(f'Uangku {uang} rupiah, sisa jajan {uang - harga}')
        penjelasan: "Di dalam kurung kurawal boleh langsung ada hitungan: 5000 - 1500 = 3500."
    kuis:
      - soal: "Apa output dari kode ini?\n\nnama = 'Budi'\nprint(f'Halo, {nama}!')"
        pilihan:
          - "Halo, {nama}!"
          - "Halo, Budi!"
          - "f'Halo, Budi!'"
          - "error"
        jawaban: 1
        penjelasan: "f-string mengganti {nama} dengan isi variabelnya, yaitu 'Budi'."
      - soal: "Huruf apa yang ditulis di depan tanda kutip untuk membuat f-string?"
        pilihan:
          - "s"
          - "f"
          - "p"
          - "x"
        jawaban: 1
        penjelasan: "f-string diawali huruf f, contoh: f'halo {nama}'."
      - soal: "Apa output dari print(f'Total: {1500 + 2500}')?"
        pilihan:
          - "Total: {1500 + 2500}"
          - "Total: 4000"
          - "Total: 1500 + 2500"
          - "error"
        jawaban: 1
        penjelasan: "Di dalam kurung kurawal boleh ada hitungan; Python menghitung dulu: 1500 + 2500 = 4000."

  - id: "3-3"
    judul: "Rakit Kalimat & Ukur Panjang"
    menit: 8
    materi: |
      Kalau f-string merakit kalimat dengan kurung kurawal, ada cara
      lain: menyambung teks dengan tanda tambah `+`. Ini disebut
      menggabungkan string (string concatenation).

      `'Py' + 'thon'` hasilnya `'Python'`.

      ## Angka dan teks belum tentu akur

      Coba tebak: `'Umurku ' + 13` — hasilnya? Error! Python tidak mau
      menyambung teks dengan angka. Solusinya: ubah angka jadi teks dulu
      pakai `str()`.

      `'Umurku ' + str(13)` hasilnya `'Umurku 13'`.

      Jadi `str()` mengubah angka menjadi teks — kebalikan dari `int()`
      dan `float()` yang kamu pelajari di Bab 2.

      ## Mengukur panjang teks

      Pernah penasaran berapa huruf dalam namamu? Python bisa
      menghitungnya dengan `len()`:

      `len('Python')` hasilnya 6.

      `len()` menghitung semua karakter: huruf, angka, dan spasi. Jadi
      `len('SMPN 1')` hasilnya 6 juga — huruf S, M, P, N, spasi, dan
      angka 1.

      Mana yang kamu pakai, f-string atau tanda tambah? Dua-duanya sah.
      Banyak programmer memakai f-string karena lebih rapi, tapi kamu
      tetap harus paham `+` dan `str()` karena sering muncul di kode
      orang lain.
    contoh:
      - kode: |
          kata1 = 'Py'
          kata2 = 'thon'
          print(kata1 + kata2)
        penjelasan: "Tanda + menyambung dua teks tanpa spasi: 'Py' + 'thon' = 'Python'."
      - kode: |
          nama = 'Python'
          print('Jumlah huruf:', len(nama))
        penjelasan: "len() menghitung karakter: P-y-t-h-o-n ada 6 huruf."
    kuis:
      - soal: "Berapa hasil 'Py' + 'thon'?"
        pilihan:
          - "'Py thon'"
          - "'Python'"
          - "error"
          - "'Py+'thon'"
        jawaban: 1
        penjelasan: "Tanda + menyambung dua teks tanpa spasi: 'Py' + 'thon' = 'Python'."
      - soal: "Apa yang terjadi kalau kita menulis 'Umurku ' + 13?"
        pilihan:
          - "menjadi 'Umurku 13'"
          - "error"
          - "menjadi 13"
          - "menjadi 'Umurku '"
        jawaban: 1
        penjelasan: "Python tidak bisa menyambung teks dengan angka; ubah dulu angkanya dengan str(13)."
      - soal: "Berapa hasil len('Python')?"
        pilihan:
          - "5"
          - "6"
          - "7"
          - "error"
        jawaban: 1
        penjelasan: "len() menghitung jumlah karakter: P-y-t-h-o-n ada 6 huruf."

  - id: "3-4"
    judul: "Besar atau Kecil"
    menit: 6
    materi: |
      Pernah mengetik kata sandi dan lupa memakai huruf besar? Komputer
      menganggap 'Kancil' dan 'kancil' sebagai dua teks yang berbeda!
      Untungnya Python punya alat untuk merapikan huruf besar-kecil.

      ## Huruf besar semua: upper()

      `'kancil'.upper()` hasilnya `'KANCIL'`.

      ## Huruf kecil semua: lower()

      `'KANCIL'.lower()` hasilnya `'kancil'`.

      Perhatikan cara menulisnya: nama teksnya dulu, lalu titik, lalu
      nama perintahnya. Ini disebut metode — perintah khusus yang
      menempel pada teks. Kamu akan sering melihat pola seperti ini di
      Python.

      ## Buat apa sih?

      - Merapikan input dari user, supaya 'KANCIL', 'Kancil', dan
        'kancil' dianggap sama
      - Membuat tulisan di game jadi besar semua untuk efek teriak
      - Membandingkan jawaban tanpa peduli besar-kecil huruf

      Metode tidak mengubah teks aslinya — `upper()` dan `lower()`
      membuat teks baru sebagai hasil. Kalau kamu mau menyimpannya,
      masukkan ke variabel baru:

      `teks_besar = teks.upper()`

      Coba dua contoh di bawah ini, lalu ubah-ubah hurufnya dan lihat
      hasilnya!

      Coba juga teks campuran seperti 'PyThOn' — `.upper()` membuat
      semua hurufnya besar, `.lower()` membuat semuanya kecil. Seru,
      kan? Sekarang kamu bisa merapikan teks apa pun!
    contoh:
      - kode: |
          print('kancil'.upper())
        penjelasan: "upper() mengubah semua huruf menjadi besar: KANCIL."
      - kode: |
          print('PYTHON'.lower())
        penjelasan: "lower() mengubah semua huruf menjadi kecil: python."
    kuis:
      - soal: "Apa hasil 'Python'.upper()?"
        pilihan:
          - "'python'"
          - "'PYTHON'"
          - "'Python'"
          - "error"
        jawaban: 1
        penjelasan: "upper() mengubah semua huruf menjadi besar: PYTHON."
      - soal: "Apa hasil 'Belajar'.lower()?"
        pilihan:
          - "'BELAJAR'"
          - "'belajar'"
          - "'Belajar'"
          - "error"
        jawaban: 1
        penjelasan: "lower() mengubah semua huruf menjadi kecil: belajar."
      - soal: "Mengapa 'Kancil' dan 'kancil' dianggap berbeda oleh Python?"
        pilihan:
          - "karena yang satu lebih panjang"
          - "karena Python membedakan huruf besar dan kecil"
          - "karena ada spasi"
          - "sebenarnya sama saja"
        jawaban: 1
        penjelasan: "Python membedakan huruf besar dan kecil. upper() dan lower() bisa dipakai untuk menyamakan."

soal:
  - id: "s3-1"
    judul: "Uang Kembalian Kantin"
    sulit: "mudah"
    cerita: |
      Si Kancil jajan di kantin sekolah. Dia membayar dengan uang
      lembaran, dan Bu Kantin menghitung kembaliannya. Hari ini Kancil
      membayar 5000 rupiah untuk jajanan seharga 3500, jadi kembaliannya
      1500. Program membaca dua angka: uang yang dibayar dan harga
      jajanan. Bantuin Bu Kantin: hitung kembaliannya dengan mengurangkan
      harga dari uang, lalu cetak hasilnya.
    input: "Dua baris: uang yang dibayar (int), lalu harga jajanan (int)."
    output: "Satu baris: Kembalian: diikuti angka kembalian."
    contoh:
      - input: "5000\n3500"
        output: "Kembalian: 1500"
      - input: "10000\n7500"
        output: "Kembalian: 2500"
    tes:
      - input: "5000\n3500"
        output: "Kembalian: 1500"
      - input: "10000\n7500"
        output: "Kembalian: 2500"
      - input: "2000\n2000"
        output: "Kembalian: 0"
      - input: "15000\n12300"
        output: "Kembalian: 2700"
      - input: "5000\n1500"
        output: "Kembalian: 3500"
    solusi: |
      uang = int(input())
      harga = int(input())
      print('Kembalian:', uang - harga)
    petunjuk:
      - "Baca dua angka dengan int(input()) secara berurutan."
      - "Kembalian dihitung dengan uang dikurangi harga."
      - "Cetak dengan print('Kembalian:', uang - harga)."

  - id: "s3-2"
    judul: "Rata-Rata Nilai Ulangan"
    sulit: "sedang"
    cerita: |
      Bu Guru memberikan tiga nilai ulangan harian kepada Kancil. Kancil
      penasaran, berapa rata-rata nilainya? Program membaca tiga nilai
      yang berupa bilangan bulat, lalu mencetak rata-ratanya. Rata-rata
      dihitung dengan menjumlahkan ketiga nilai, lalu membaginya dengan
      tiga. Hasilnya bisa berupa angka desimal, jadi jangan dibulatkan.
      Bantuin Kancil menghitung dan mencetak rata-ratanya!
    input: "Tiga baris: nilai pertama, kedua, dan ketiga (int)."
    output: "Satu baris: Rata-rata: diikuti angka rata-rata (bisa desimal)."
    contoh:
      - input: "7\n8\n9"
        output: "Rata-rata: 8.0"
      - input: "10\n20\n30"
        output: "Rata-rata: 20.0"
    tes:
      - input: "7\n8\n9"
        output: "Rata-rata: 8.0"
      - input: "10\n20\n30"
        output: "Rata-rata: 20.0"
      - input: "5\n5\n5"
        output: "Rata-rata: 5.0"
      - input: "8\n9\n10"
        output: "Rata-rata: 9.0"
      - input: "6\n6\n9"
        output: "Rata-rata: 7.0"
    solusi: |
      a = int(input())
      b = int(input())
      c = int(input())
      print('Rata-rata:', (a + b + c) / 3)
    petunjuk:
      - "Baca tiga nilai dan simpan di variabel a, b, c."
      - "Jumlahkan lalu bagi tiga — pakai tanda kurung supaya penjumlahan dikerjakan dulu."
      - "Cetak dengan print('Rata-rata:', (a + b + c) / 3)."

  - id: "s3-3"
    judul: "Kartu Anggota Perpustakaan"
    sulit: "sulit"
    cerita: |
      Perpustakaan sekolah punya komputer baru untuk membuat kartu
      anggota. Saat anggota baru mendaftar, mereka mengetik nama.
      Komputer mencetak kartu berisi: nama asli, jumlah huruf dalam
      nama, nama dalam huruf besar semua, dan nama dalam huruf kecil
      semua. Contohnya, nama 'Kancil' punya 6 huruf, huruf besarnya
      'KANCIL', huruf kecilnya 'kancil'. Bantuin Kancil menulis
      programnya: baca satu nama, cetak empat baris persis seperti
      contoh.
    input: "Satu baris: nama anggota (teks)."
    output: "Empat baris: Kartu untuk <nama>, Jumlah huruf: <n>, Huruf besar: <NAMA>, Huruf kecil: <nama>."
    contoh:
      - input: "Kancil"
        output: "Kartu untuk Kancil\nJumlah huruf: 6\nHuruf besar: KANCIL\nHuruf kecil: kancil"
      - input: "budi"
        output: "Kartu untuk budi\nJumlah huruf: 4\nHuruf besar: BUDI\nHuruf kecil: budi"
    tes:
      - input: "Kancil"
        output: "Kartu untuk Kancil\nJumlah huruf: 6\nHuruf besar: KANCIL\nHuruf kecil: kancil"
      - input: "budi"
        output: "Kartu untuk budi\nJumlah huruf: 4\nHuruf besar: BUDI\nHuruf kecil: budi"
      - input: "SITI"
        output: "Kartu untuk SITI\nJumlah huruf: 4\nHuruf besar: SITI\nHuruf kecil: siti"
      - input: "Andi Pratama"
        output: "Kartu untuk Andi Pratama\nJumlah huruf: 12\nHuruf besar: ANDI PRATAMA\nHuruf kecil: andi pratama"
      - input: "Rina"
        output: "Kartu untuk Rina\nJumlah huruf: 4\nHuruf besar: RINA\nHuruf kecil: rina"
    solusi: |
      nama = input()
      print(f'Kartu untuk {nama}')
      print(f'Jumlah huruf: {len(nama)}')
      print(f'Huruf besar: {nama.upper()}')
      print(f'Huruf kecil: {nama.lower()}')
    petunjuk:
      - "Simpan nama di variabel, lalu pakai f-string untuk mencetak kalimat."
      - "Jumlah huruf didapat dari len(nama)."
      - "Huruf besar pakai nama.upper() dan huruf kecil pakai nama.lower()."
