      - input: ""
        output: "  *\n ***\n*****\n ***\n  *"
    tes:
      - input: ""
        output: "  *\n ***\n*****\n ***\n  *"
      - input: ""
        output: "  *\n ***\n*****\n ***\n  *"
      - input: ""
        output: "  *\n ***\n*****\n ***\n  *"
