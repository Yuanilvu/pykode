bab: 8
judul: "Fungsi: def, parameter, return"
emoji: "⚙️"
warna: "#ef4444"
deskripsi: "Buat mesin kode sendiri: def, parameter, return, scope dasar."

pelajaran:
  - id: "8-1"
    judul: "Fungsi: Mesin Ajaib"
    menit: 7
    materi: |
      Pernah pakai mesin penjual minuman? Kamu menekan satu tombol,
      mesin mengerjakan semuanya, minuman keluar. Di Python, kita bisa
      membuat "mesin" sendiri. Namanya **fungsi**.

      Fungsi adalah kumpulan kode yang diberi nama, bisa dipanggil
      kapan saja. Daripada menulis kode yang sama berulang-ulang,
      tulis sekali di dalam fungsi, lalu panggil namanya.

      ## Membuat fungsi

      ```
      def sapa():
          print('Halo!')
      ```

      - `def` = cara membuat fungsi.
      - `sapa` = nama fungsi (bebas, tapi usahakan jelas).
      - Kurung dan titik dua wajib.
      - Isi fungsi harus diberi indentasi, seperti isi for dan while.

      ## Memanggil fungsi

      Setelah dibuat, fungsi dijalankan dengan menulis namanya + kurung:
      `sapa()`. Bisa dipanggil berkali-kali. Setiap panggilan menjalankan
      isi fungsi dari atas ke bawah.

      Penting: fungsi TIDAK jalan sebelum dipanggil.
      Membuat fungsi itu seperti menyimpan resep di buku.
      Baru jalan saat kamu memasaknya (memanggilnya).
      Program dibaca dari atas ke bawah: definisi dulu, panggilan setelahnya.

      Fungsi membuat kode lebih pendek, lebih rapi, dan lebih mudah
      dicari kalau ada yang salah. Cukup perbaiki di satu tempat.
    contoh:
      - kode: |
          def sapa():
              print('Halo!')

          sapa()
          sapa()
        penjelasan: "Mencetak Halo! dua kali — satu fungsi dipanggil dua kali."
      - kode: |
          def semangat():
              print('Ayo belajar Python!')

          semangat()
        penjelasan: "Fungsi dibuat lalu dipanggil sekali."
    kuis:
      - soal: "Kata kunci untuk membuat fungsi adalah..."
        pilihan:
          - "func"
          - "def"
          - "function"
          - "define()"
        jawaban: 1
        penjelasan: "def adalah kata kunci Python untuk membuat fungsi."
      - soal: "Kode di dalam fungsi hanya jalan ketika..."
        pilihan:
          - "file dibuka"
          - "fungsi dipanggil"
          - "komputer dinyalakan"
          - "tidak pernah"
        jawaban: 1
        penjelasan: "Fungsi baru bekerja saat dipanggil, bukan saat dibuat."
      - soal: "Apa outputnya?\n\ndef sapa():\n    print('Halo')\n\nsapa()\nsapa()"
        pilihan:
          - "Halo 1 kali"
          - "Halo 2 kali"
          - "Halo 3 kali"
          - "tidak ada output"
        jawaban: 1
        penjelasan: "Fungsi dipanggil dua kali. Isinya jalan dua kali, jadi Halo tercetak 2 kali."
      - soal: "Fungsi sudah dibuat tapi tidak pernah dipanggil. Isi fungsi akan..."
        pilihan:
          - "jalan satu kali"
          - "jalan terus-menerus"
          - "tidak pernah jalan"
          - "error"
        jawaban: 2
        penjelasan: "Fungsi baru bekerja saat dipanggil. Tidak dipanggil, tidak jalan."


  - id: "8-2"
    judul: "Parameter: Tombol Mesin"
    menit: 7
    materi: |
      Mesin penjual minuman punya banyak tombol. Satu untuk teh,
      satu untuk kopi. Fungsinya sama (mengeluarkan minuman),
      tapi hasilnya beda tergantung tombol yang ditekan.
      Di Python, "tombol" itu disebut **parameter**.

      Parameter adalah variabel yang ditulis di dalam kurung
      saat membuat fungsi:

      ```
      def sapa(nama):
          print('Halo, ' + nama + '!')
      ```

      Saat memanggil `sapa('Budi')`, nilai 'Budi' masuk ke parameter `nama`.
      Fungsi lalu mencetak "Halo, Budi!". Panggil dengan nama lain,
      hasilnya beda. Satu fungsi untuk banyak orang.

      ## Aturan parameter

      - Jumlah nilai saat memanggil harus cocok dengan jumlah parameter.
      - Urutan penting: `sapa('Budi')` mengisi parameter pertama.
      - Nama parameter bebas. Yang penting dipakai konsisten di dalam fungsi.

      Fungsi dengan parameter itu seperti resep dengan bahan.
      Resepnya sama, tapi kalau bahannya beda, hasilnya beda.
      Kamu tidak perlu menulis resep baru untuk setiap bahan.
      Cukup ganti bahannya saat memasak!

      Kamu juga bisa memanggil fungsi dengan variabel:
      `nama = 'Budi'` lalu `sapa(nama)`. Nilai variabel itulah
      yang masuk ke parameter. Sama seperti mengisi bahan ke resep.
    contoh:
      - kode: |
          def sapa(nama):
              print('Halo, ' + nama + '!')

          sapa('Budi')
          sapa('Sari')
        penjelasan: "Mencetak 'Halo, Budi!' lalu 'Halo, Sari!' — parameter mengubah isi sapaan."
      - kode: |
          def tambah(a, b):
              print(a + b)

          tambah(3, 4)
          tambah(10, 5)
        penjelasan: "Mencetak 7 lalu 15 — dua parameter dijumlahkan."
    kuis:
      - soal: "Parameter pada fungsi ditulis di dalam..."
        pilihan:
          - "kurung siku"
          - "kurung biasa setelah nama fungsi"
          - "tanda kutip"
          - "komentar"
        jawaban: 1
        penjelasan: "Parameter ditulis di dalam kurung setelah nama fungsi: def sapa(nama)."
      - soal: "def kali(a, b): print(a * b) lalu kali(3, 2) mencetak..."
        pilihan:
          - "32"
          - "5"
          - "6"
          - "error"
        jawaban: 2
        penjelasan: "a = 3 dan b = 2. Jadi 3 * 2 = 6."
      - soal: "def tambah(a, b): print(a + b). Lalu tambah(4, 5) mencetak..."
        pilihan:
          - "45"
          - "9"
          - "20"
          - "error"
        jawaban: 1
        penjelasan: "a = 4 dan b = 5. Jadi 4 + 5 = 9."
      - soal: "def sapa(nama): print('Halo ' + nama). Lalu sapa('Budi') mencetak..."
        pilihan:
          - "'Halo Budi'"
          - "'Halo'"
          - "'Budi'"
          - "error"
        jawaban: 0
        penjelasan: "Parameter nama diisi 'Budi'. Teks 'Halo ' digabung dengan 'Budi'."


  - id: "8-3"
    judul: "return: Hasil Keluar dari Mesin"
    menit: 7
    materi: |
      Mesin penjual tiket tidak hanya bekerja. Dia MENGELUARKAN tiket
      yang bisa kamu pegang dan pakai lagi. Fungsi juga bisa
      mengeluarkan hasil dengan **return**.

      `return` mengirim nilai hasil ke tempat fungsi dipanggil.
      Nilai itu bisa disimpan di variabel atau langsung dipakai:

      ```
      def kali(a, b):
          return a * b

      hasil = kali(3, 4)
      print(hasil)
      ```

      `kali(3, 4)` "menjadi" 12, lalu disimpan di `hasil`.

      ## Bedanya print dan return

      - `print` hanya mencetak ke layar. Nilainya hilang setelah itu.
      - `return` memberikan nilai ke pemanggil. Bisa disimpan,
        dihitung lagi, dipakai di mana saja.

      ## Aturan return

      - Begitu `return` dijalankan, fungsi LANGSUNG selesai.
        Kode setelahnya tidak jalan.
      - Fungsi tanpa return menghasilkan None (tidak ada nilai).

      Return itu seperti menyerahkan PR ke guru. Kamu tidak hanya
      mengerjakan, tapi hasilnya diserahkan untuk dinilai.
      Fungsi dengan return bisa dipakai di dalam perhitungan lain.
      Itulah kekuatan sebenarnya.

      Coba tebak: apa hasil fungsi yang tidak punya return?
      Jawabannya None. Tidak ada nilai yang keluar.
    contoh:
      - kode: |
          def kali(a, b):
              return a * b

          hasil = kali(3, 4)
          print(hasil)
        penjelasan: "Mencetak 12 — hasil return disimpan di variabel hasil."
      - kode: |
          def kuadrat(x):
              return x * x

          print(kuadrat(5))
          print(kuadrat(3) + 1)
        penjelasan: "Mencetak 25 lalu 10 — hasil fungsi bisa langsung dipakai dalam perhitungan."
    kuis:
      - soal: "Kata apa yang dipakai untuk mengeluarkan hasil dari fungsi?"
        pilihan:
          - "print"
          - "return"
          - "output"
          - "exit"
        jawaban: 1
        penjelasan: "return mengirim hasil fungsi ke pemanggilnya."
      - soal: "Begitu return dijalankan, fungsi akan..."
        pilihan:
          - "lanjut ke baris berikutnya"
          - "langsung selesai"
          - "mengulang dari awal"
          - "error"
        jawaban: 1
        penjelasan: "return menghentikan fungsi saat itu juga. Kode setelahnya tidak jalan."
      - soal: "def tambah(a, b): return a + b lalu print(tambah(2, 3) * 2) mencetak..."
        pilihan:
          - "5"
          - "7"
          - "10"
          - "error"
        jawaban: 2
        penjelasan: "tambah(2, 3) menjadi 5. Lalu 5 * 2 = 10."
      - soal: "def dua(x): return x * 2. Lalu print(dua(dua(3))) mencetak..."
        pilihan:
          - "6"
          - "9"
          - "12"
          - "error"
        jawaban: 2
        penjelasan: "dua(3) menjadi 6. Lalu dua(6) menjadi 12. Hasilnya 12."
      - soal: "def tiga(x): return x + 3. Lalu print(tiga(4)) mencetak..."
        pilihan:
          - "7"
          - "4"
          - "34"
          - "error"
        jawaban: 0
        penjelasan: "tiga(4) mengembalikan 4 + 3 = 7. Lalu 7 dicetak."


  - id: "8-4"
    judul: "Variabel Lokal: Rahasia di Dalam Fungsi"
    menit: 6
    materi: |
      Variabel yang dibuat DI DALAM fungsi itu seperti rahasia kamar.
      Hanya diketahui di dalam kamar itu, tidak terlihat dari luar.
      Variabel seperti ini disebut **variabel lokal**.

      ```
      def hitung():
          x = 5
          return x * 2

      print(hitung())
      ```

      Di sini `x` hanya ada di dalam fungsi `hitung`.
      Kalau kamu mencoba `print(x)` di luar fungsi, Python error: NameError.
      x tidak dikenal di luar.

      ## Kenapa penting?

      - Fungsi tidak saling mengganggu. Dua fungsi boleh punya
        variabel dengan nama yang sama.
      - Kode di luar fungsi tidak bisa mengubah isi fungsi
        secara tidak sengaja.
      - Fungsi jadi "kotak tertutup": masuk lewat parameter,
        keluar lewat return.

      ## Yang sering salah

      Banyak pemula menulis variabel di luar fungsi, lalu memakainya
      di dalam. Itu BOLEH (namanya variabel global). Tapi kebiasaan
      terbaik: semua yang dibutuhkan fungsi, lewatkan lewat parameter.
      Kode jadi rapi dan mudah ditebak.

      Bayangkan fungsi itu kamar pribadi. Barang di dalamnya milik sendiri.
      Kalau ingin meminjam barang dari luar, kamu memintanya lewat pintu.
      Itulah parameter!
    contoh:
      - kode: |
          def hitung():
              x = 5
              return x * 2

          print(hitung())
        penjelasan: "Mencetak 10 — x hidup di dalam fungsi, hasilnya keluar lewat return."
      - kode: |
          def sapa():
              pesan = 'Halo!'
              print(pesan)

          sapa()
        penjelasan: "Mencetak Halo! — pesan adalah variabel lokal yang hanya dipakai di dalam sapa()."
    kuis:
      - soal: "Variabel yang dibuat di dalam fungsi disebut..."
        pilihan:
          - "variabel global"
          - "variabel lokal"
          - "variabel rahasia"
          - "variabel tetap"
        jawaban: 1
        penjelasan: "Variabel lokal hanya dikenal di dalam fungsi tempat ia dibuat."
      - soal: "Kalau kita memakai print(x) di luar fungsi padahal x dibuat di dalam fungsi, Python akan..."
        pilihan:
          - "mencetak 0"
          - "mencetak x"
          - "error NameError"
          - "membuat x baru"
        jawaban: 2
        penjelasan: "x tidak dikenal di luar fungsi. Jadi terjadi NameError."
      - soal: "Variabel lokal hanya dikenal..."
        pilihan:
          - "di seluruh program"
          - "di dalam fungsi tempat ia dibuat"
          - "di file lain"
          - "tidak pernah dikenal"
        jawaban: 1
        penjelasan: "Variabel lokal hidup di dalam fungsinya saja. Di luar fungsi, ia tidak ada."


  - id: "8-5"
    judul: "Fungsi dengan Nilai Awal"
    menit: 6
    materi: |
      Kadang sebuah fungsi punya nilai yang sering sama.
      Contohnya ucapan 'Halo'. Kita tidak mau mengetiknya
      setiap kali memanggil fungsi. Solusinya: **nilai awal**
      (default parameter).

      ## Cara membuat nilai awal

      ```
      def sapa(nama, pesan='Halo'):
          print(pesan + ', ' + nama + '!')
      ```

      Parameter `pesan` punya nilai awal 'Halo'.
      Kalau kamu tidak mengisi pesan, Python memakai 'Halo'.
      Kalau kamu mengisi, nilai kamu yang dipakai.

      ```
      sapa('Budi')            # Halo, Budi!
      sapa('Sari', 'Hai')     # Hai, Sari!
      ```

      ## Aturan penting

      - Parameter dengan nilai awal diletakkan di BELAKANG.
      - Parameter tanpa nilai awal harus di depan.
      - Nilai awal bisa angka juga: `def kali(a, b=2)`.

      ## Kenapa berguna?

      Nilai awal membuat fungsi fleksibel. Satu fungsi bisa
      dipakai dengan banyak cara. Seperti tombol yang sudah
      punya pengaturan standar, tapi tetap bisa diubah
      kalau perlu!
    contoh:
      - kode: |
          def sapa(nama, pesan='Halo'):
              print(pesan + ', ' + nama + '!')

          sapa('Budi')
          sapa('Sari', 'Hai')
        penjelasan: "Panggilan pertama memakai nilai awal 'Halo'. Panggilan kedua memakai 'Hai'."
      - kode: |
          def kali(a, b=2):
              return a * b

          print(kali(5))
          print(kali(5, 10))
        penjelasan: "kali(5) memakai b=2 jadi 10. kali(5, 10) memakai b=10 jadi 50."
    kuis:
      - soal: "def sapa(nama, pesan='Halo'). Lalu sapa('Budi') mencetak..."
        pilihan:
          - "Halo, Budi!"
          - "Budi!"
          - "Halo!"
          - "error"
        jawaban: 0
        penjelasan: "Pesan tidak diisi, jadi Python memakai nilai awal 'Halo'."
      - soal: "def kali(a, b=2): return a * b. Hasil kali(7) adalah..."
        pilihan:
          - "9"
          - "14"
          - "72"
          - "error"
        jawaban: 1
        penjelasan: "b tidak diisi, jadi b memakai nilai awal 2. 7 * 2 = 14."
      - soal: "Di mana letak parameter yang punya nilai awal?"
        pilihan:
          - "di depan"
          - "di belakang"
          - "di tengah saja"
          - "bebas di mana saja"
        jawaban: 1
        penjelasan: "Parameter dengan nilai awal harus di belakang. Yang tanpa nilai awal di depan."


soal:
  - id: "s8-1"
    judul: "Sapaan Py-Bot"
    sulit: "mudah"
    cerita: |
      Robot penjaga sekolah bernama Py-Bot suka menyapa setiap siswa
      yang lewat dengan menyebut namanya. Kamu diminta membuat fungsi
      bernama sapa yang menerima satu parameter nama, lalu mencetak
      "Halo, <nama>!".

      Setelah itu panggil fungsi itu dengan nama yang dibaca dari input.
      Bantu Py-Bot menyapa siswa!
    input: "Satu baris: nama siswa."
    output: "Satu baris: Halo, <nama>!"
    contoh:
      - input: "Budi"
        output: "Halo, Budi!"
      - input: "Sari"
        output: "Halo, Sari!"
    tes:
      - input: "Budi"
        output: "Halo, Budi!"
      - input: "Sari"
        output: "Halo, Sari!"
      - input: "Rina"
        output: "Halo, Rina!"
      - input: "Tono"
        output: "Halo, Tono!"
      - input: "Ayu"
        output: "Halo, Ayu!"
    solusi: |
      def sapa(nama):
          print('Halo, ' + nama + '!')

      sapa(input())
    petunjuk:
      - "Definisikan fungsi: def sapa(nama):"
      - "Di dalam fungsi, gabungkan teks: 'Halo, ' + nama + '!'."
      - "Panggil fungsi dengan sapa(input())."

  - id: "s8-2"
    judul: "Luas Karpet Kelas"
    sulit: "sedang"
    cerita: |
      Kelas 7A ingin memasang karpet baru di ruang kelas.
      Panjang dan lebar ruangan sudah diukur, tapi belum dihitung luasnya.

      Buat fungsi bernama luas yang menerima dua parameter:
      panjang dan lebar. Lalu kembalikan hasil panjang dikali lebar.
      Baca panjang dan lebar dari input (dua baris), lalu cetak luas ruangan.
    input: "Baris 1: panjang. Baris 2: lebar."
    output: "Satu angka: luas ruangan."
    contoh:
      - input: "4\n3"
        output: "12"
      - input: "7\n2"
        output: "14"
    tes:
      - input: "4\n3"
        output: "12"
      - input: "7\n2"
        output: "14"
      - input: "10\n10"
        output: "100"
      - input: "1\n1"
        output: "1"
      - input: "6\n5"
        output: "30"
      - input: "12\n8"
        output: "96"
    solusi: |
      def luas(p, l):
          return p * l

      p = int(input())
      l = int(input())
      print(luas(p, l))
    petunjuk:
      - "Fungsi: def luas(p, l): return p * l."
      - "Baca panjang dulu, lalu lebar. Dua baris input."
      - "Cetak hasil pemanggilan luas(p, l)."

  - id: "s8-3"
    judul: "Detektif Bilangan Prima"
    sulit: "sulit"
    cerita: |
      Detektif Angka sedang menguji bilangan-bilangan misterius.
      Ia perlu tahu apakah sebuah bilangan itu PRIMA.
      Bilangan prima hanya bisa dibagi habis oleh 1 dan dirinya sendiri.

      Buat fungsi prima yang menerima satu angka dan mengembalikan
      True kalau angka itu prima, False kalau bukan.
      Baca satu angka dari input, lalu cetak 'prima' atau 'bukan'.
    input: "Satu angka N (1-100)."
    output: "Satu baris: prima atau bukan"
    contoh:
      - input: "7"
        output: "prima"
      - input: "9"
        output: "bukan"
    tes:
      - input: "7"
        output: "prima"
      - input: "9"
        output: "bukan"
      - input: "1"
        output: "bukan"
      - input: "2"
        output: "prima"
      - input: "13"
        output: "prima"
      - input: "4"
        output: "bukan"
    solusi: |
      def prima(n):
          if n < 2:
              return False
          for i in range(2, n):
              if n % i == 0:
                  return False
          return True

      n = int(input())
      if prima(n):
          print('prima')
      else:
          print('bukan')
    petunjuk:
      - "Angka 1 bukan prima. Angka 2 adalah prima."
      - "Cek pembagian dari 2 sampai n-1 dengan for dan %."
      - "Kalau ada angka yang habis membagi n, langsung return False."

  - id: "s8-4"
    judul: "Mesin Pengganda"
    sulit: "mudah"
    cerita: |
      Kancil menemukan mesin ajaib di laboratorium sekolah.
      Mesin itu menggandakan angka: angka 3 jadi 6, angka 5 jadi 10.
      Kamu diminta membuat fungsi bernama dua_kali.
      Fungsi itu menerima satu angka dan mengembalikan angka dikali dua.
      Baca satu angka, lalu cetak hasilnya.
    input: "Satu baris: angka."
    output: "Satu baris: angka dikali dua."
    contoh:
      - input: "3"
        output: "6"
      - input: "5"
        output: "10"
    tes:
      - input: "3"
        output: "6"
      - input: "5"
        output: "10"
      - input: "0"
        output: "0"
      - input: "7"
        output: "14"
      - input: "100"
        output: "200"
      - input: "1"
        output: "2"
    solusi: |
      def dua_kali(n):
          return n * 2

      x = int(input())
      print(dua_kali(x))
    petunjuk:
      - "Buat fungsi: def dua_kali(n): lalu return n * 2."
      - "Baca angka dengan int(input())."
      - "Cetak dengan print(dua_kali(x))."

  - id: "s8-5"
    judul: "Total Belanja Buku"
    sulit: "sedang"
    cerita: |
      Bu Guru mengirim Kancil ke toko buku.
      Dia membeli beberapa buku.
      Setiap buku harganya beda.
      Kancil ingin tahu total harga semuanya.
      Buat fungsi bernama total yang menerima list harga dan mengembalikan jumlahnya.
      Baca banyak buku, lalu harga tiap buku.
      Cetak 'Total: <jumlah>'.
    input: "Baris 1: n (banyak buku). n baris berikutnya: harga buku."
    output: "Satu baris: Total: <jumlah>."
    contoh:
      - input: "3\n5000\n3000\n2000"
        output: "Total: 10000"
      - input: "2\n10000\n5000"
        output: "Total: 15000"
    tes:
      - input: "3\n5000\n3000\n2000"
        output: "Total: 10000"
      - input: "2\n10000\n5000"
        output: "Total: 15000"
      - input: "1\n7000"
        output: "Total: 7000"
      - input: "4\n1000\n2000\n3000\n4000"
        output: "Total: 10000"
      - input: "3\n500\n500\n500"
        output: "Total: 1500"
      - input: "5\n1\n2\n3\n4\n5"
        output: "Total: 15"
    solusi: |
      def total(harga):
          s = 0
          for h in harga:
              s = s + h
          return s

      n = int(input())
      belanja = []
      for i in range(n):
          belanja.append(int(input()))
      print('Total:', total(belanja))
    petunjuk:
      - "Fungsi total(harga) menjumlahkan isi list dengan for."
      - "Kumpulkan semua harga ke list dengan append()."
      - "Cetak 'Total:' lalu hasil pemanggilan total(belanja)."

  - id: "s8-6"
    judul: "Cek Bilangan Genap"
    sulit: "sedang"
    cerita: |
      Kancil membuat permainan tebak-tebakan.
      Satu kartu berisi satu angka.
      Teman harus menyebut: genap atau ganjil.
      Kancil ingin komputernya yang menjawab.
      Buat fungsi bernama genap.
      Fungsi itu menerima satu angka.
      Ia mengembalikan True kalau angkanya genap,
      False kalau ganjil.
      Baca satu angka, lalu cetak 'genap' atau 'ganjil'.
    input: "Satu baris: angka."
    output: "Satu baris: genap atau ganjil"
    contoh:
      - input: "4"
        output: "genap"
      - input: "7"
        output: "ganjil"
    tes:
      - input: "4"
        output: "genap"
      - input: "7"
        output: "ganjil"
      - input: "0"
        output: "genap"
      - input: "1"
        output: "ganjil"
      - input: "100"
        output: "genap"
      - input: "13"
        output: "ganjil"
    solusi: |
      def genap(n):
          if n % 2 == 0:
              return True
          return False

      x = int(input())
      if genap(x):
          print('genap')
      else:
          print('ganjil')
    petunjuk:
      - "Fungsi: def genap(n): lalu cek n % 2 == 0."
      - "Kalau habis dibagi 2, return True. Kalau tidak, return False."
      - "Di luar fungsi, panggil genap(x) lalu cetak hasilnya."

  - id: "s8-7"
    judul: "Faktorial"
    sulit: "sulit"
    cerita: |
      Bu Guru memberi tantangan matematika: menghitung faktorial.
      Faktorial dari 5 artinya 5 x 4 x 3 x 2 x 1 = 120.
      Menghitungnya butuh perkalian berulang.
      Kancil ingin membuat fungsi bernama faktorial.
      Fungsi itu menerima satu angka n.
      Ia mengembalikan hasil 1 x 2 x 3 x ... x n.
      Baca satu angka, lalu cetak faktorialnya.
    input: "Satu baris: angka n (1-10)."
    output: "Satu baris: n! (faktorial dari n)."
    contoh:
      - input: "5"
        output: "120"
      - input: "3"
        output: "6"
    tes:
      - input: "5"
        output: "120"
      - input: "3"
        output: "6"
      - input: "1"
        output: "1"
      - input: "4"
        output: "24"
      - input: "7"
        output: "5040"
      - input: "10"
        output: "3628800"
    solusi: |
      def faktorial(n):
          hasil = 1
          for i in range(1, n + 1):
              hasil = hasil * i
          return hasil

      n = int(input())
      print(faktorial(n))
    petunjuk:
      - "Buat hasil = 1 sebelum loop."
      - "Kalikan dengan setiap angka dari 1 sampai n: hasil = hasil * i."
      - "Return hasil, lalu cetak faktorial(n)."
  - id: "s8-9"
    judul: "Detektif Palindrom"
    sulit: "sulit"
    cerita: |
      Di perpustakaan ada lomba kata ajaib.
      Kata ajaib disebut palindrom.
      Palindrom dibaca dari depan dan belakang hasilnya sama.
      Contohnya kodok dan malam.
      Kancil ingin membuat fungsi bernama palindrom.
      Fungsi itu menerima satu kata.
      Ia mengembalikan True kalau kata itu palindrom.
      Kalau bukan, False.
      Baca satu kata.
      Cetak 'palindrom' atau 'bukan'.
      Ayo bantu Kancil!
    input: "Satu baris: kata (huruf kecil semua)."
    output: "Satu baris: palindrom atau bukan"
    contoh:
      - input: "kodok"
        output: "palindrom"
      - input: "kancil"
        output: "bukan"
    tes:
      - input: "kodok"
        output: "palindrom"
      - input: "kancil"
        output: "bukan"
      - input: "a"
        output: "palindrom"
      - input: "malam"
        output: "palindrom"
      - input: "buku"
        output: "bukan"
      - input: "kasurrusak"
        output: "palindrom"
    solusi: |
      def palindrom(s):
          n = len(s)
          for i in range(n // 2):
              if s[i] != s[n - 1 - i]:
                  return False
          return True

      kata = input()
      if palindrom(kata):
          print('palindrom')
      else:
          print('bukan')
    petunjuk:
      - "Bandingkan huruf depan dan belakang: s[i] dengan s[n - 1 - i]."
      - "Cukup sampai tengah kata: range(n // 2)."
      - "Kalau ada satu beda, langsung return False. Kalau semua sama, return True."

  - id: "s8-8"
    judul: "Penghitung Vokal"
    sulit: "sedang"
    cerita: |
      Kancil belajar membaca kata.
      Bu Guru memberi tantangan: hitung huruf vokal.
      Huruf vokal adalah a, i, u, e, o.
      Kancil harus membuat fungsi bernama vokal.
      Fungsi itu menerima satu kata.
      Lalu mengembalikan banyak huruf vokal di kata itu.
      Baca satu kata.
      Cetak 'Vokal:' lalu jumlahnya.
      Bantu Kancil menang!
    input: "Satu baris: kata (huruf kecil semua)."
    output: "Satu baris: Vokal: <jumlah huruf vokal>."
    contoh:
      - input: "kancil"
        output: "Vokal: 2"
      - input: "python"
        output: "Vokal: 1"
    tes:
      - input: "kancil"
        output: "Vokal: 2"
      - input: "python"
        output: "Vokal: 1"
      - input: "aiueo"
        output: "Vokal: 5"
      - input: "smp"
        output: "Vokal: 0"
      - input: "budi"
        output: "Vokal: 2"
      - input: "sekolah"
        output: "Vokal: 3"
    solusi: |
      def vokal(s):
          j = 0
          for c in s:
              if c in 'aiueo':
                  j = j + 1
          return j

      kata = input()
      print('Vokal:', vokal(kata))
    petunjuk:
      - "Buat fungsi: def vokal(s): lalu loop setiap huruf."
      - "Cek huruf dengan if c in 'aiueo'. Kalau benar, tambah satu."
      - "Return jumlahnya, lalu cetak 'Vokal:' dan hasilnya."

