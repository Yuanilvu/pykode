      - "Buat total = 0 sebelum loop."
      - "Pakai while True. Di dalamnya baca angka dengan int(input())."
      - "Kalau angka 0, pakai break. Kalau bukan, tambahkan ke total."

  - id: "s5-7"
    judul: "Tangga Bintang"
    sulit: "sulit"
    cerita: |
      Kancil membantu menghias kelas dengan kertas bintang.
      Hiasannya berbentuk tangga: baris pertama 1 bintang,
      baris kedua 2 bintang, baris ketiga 3 bintang.
      Makin ke bawah, makin banyak bintangnya.
      Kancil harus membuat tangga dengan N baris.

      Bantu Kancil: baca angka N.
      Lalu cetak N baris bintang.
      Baris ke-i berisi i bintang.
      Pakai for di dalam for!
    input: "Satu angka N (1-10)."
    output: "N baris bintang. Baris ke-i berisi i bintang."
    contoh:
      - input: "3"
        output: "*\n**\n***"
      - input: "5"
        output: "*\n**\n***\n****\n*****"
    tes:
      - input: "1"
        output: "*"
      - input: "2"
        output: "*\n**"
      - input: "3"
        output: "*\n**\n***"
      - input: "4"
        output: "*\n**\n***\n****"
      - input: "5"
        output: "*\n**\n***\n****\n*****"
      - input: "10"
        output: "*\n**\n***\n****\n*****\n******\n*******\n********\n*********\n**********"
    solusi: |
      n = int(input())
      for i in range(1, n + 1):
          for j in range(i):
              print('*', end='')
          print()
    petunjuk:
      - "Pakai for i in range(1, n + 1) untuk tiap baris."
      - "Di dalamnya, pakai for j in range(i) untuk bintang."
      - "Pakai end='' supaya bintang tidak pindah baris. Lalu print() kosong untuk baris baru."
  - id: "s5-8"
    judul: "Jumlah Kelipatan Tiga"
    sulit: "sedang"
    cerita: |
      Kancil belajar berhitung kelipatan tiga.
      Dia menjumlahkan semua kelipatan tiga dari 3
      sampai N. Contoh: kalau N = 9, kelipatannya
      3, 6, 9. Jumlahnya 18. Kalau N bukan kelipatan
      tiga, kelipatan terakhir yang dihitung adalah
      yang paling dekat di bawah N. Baca N, lalu
      cetak jumlahnya.
    input: "Satu angka N (3-100)."
    output: "Satu angka: jumlah semua kelipatan 3 dari 3 sampai N."
    contoh:
      - input: "9"
        output: "18"
      - input: "10"
        output: "18"
    tes:
      - input: "9"
        output: "18"
      - input: "10"
        output: "18"
      - input: "3"
        output: "3"
      - input: "12"
        output: "30"
      - input: "15"
        output: "45"
      - input: "5"
        output: "3"
    solusi: |
      n = int(input())
