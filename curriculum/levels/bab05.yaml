    petunjuk:
      - "Buat total = 0 sebelum loop."
      - "Pakai for i in range(3, n + 1, 3). Angka 3 di tengah adalah langkahnya."
      - "Tambahkan i ke total di dalam loop. Cetak total setelah loop."
  - id: "s5-9"
    judul: "Pembagi Setia"
    sulit: "sulit"
    cerita: |
      Bu Guru memberi Kancil satu angka dan satu tugas.
      Tugasnya: temukan semua bilangan yang bisa membagi
      angka itu tanpa sisa. Bilangan itu namanya pembagi.
      Contoh: pembagi dari 6 adalah 1, 2, 3, dan 6.
      Baca satu angka N, lalu cetak semua pembaginya
      dari 1 sampai N, satu per baris.
    input: "Satu angka N (1-100)."
    output: "Beberapa baris: semua pembagi N, urut dari kecil ke besar."
    contoh:
      - input: "6"
        output: "1\n2\n3\n6"
      - input: "7"
        output: "1\n7"
    tes:
      - input: "6"
        output: "1\n2\n3\n6"
      - input: "7"
        output: "1\n7"
      - input: "1"
        output: "1"
      - input: "12"
        output: "1\n2\n3\n4\n6\n12"
      - input: "10"
        output: "1\n2\n5\n10"
      - input: "100"
        output: "1\n2\n4\n5\n10\n20\n25\n50\n100"
    solusi: |
      n = int(input())
      for i in range(1, n + 1):
          if n % i == 0:
              print(i)
    petunjuk:
      - "Pakai for i in range(1, n + 1) untuk mencoba semua bilangan."
      - "n % i == 0 artinya i membagi n tanpa sisa."
      - "Kalau syaratnya benar, cetak i. Satu pembagi per baris."
