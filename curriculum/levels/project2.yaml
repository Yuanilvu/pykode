proyek2:
  judul: "Game Tebak Angka"
  emoji: "🎮"
  warna: "#8b5cf6"
  deskripsi: "Bikin game sungguhan! Dari tebak angka sampai skor juara. Tiap misi = fitur game baru."
  misi:
    - id: "m2-1"
      judul: "Angka Rahasia"
      emoji: "🎯"
      bab: 13
      menit: 10
      xp: 60
      cerita: |
        Kamu akan bikin game tebak angka! Nanti game ini makin seru
        di tiap misi. Di misi pertama, kita mulai dari yang sederhana.

        Program membaca dua angka. Angka pertama = angka rahasia.
        Angka kedua = tebakan pemain. Kalau sama, pemain menang!
      instruksi: |
        Baca dua angka: angka rahasia lalu tebakan.

        - Kalau tebakan SAMA dengan rahasia, cetak: BENAR!
        - Kalau beda, cetak: SALAH!
      contoh:
        - input: "7\n7"
          output: "BENAR!"
        - input: "7\n5"
          output: "SALAH!"
      tes:
        - input: "7\n7"
          output: "BENAR!"
        - input: "7\n5"
          output: "SALAH!"
        - input: "3\n3"
          output: "BENAR!"
        - input: "10\n1"
          output: "SALAH!"
        - input: "1\n1"
          output: "BENAR!"
      solusi: |
        rahasia = int(input())
        tebak = int(input())
        if tebak == rahasia:
            print('BENAR!')
        else:
            print('SALAH!')

    - id: "m2-2"
      judul: "Mesin Acak"
      emoji: "🎲"
      bab: 13
      menit: 8
      xp: 60
      cerita: |
        Game tebak angka butuh angka rahasia yang berubah-ubah.
        Python punya mesin acak! Pakai import random.

        Supaya hasilnya bisa ditebak di komputer mana pun,
        kita atur benihnya: random.seed(1).
      instruksi: |
        - Ambil mesin acak: import random
        - Atur benih: random.seed(1)
        - Cetak angka acak 1 sampai 10: random.randint(1, 10)
      contoh:
        - input: ""
          output: "3"
      tes:
        - input: ""
          output: "3"
      solusi: |
        import random
        random.seed(1)
        print(random.randint(1, 10))

    - id: "m2-3"
      judul: "Tebak Sampai Benar"
      emoji: "🔁"
      bab: 13
      menit: 12
      xp: 80
      cerita: |
        Sekarang pemain boleh menebak terus sampai benar!
        Angka rahasia dibaca di baris pertama.
        Lalu pemain menebak. Kalau salah, dia menebak lagi.
      instruksi: |
        Baca angka rahasia dulu. Lalu ulangi:
        - Baca tebakan pemain.
        - Kalau benar, cetak BENAR! lalu berhenti.
        - Kalau salah, cetak: SALAH, coba lagi!
      contoh:
        - input: "7\n5\n8\n7"
          output: "SALAH, coba lagi!\nSALAH, coba lagi!\nBENAR!"
        - input: "3\n3"
          output: "BENAR!"
      tes:
        - input: "7\n5\n8\n7"
          output: "SALAH, coba lagi!\nSALAH, coba lagi!\nBENAR!"
        - input: "3\n3"
          output: "BENAR!"
        - input: "5\n1\n2\n3\n4\n5"
          output: "SALAH, coba lagi!\nSALAH, coba lagi!\nSALAH, coba lagi!\nSALAH, coba lagi!\nBENAR!"
        - input: "10\n10"
          output: "BENAR!"
        - input: "2\n9\n2"
          output: "SALAH, coba lagi!\nBENAR!"
      solusi: |
        rahasia = int(input())
        while True:
            tebak = int(input())
            if tebak == rahasia:
                print('BENAR!')
                break
            print('SALAH, coba lagi!')

    - id: "m2-4"
      judul: "Hitung Langkah"
      emoji: "🦶"
      bab: 13
      menit: 12
      xp: 80
      cerita: |
        Game makin seru kalau pemain tahu berapa kali dia menebak.
        Misi ini: hitung jumlah tebakan sampai benar!
      instruksi: |
        Seperti misi sebelumnya, tapi sekarang:
        - Simpan jumlah tebakan di variabel langkah.
        - Tambah 1 setiap kali pemain menebak.
        - Setelah benar, cetak BENAR! lalu cetak: Langkah: <jumlah>
      contoh:
        - input: "7\n5\n7"
          output: "SALAH, coba lagi!\nBENAR!\nLangkah: 2"
        - input: "3\n3"
          output: "BENAR!\nLangkah: 1"
      tes:
        - input: "7\n5\n7"
          output: "SALAH, coba lagi!\nBENAR!\nLangkah: 2"
        - input: "3\n3"
          output: "BENAR!\nLangkah: 1"
        - input: "5\n1\n2\n3\n4\n5"
          output: "SALAH, coba lagi!\nSALAH, coba lagi!\nSALAH, coba lagi!\nSALAH, coba lagi!\nBENAR!\nLangkah: 5"
        - input: "10\n9\n10"
          output: "SALAH, coba lagi!\nBENAR!\nLangkah: 2"
        - input: "2\n1\n1\n2"
          output: "SALAH, coba lagi!\nSALAH, coba lagi!\nBENAR!\nLangkah: 3"
      solusi: |
        rahasia = int(input())
        langkah = 0
        while True:
            tebak = int(input())
            langkah = langkah + 1
            if tebak == rahasia:
                print('BENAR!')
                print('Langkah:', langkah)
                break
            print('SALAH, coba lagi!')

    - id: "m2-5"
      judul: "Nyawa Terbatas"
      emoji: "❤️"
      bab: 13
      menit: 14
      xp: 100
      cerita: |
        Game jadi menegangkan: pemain cuma punya 5 nyawa!
        Setiap tebakan salah, nyawa berkurang.
        Kalau nyawa habis, game selesai.
      instruksi: |
        - Pemain punya 5 nyawa.
        - Setiap tebakan salah: nyawa berkurang 1.
          Lalu cetak: Sisa nyawa: <nyawa>
        - Kalau nyawa jadi 0, cetak: GAME OVER lalu berhenti.
        - Kalau benar, cetak BENAR! lalu berhenti.
      contoh:
        - input: "7\n7"
          output: "BENAR!"
        - input: "7\n1\n2\n3\n4\n5"
          output: "Sisa nyawa: 4\nSisa nyawa: 3\nSisa nyawa: 2\nSisa nyawa: 1\nGAME OVER"
      tes:
        - input: "7\n7"
          output: "BENAR!"
        - input: "7\n1\n2\n3\n4\n5"
          output: "Sisa nyawa: 4\nSisa nyawa: 3\nSisa nyawa: 2\nSisa nyawa: 1\nGAME OVER"
        - input: "3\n1\n3"
          output: "Sisa nyawa: 4\nBENAR!"
        - input: "9\n9"
          output: "BENAR!"
        - input: "4\n5\n4"
          output: "Sisa nyawa: 4\nBENAR!"
        - input: "1\n2\n3\n4\n5\n6\n1"
          output: "Sisa nyawa: 4\nSisa nyawa: 3\nSisa nyawa: 2\nSisa nyawa: 1\nGAME OVER"
      solusi: |
        rahasia = int(input())
        nyawa = 5
        while nyawa > 0:
            tebak = int(input())
            if tebak == rahasia:
                print('BENAR!')
                break
            nyawa = nyawa - 1
            if nyawa == 0:
                print('GAME OVER')
            else:
                print('Sisa nyawa:', nyawa)

    - id: "m2-6"
      judul: "Skor Terbaik"
      emoji: "🏆"
      bab: 13
      menit: 14
      xp: 100
      cerita: |
        Game keren punya skor! Pemain main beberapa ronde.
        Ronde yang paling sedikit langkahnya jadi skor terbaik.
      instruksi: |
        - Baris pertama: n (jumlah ronde).
        - Tiap ronde: angka rahasia, lalu tebakan sampai benar.
          Setelah benar, cetak: Ronde <nomor> : <langkah> langkah
        - Setelah semua ronde, cetak: Terbaik: <langkah terkecil>
      contoh:
        - input: "2\n7\n5\n7\n3\n3"
          output: "SALAH, coba lagi!\nRonde 1 : 2 langkah\nRonde 2 : 1 langkah\nTerbaik: 1"
        - input: "1\n3\n3"
          output: "Ronde 1 : 1 langkah\nTerbaik: 1"
      tes:
        - input: "2\n7\n5\n7\n3\n3"
          output: "SALAH, coba lagi!\nRonde 1 : 2 langkah\nRonde 2 : 1 langkah\nTerbaik: 1"
        - input: "1\n3\n3"
          output: "Ronde 1 : 1 langkah\nTerbaik: 1"
        - input: "2\n4\n9\n4\n1\n5\n1"
          output: "SALAH, coba lagi!\nRonde 1 : 2 langkah\nSALAH, coba lagi!\nRonde 2 : 2 langkah\nTerbaik: 2"
        - input: "1\n9\n9"
          output: "Ronde 1 : 1 langkah\nTerbaik: 1"
      solusi: |
        n = int(input())
        terbaik = 999
        for ronde in range(n):
            rahasia = int(input())
            langkah = 0
            while True:
                tebak = int(input())
                langkah = langkah + 1
                if tebak == rahasia:
                    print('Ronde', ronde + 1, ':', langkah, 'langkah')
                    if langkah < terbaik:
                        terbaik = langkah
                    break
                print('SALAH, coba lagi!')
        print('Terbaik:', terbaik)

    - id: "m2-7"
      judul: "Mode 2 Pemain"
      emoji: "👥"
      bab: 13
      menit: 12
      xp: 100
      cerita: |
        Seru kalau dimainkan bareng kakak atau adik!
        Dua pemain bergantian menebak. Yang benar duluan menang.
      instruksi: |
        - Baca angka rahasia. Pemain 1 mulai duluan.
        - Baca tebakan. Kalau benar: cetak: Pemain <nomor> menang!
        - Kalau salah: cetak: SALAH, coba lagi! lalu ganti pemain.
      contoh:
        - input: "7\n7"
          output: "Pemain 1 menang!"
        - input: "7\n5\n7"
          output: "SALAH, coba lagi!\nPemain 2 menang!"
      tes:
        - input: "7\n7"
          output: "Pemain 1 menang!"
        - input: "7\n5\n7"
          output: "SALAH, coba lagi!\nPemain 2 menang!"
        - input: "5\n1\n2\n5"
          output: "SALAH, coba lagi!\nSALAH, coba lagi!\nPemain 1 menang!"
        - input: "3\n9\n8\n3"
          output: "SALAH, coba lagi!\nSALAH, coba lagi!\nPemain 1 menang!"
      solusi: |
        rahasia = int(input())
        pemain = 1
        while True:
            tebak = int(input())
            if tebak == rahasia:
                print('Pemain', pemain, 'menang!')
                break
            if pemain == 1:
                pemain = 2
            else:
                pemain = 1
            print('SALAH, coba lagi!')

    - id: "m2-8"
      judul: "Game Lengkap"
      emoji: "👑"
      bab: 13
      menit: 15
      xp: 150
      cerita: |
        Ini misi terakhir! Game tebak angka versi lengkap:
        beberapa ronde, skor terbaik, dan gelar JUARA
        kalau pemain hebat (terbaik 3 langkah atau kurang).
      instruksi: |
        - Baris pertama: n (jumlah ronde).
        - Tiap ronde: angka rahasia, lalu tebakan sampai benar.
        - Setelah semua ronde, cetak: Terbaik: <langkah terkecil>
        - Kalau terbaik 3 langkah atau kurang, cetak: JUARA!
      contoh:
        - input: "1\n7\n5\n7"
          output: "SALAH, coba lagi!\nTerbaik: 2\nJUARA!"
        - input: "1\n3\n3"
          output: "Terbaik: 1\nJUARA!"
      tes:
        - input: "1\n7\n5\n7"
          output: "SALAH, coba lagi!\nTerbaik: 2\nJUARA!"
        - input: "1\n3\n3"
          output: "Terbaik: 1\nJUARA!"
        - input: "1\n9\n1\n2\n9"
          output: "SALAH, coba lagi!\nSALAH, coba lagi!\nTerbaik: 3\nJUARA!"
        - input: "2\n5\n1\n2\n3\n4\n5\n3\n3"
          output: "SALAH, coba lagi!\nSALAH, coba lagi!\nSALAH, coba lagi!\nSALAH, coba lagi!\nTerbaik: 1\nJUARA!"
        - input: "1\n6\n6"
          output: "Terbaik: 1\nJUARA!"
      solusi: |
        n = int(input())
        terbaik = 999
        for ronde in range(n):
            rahasia = int(input())
            langkah = 0
            while True:
                tebak = int(input())
                langkah = langkah + 1
                if tebak == rahasia:
                    if langkah < terbaik:
                        terbaik = langkah
                    break
                print('SALAH, coba lagi!')
        print('Terbaik:', terbaik)
        if terbaik <= 3:
            print('JUARA!')
