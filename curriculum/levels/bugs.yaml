  - id: "b11-2"
    judul: "Toko Buku"
    emoji: "🐛"
    bab: 11
    menit: 9
    xp: 40
    cerita: |
      Si Kancil punya toko buku. Harga buku 5000. Ada method
      untuk menaikkan harga. Ditambah 1000 harusnya jadi 6000.
      Tapi harganya malah jadi 1000. Methodnya mengganti harga.
      Padahal harusnya menambah. Perbaiki!
    kode_rusak: |
      class Buku:
          def __init__(self, judul, harga):
              self.judul = judul
              self.harga = harga

          def naik(self, tambah):
              self.harga = tambah

      b = Buku('Dongeng', int(input()))
      b.naik(1000)
      print(b.harga)
    contoh:
      - input: "5000"
        output: "6000"
      - input: "3000"
        output: "4000"
    tes:
      - input: "5000"
        output: "6000"
      - input: "3000"
        output: "4000"
      - input: "2000"
        output: "3000"
      - input: "0"
        output: "1000"
    solusi: |
      class Buku:
          def __init__(self, judul, harga):
              self.judul = judul
              self.harga = harga

          def naik(self, tambah):
              self.harga += tambah

      b = Buku('Dongeng', int(input()))
      b.naik(1000)
      print(b.harga)
    petunjuk:
      - "Naik artinya harga lama DITAMBAH."
      - "+= menambah nilai ke harga lama."
      - "Ganti tanda = menjadi += di method naik."

  - id: "b12-1"
    judul: "Bilangan Genap"
    emoji: "🐛"
    bab: 12
    menit: 8
    xp: 40
    cerita: |
      Si Kancil punya daftar angka. Dia mau ambil yang genap saja.
      Angka 1, 2, 3, 4 harusnya jadi 2, 4. Tapi program mengambil
      1, 3. Itu bilangan ganjil. Syaratnya terbalik. Bilangan
      genap sisa baginya nol. Perbaiki!
    kode_rusak: |
      n = int(input())
      angka = []
      for i in range(n):
          angka.append(int(input()))
      genap = [x for x in angka if x % 2 == 1]
      print(genap)
    contoh:
      - input: "4\n1\n2\n3\n4"
        output: "[2, 4]"
      - input: "3\n5\n6\n7"
        output: "[6]"
    tes:
      - input: "4\n1\n2\n3\n4"
        output: "[2, 4]"
      - input: "3\n5\n6\n7"
        output: "[6]"
      - input: "2\n8\n9"
        output: "[8]"
      - input: "1\n3"
        output: "[]"
    solusi: |
      n = int(input())
      angka = []
      for i in range(n):
          angka.append(int(input()))
      genap = [x for x in angka if x % 2 == 0]
      print(genap)
    petunjuk:
      - "Bilangan genap habis dibagi 2."
      - "x % 2 == 0 artinya sisa baginya nol."
      - "Ganti == 1 menjadi == 0 di syaratnya."

  - id: "b12-2"
    judul: "Skor Tertinggi"
    emoji: "🐛"
    bab: 12
    menit: 9
    xp: 40
    cerita: |
      Si Kancil mengumpulkan skor mainan. Dia mau urut dari yang
      terbesar. Skor 5, 9, 2 harusnya 9, 5, 2. Tapi program
      mencetak 2, 5, 9. Urutannya terbalik. Kunci lambda-nya
      kurang tepat. Perbaiki kodenya!
    kode_rusak: |
      n = int(input())
      skor = []
      for i in range(n):
          skor.append(int(input()))
      urut = sorted(skor, key=lambda x: x)
      print(urut)
    contoh:
      - input: "3\n5\n9\n2"
        output: "[9, 5, 2]"
      - input: "2\n4\n7"
        output: "[7, 4]"
    tes:
      - input: "3\n5\n9\n2"
        output: "[9, 5, 2]"
      - input: "2\n4\n7"
        output: "[7, 4]"
      - input: "4\n1\n8\n3\n6"
        output: "[8, 6, 3, 1]"
      - input: "1\n5"
        output: "[5]"
    solusi: |
      n = int(input())
      skor = []
      for i in range(n):
          skor.append(int(input()))
      urut = sorted(skor, key=lambda x: -x)
      print(urut)
    petunjuk:
      - "Kancil mau skor besar muncul duluan."
      - "key=lambda x: -x membalik urutan naik."
      - "Tambahkan tanda minus di depan x."
