bab: 4
judul: "Percabangan"
emoji: "🚦"
warna: "#ef4444"
deskripsi: "Program bisa memilih jalan: if, elif, else."

pelajaran:
  - id: "4-1"
    judul: "Jalan Bercabang: if"
    menit: 8
    materi: |
      Program yang hebat tidak hanya berjalan lurus — kadang dia harus
      memilih jalan. Di sinilah percabangan masuk. Dengan `if`, program
      memeriksa sebuah syarat; kalau syaratnya benar, dia menjalankan
      kode di bawahnya.

      ## Cara menulis if

      `if umur >= 13:`
      `    print('Kamu remaja')`

      Perhatikan tiga hal penting:

      1. Setelah syarat ada tanda titik dua `:`
      2. Kode di bawahnya menjorok ke dalam (indentasi) — biasanya 4
         spasi. Ini cara Python tahu kode mana milik if.
      3. Kalau syarat salah, kode yang menjorok itu dilewati begitu saja

      ## Tanda perbandingan

      - `==` sama dengan (dua tanda sama! beda dengan `=` yang mengisi
        variabel)
      - `!=` tidak sama dengan
      - `>` lebih besar, `<` lebih kecil
      - `>=` lebih besar atau sama, `<=` lebih kecil atau sama

      Hati-hati dengan `==`: satu tanda sama dengan itu mengisi
      variabel, dua tanda sama dengan itu membandingkan. Tertukar
      sedikit saja, programmu bisa error atau bertingkah aneh. Coba dua
      contoh di bawah ini dan ubah-ubah angkanya!
    contoh:
      - kode: |
          umur = 15
          if umur >= 13:
              print('Kamu sudah remaja')
        penjelasan: "15 lebih besar atau sama dengan 13, jadi baris di dalam if ikut dijalankan."
      - kode: |
          nama = 'Kancil'
          if nama == 'Kancil':
              print('Halo, Kancil!')
        penjelasan: "== membandingkan isi variabel dengan teks 'Kancil'; karena cocok, sapaan dicetak."
    kuis:
      - soal: "Apa yang terjadi kalau syarat if bernilai salah?"
        pilihan:
          - "kode di dalam if tetap jalan"
          - "kode di dalam if dilewati"
          - "program error"
          - "program berhenti"
        jawaban: 1
        penjelasan: "Kalau syarat salah, blok if dilewati dan program lanjut ke baris berikutnya."
      - soal: "Tanda apa untuk membandingkan 'sama dengan' di Python?"
        pilihan:
          - "="
          - "=="
          - "!="
          - ":="
        jawaban: 1
        penjelasan: "== dipakai untuk membandingkan; satu tanda = khusus untuk mengisi variabel."
      - soal: "Kode di dalam if harus..."
        pilihan:
          - "menjorok ke dalam (indentasi)"
          - "sejajar dengan if"
          - "di atas if"
          - "satu baris dengan if"
        jawaban: 0
        penjelasan: "Blok if ditandai dengan indentasi (menjorok ke dalam), biasanya 4 spasi."

  - id: "4-2"
    judul: "Pilih Satu: if/else"
    menit: 7
    materi: |
      `if` saja masih setengah jalan — bagaimana kalau syaratnya salah?
      Kita ingin program tetap melakukan sesuatu. Di sinilah `else`
      datang: blok yang jalan kalau syarat `if` salah.

      `if nilai >= 75:`
      `    print('Lulus!')`
      `else:`
      `    print('Belum lulus')`

      Satu hal penting: dari pasangan if/else, tepat satu blok yang
      selalu jalan. Tidak mungkin dua-duanya, dan tidak mungkin tidak
      ada.

      ## Kapan else dipakai?

      Else cocok untuk keputusan dua pilihan: lulus/tidak, benar/salah,
      genap/ganjil, boleh/tidak boleh. Program jadi seperti koin:
      selalu mendarat di satu sisi.

      Kamu juga bisa memakai `!=` untuk memeriksa ketidaksamaan.
      Misalnya, kalau jawaban user tidak sama dengan kunci jawaban,
      program bisa mencetak 'Salah!'. Coba contoh kedua dan ubah nilai
      `jawaban` — lihat bagaimana hasilnya berubah!

      ## Contoh sehari-hari

      Bayangkan program absen kelas: kalau kehadiran lebih dari 20
      hari, cetak 'Rajin'. Kalau tidak, cetak 'Ayo lebih rajin!'. Hanya
      dengan if dan else, program sudah bisa menilai siswanya.

      Else juga nanti bisa dipakai di dalam program yang lebih besar —
      misalnya di dalam percabangan lain. Tapi untuk sekarang, ingat
      satu hal: if dan else selalu berpasangan, dan tepat satu blok
      yang jalan.
    contoh:
      - kode: |
          nilai = 80
          if nilai >= 75:
              print('Lulus!')
          else:
              print('Belum lulus')
        penjelasan: "80 memenuhi syarat, jadi yang dicetak 'Lulus!' — blok else dilewati."
      - kode: |
          jawaban = 'kancil'
          if jawaban != 'kancil':
              print('Salah!')
          else:
              print('Benar!')
        penjelasan: "jawaban sama dengan 'kancil', jadi syarat != bernilai salah dan blok else yang jalan."
    kuis:
      - soal: "Kalau syarat if salah, blok mana yang jalan?"
        pilihan:
          - "blok if"
          - "blok else"
          - "dua-duanya"
          - "tidak ada"
        jawaban: 1
        penjelasan: "else menjalankan kodenya kalau syarat if salah. Tepat satu blok yang selalu jalan."
      - soal: "Kapan else dipakai?"
        pilihan:
          - "saat pilihan lebih dari dua"
          - "saat ada dua pilihan: syarat benar atau salah"
          - "saat program error"
          - "tidak pernah"
        jawaban: 1
        penjelasan: "if/else cocok untuk keputusan dua pilihan, seperti lulus atau tidak lulus."
      - soal: "Apa output kode ini?\n\nx = 5\nif x > 10:\n    print('Besar')\nelse:\n    print('Kecil')"
        pilihan:
          - "Besar"
          - "Kecil"
          - "Besar dan Kecil"
          - "error"
        jawaban: 1
        penjelasan: "5 tidak lebih besar dari 10, jadi blok if dilewati dan blok else yang jalan: Kecil."

  - id: "4-3"
    judul: "Banyak Pilihan: elif"
    menit: 8
    materi: |
      Bagaimana kalau pilihannya lebih dari dua? Misalnya nilai diubah
      jadi huruf A, B, atau C. Pakai `elif` — kependekan dari "else if".
      Elif dipasang di antara if dan else, dan bisa dipasang
      berulang-ulang.

      `nilai = 85`
      `if nilai >= 85:`
      `    print('A')`
      `elif nilai >= 70:`
      `    print('B')`
      `elif nilai >= 60:`
      `    print('C')`
      `else:`
      `    print('D')`

      ## Cara kerja elif

      Python memeriksa dari atas ke bawah. Begitu menemukan syarat yang
      benar, blok itu dijalankan, lalu Python melompat ke akhir
      percabangan — syarat di bawahnya tidak diperiksa lagi.

      Jadi pada contoh di atas, nilai 85 memenuhi syarat pertama
      (>= 85) langsung dapat A. Nilai 75 tidak memenuhi syarat pertama,
      tapi memenuhi `elif nilai >= 70`, jadi dapat B.

      ## Yang perlu diingat

      - Urutan elif itu penting! Periksa syarat yang paling ketat dulu
      - Hanya satu blok yang jalan — yang pertama kali benar dari atas
      - Else di paling akhir menangkap semua yang tidak lolos

      Coba ubah-ubah nilai di contoh dan lihat huruf apa yang keluar!
    contoh:
      - kode: |
          nilai = 90
          if nilai >= 85:
              print('A')
          elif nilai >= 70:
              print('B')
          else:
              print('C')
        penjelasan: "90 memenuhi syarat pertama (>= 85), jadi langsung dapat A — elif tidak diperiksa."
      - kode: |
          menu = 'nasi'
          if menu == 'nasi':
              print('Nasi goreng!')
          elif menu == 'mie':
              print('Mie ayam!')
          else:
              print('Terserah kamu')
        penjelasan: "menu berisi 'nasi', jadi hanya blok pertama yang jalan."
    kuis:
      - soal: "Apa kepanjangan dari elif?"
        pilihan:
          - "else if"
          - "equal if"
          - "end if"
          - "elif tidak punya kepanjangan"
        jawaban: 0
        penjelasan: "elif adalah kependekan dari 'else if': syarat berikutnya yang diperiksa kalau yang sebelumnya salah."
      - soal: "Berapa blok yang dijalankan dalam satu rangkaian if/elif/else?"
        pilihan:
          - "semua blok"
          - "dua blok"
          - "tepat satu blok"
          - "tidak tentu"
        jawaban: 2
        penjelasan: "Python memeriksa dari atas; begitu ada syarat benar, blok itu jalan dan sisanya dilewati."
      - soal: "Nilai 75 di kode ini dapat huruf apa?\n\nif nilai >= 85:\n    print('A')\nelif nilai >= 70:\n    print('B')\nelse:\n    print('C')"
        pilihan:
          - "A"
          - "B"
          - "C"
          - "error"
        jawaban: 1
        penjelasan: "75 tidak memenuhi syarat pertama, tapi memenuhi elif nilai >= 70, jadi dapat B."

  - id: "4-4"
    judul: "Gabungkan Syarat & Sisa Bagi"
    menit: 9
    materi: |
      Satu syarat kadang tidak cukup. Bagaimana kalau mau naik wahana
      harus umur 12 ke atas DAN tinggi 140 ke atas? Gabungkan dengan
      kata kunci logika:

      - `and` — kedua syarat harus benar
      - `or` — salah satu benar saja cukup
      - `not` — membalikkan: benar jadi salah, salah jadi benar

      `if umur >= 12 and tinggi >= 140:`
      `    print('Boleh naik')`

      ## Sisa bagi dan pembagian bulat

      Ada dua operator keren untuk bilangan bulat:

      - `%` (modulo) — sisa bagi. `7 % 2` hasilnya 1 (7 dibagi 2 sisa 1).
        `10 % 5` hasilnya 0.
      - `//` — pembagian bulat. `7 // 2` hasilnya 3 (bagian bulatnya
        saja, sisa dibuang).

      Modulo jago untuk mengecek genap/ganjil: kalau `n % 2 == 0`,
      berarti n genap. Modulo juga dipakai untuk tahu apakah suatu
      bilangan habis dibagi bilangan lain — kamu akan butuh ini di soal
      tahun kabisat nanti!

      Coba dua contoh di bawah: yang pertama memakai and, yang kedua
      memakai modulo. Ubah-ubah angkanya!
    contoh:
      - kode: |
          umur = 14
          tinggi = 150
          if umur >= 12 and tinggi >= 140:
              print('Boleh naik wahana')
          else:
              print('Belum boleh naik')
        penjelasan: "Kedua syarat benar (14 >= 12 dan 150 >= 140), jadi and bernilai benar."
      - kode: |
          n = 7
          if n % 2 == 0:
              print('Genap')
          else:
              print('Ganjil')
        penjelasan: "7 % 2 = 1, tidak sama dengan 0, jadi n ganjil."
    kuis:
      - soal: "Berapa hasil 10 % 3?"
        pilihan:
          - "3"
          - "1"
          - "0"
          - "3.33"
        jawaban: 1
        penjelasan: "10 dibagi 3 = 3 sisa 1. Operator % memberi sisanya, yaitu 1."
      - soal: "Berapa hasil 7 // 2?"
        pilihan:
          - "3"
          - "3.5"
          - "1"
          - "2"
        jawaban: 0
        penjelasan: "// membagi dan membuang sisanya: 7 // 2 = 3."
      - soal: "Syarat umur >= 12 and tinggi >= 140 bernilai benar kalau..."
        pilihan:
          - "salah satu benar"
          - "dua-duanya benar"
          - "umur saja yang benar"
          - "tinggi saja yang benar"
        jawaban: 1
        penjelasan: "and menuntut kedua syarat benar. Kalau mau salah satu cukup, pakai or."

soal:
  - id: "s4-1"
    judul: "Permen Genap Ganjil"
    sulit: "mudah"
    cerita: |
      Bibi memberi Kancil sekantong permen. Kancil ingin membagi
      permennya menjadi dua kelompok sama rata untuk dimakan bersama
      teman, tapi dia tidak tahu jumlahnya genap atau ganjil. Kalau
      jumlah permen habis dibagi dua, cetak 'Genap'. Kalau bersisa satu,
      cetak 'Ganjil'. Bantuin Kancil: baca jumlah permen, periksa
      sisanya dengan operator %, lalu cetak jawabannya.
    input: "Satu baris: jumlah permen (int)."
    output: "Satu baris: Genap atau Ganjil."
    contoh:
      - input: "8"
        output: "Genap"
      - input: "7"
        output: "Ganjil"
    tes:
      - input: "8"
        output: "Genap"
      - input: "7"
        output: "Ganjil"
      - input: "0"
        output: "Genap"
      - input: "100"
        output: "Genap"
      - input: "33"
        output: "Ganjil"
    solusi: |
      n = int(input())
      if n % 2 == 0:
          print('Genap')
      else:
          print('Ganjil')
    petunjuk:
      - "Baca n dengan int(input())."
      - "n % 2 memberi sisa bagi 2; kalau sisanya 0 berarti habis dibagi dua."
      - "Cetak 'Genap' kalau n % 2 == 0, selain itu cetak 'Ganjil'."

  - id: "s4-2"
    judul: "Nilai Raport"
    sulit: "sedang"
    cerita: |
      Akhir semester tiba! Bu Guru membagikan raport dan mengubah nilai
      menjadi huruf. Nilai 85 ke atas mendapat A, nilai 70 sampai 84
      mendapat B, nilai 60 sampai 69 mendapat C, dan nilai di bawah 60
      mendapat D. Kancil mengetik nilainya di komputer, lalu program
      mencetak huruf yang dia dapat. Bantuin Kancil: baca satu nilai,
      periksa dengan if dan elif dari atas ke bawah, lalu cetak
      hurufnya.
    input: "Satu baris: nilai (int)."
    output: "Satu baris: A, B, C, atau D."
    contoh:
      - input: "90"
        output: "A"
      - input: "75"
        output: "B"
    tes:
      - input: "90"
        output: "A"
      - input: "75"
        output: "B"
      - input: "60"
        output: "C"
      - input: "59"
        output: "D"
      - input: "85"
        output: "A"
      - input: "69"
        output: "C"
    solusi: |
      n = int(input())
      if n >= 85:
          print('A')
      elif n >= 70:
          print('B')
      elif n >= 60:
          print('C')
      else:
          print('D')
    petunjuk:
      - "Baca nilai dengan int(input()) dan simpan di variabel n."
      - "Periksa dari atas: n >= 85 dapat A, lalu n >= 70 dapat B, lalu n >= 60 dapat C."
      - "Semua yang tersisa (di bawah 60) masuk ke else dan dapat D."

  - id: "s4-3"
    judul: "Tahun Kabisat"
    sulit: "sulit"
    cerita: |
      Kancil membantu Bu Guru menyusun kalender sekolah untuk tahun
      depan. Bu Guru ingin tahu tahun mana yang kabisat. Aturannya:
      tahun habis dibagi 4 adalah kabisat, kecuali kalau habis dibagi
      100 — tapi kalau habis dibagi 400, tetap kabisat. Contoh: 2024
      kabisat, 1900 bukan, 2000 kabisat. Baca satu tahun, lalu cetak
      'Kabisat' atau 'Bukan kabisat'. Gunakan operator % bersama and
      dan or!
    input: "Satu baris: tahun (int)."
    output: "Satu baris: Kabisat atau Bukan kabisat."
    contoh:
      - input: "2024"
        output: "Kabisat"
      - input: "1900"
        output: "Bukan kabisat"
    tes:
      - input: "2024"
        output: "Kabisat"
      - input: "1900"
        output: "Bukan kabisat"
      - input: "2000"
        output: "Kabisat"
      - input: "2021"
        output: "Bukan kabisat"
      - input: "1600"
        output: "Kabisat"
      - input: "2100"
        output: "Bukan kabisat"
    solusi: |
      t = int(input())
      if (t % 4 == 0 and t % 100 != 0) or t % 400 == 0:
          print('Kabisat')
      else:
          print('Bukan kabisat')
    petunjuk:
      - "Habis dibagi 4 artinya t % 4 == 0."
      - "Gabungkan syaratnya: (habis dibagi 4 DAN tidak habis dibagi 100) ATAU habis dibagi 400."
      - "Cetak 'Kabisat' kalau syarat gabungan benar, selain itu cetak 'Bukan kabisat'."
