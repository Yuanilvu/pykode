bab: 4
judul: "Percabangan"
emoji: "🚦"
warna: "#ef4444"
deskripsi: "Program bisa memilih jalan: if, elif, else."

pelajaran:
  - id: "4-1"
    judul: "Jalan Bercabang: if"
    menit: 8
    materi: |
      Program yang hebat tidak hanya berjalan lurus. Kadang dia harus
      memilih jalan. Ini namanya percabangan. Dengan `if`, program
      memeriksa sebuah syarat. Kalau syaratnya benar, dia menjalankan
      kode di bawahnya.

      ## Cara menulis if

      `if umur >= 13:`
      `    print('Kamu remaja')`

      Perhatikan tiga hal penting:

      1. Setelah syarat ada tanda titik dua `:`
      2. Kode di bawahnya menjorok ke dalam (indentasi) — biasanya 4
         spasi. Ini cara Python tahu kode mana milik if.
      3. Kalau syarat salah, kode yang menjorok itu dilewati begitu saja

      ## Tanda perbandingan

      - `==` sama dengan (dua tanda sama! beda dengan `=` yang mengisi
        variabel)
      - `!=` tidak sama dengan
      - `>` lebih besar, `<` lebih kecil
      - `>=` lebih besar atau sama, `<=` lebih kecil atau sama

      Hati-hati dengan `==`: satu tanda sama dengan itu mengisi
      variabel. Dua tanda sama dengan itu membandingkan. Tertukar
      sedikit saja, programmu bisa error atau bertingkah aneh. Coba dua
      contoh di bawah ini dan ubah-ubah angkanya!
    contoh:
      - kode: |
          umur = 15
          if umur >= 13:
              print('Kamu sudah remaja')
        penjelasan: "15 lebih besar atau sama dengan 13. Jadi baris di dalam if ikut dijalankan."
      - kode: |
          nama = 'Kancil'
          if nama == 'Kancil':
              print('Halo, Kancil!')
        penjelasan: "== membandingkan isi variabel dengan tulisan 'Kancil'. Karena cocok, sapaan dicetak."
    kuis:
      - soal: "Apa yang terjadi kalau syarat if bernilai salah?"
        pilihan:
          - "kode di dalam if tetap jalan"
          - "kode di dalam if dilewati"
          - "program error"
          - "program berhenti"
        jawaban: 1
        penjelasan: "Kalau syarat salah, blok if dilewati. Program lanjut ke baris berikutnya."
      - soal: "Tanda apa untuk membandingkan 'sama dengan' di Python?"
        pilihan:
          - "="
          - "=="
          - "!="
          - ":="
        jawaban: 1
        penjelasan: "== dipakai untuk membandingkan. Satu tanda = khusus untuk mengisi variabel."
      - soal: "Kode di dalam if harus..."
        pilihan:
          - "menjorok ke dalam (indentasi)"
          - "sejajar dengan if"
          - "di atas if"
          - "satu baris dengan if"
        jawaban: 0
        penjelasan: "Blok if ditandai dengan indentasi (menjorok ke dalam), biasanya 4 spasi."
      - soal: "Kode ini mencetak apa?\n\nx = 3\nif x > 5:\n    print('Besar')"
        pilihan:
          - "Besar"
          - "tidak mencetak apa pun"
          - "error"
          - "x"
        jawaban: 1
        penjelasan: "3 tidak lebih besar dari 5. Blok if dilewati, jadi tidak ada yang tercetak."
      - soal: "Syarat mana yang benar untuk umur 12 tahun atau lebih?"
        pilihan:
          - "umur > 12"
          - "umur >= 12"
          - "umur == 12"
          - "umur < 12"
        jawaban: 1
        penjelasan: ">= artinya lebih besar atau sama dengan. Jadi umur 12 ikut masuk."

  - id: "4-2"
    judul: "Pilih Satu: if/else"
    menit: 7
    materi: |
      `if` saja masih setengah jalan. Bagaimana kalau syaratnya salah?
      Kita ingin program tetap melakukan sesuatu. Di sinilah `else`
      datang. `else` adalah blok yang jalan kalau syarat `if` salah.

      `if nilai >= 75:`
      `    print('Lulus!')`
      `else:`
      `    print('Belum lulus')`

      Satu hal penting: dari pasangan if/else, tepat satu blok yang
      selalu jalan. Tidak mungkin dua-duanya. Tidak mungkin juga tidak
      ada.

      ## Kapan else dipakai?

      Else cocok untuk keputusan dua pilihan: lulus/tidak, benar/salah,
      genap/ganjil, boleh/tidak boleh. Program jadi seperti koin:
      selalu mendarat di satu sisi.

      Kamu juga bisa memakai `!=` untuk memeriksa ketidaksamaan.
      Misalnya, kalau jawaban kamu tidak sama dengan kunci jawaban,
      program bisa mencetak 'Salah!'. Coba contoh kedua dan ubah nilai
      `jawaban`. Lihat bagaimana hasilnya berubah!

      ## Contoh sehari-hari

      Bayangkan program absen kelas. Kalau kehadiran lebih dari 20
      hari, cetak 'Rajin'. Kalau tidak, cetak 'Ayo lebih rajin!'. Hanya
      dengan if dan else, program sudah bisa menilai siswanya.

      Else juga nanti bisa dipakai di dalam program yang lebih besar.
      Misalnya di dalam percabangan lain. Tapi untuk sekarang, ingat
      satu hal: if dan else selalu berpasangan. Tepat satu blok yang
      jalan.
    contoh:
      - kode: |
          nilai = 80
          if nilai >= 75:
              print('Lulus!')
          else:
              print('Belum lulus')
        penjelasan: "80 memenuhi syarat. Jadi yang dicetak 'Lulus!' — blok else dilewati."
      - kode: |
          jawaban = 'kancil'
          if jawaban != 'kancil':
              print('Salah!')
          else:
              print('Benar!')
        penjelasan: "jawaban sama dengan 'kancil'. Jadi syarat != bernilai salah dan blok else yang jalan."
    kuis:
      - soal: "Kalau syarat if salah, blok mana yang jalan?"
        pilihan:
          - "blok if"
          - "blok else"
          - "dua-duanya"
          - "tidak ada"
        jawaban: 1
        penjelasan: "else menjalankan kodenya kalau syarat if salah. Tepat satu blok yang selalu jalan."
      - soal: "Kapan else dipakai?"
        pilihan:
          - "saat pilihan lebih dari dua"
          - "saat ada dua pilihan: syarat benar atau salah"
          - "saat program error"
          - "tidak pernah"
        jawaban: 1
        penjelasan: "if/else cocok untuk keputusan dua pilihan, seperti lulus atau tidak lulus."
      - soal: "Kode ini mencetak apa?\n\nx = 5\nif x > 10:\n    print('Besar')\nelse:\n    print('Kecil')"
        pilihan:
          - "Besar"
          - "Kecil"
          - "Besar dan Kecil"
          - "error"
        jawaban: 1
        penjelasan: "5 tidak lebih besar dari 10. Jadi blok if dilewati dan blok else yang jalan: Kecil."
      - soal: "Kode ini mencetak apa?\n\nhadir = 18\nif hadir >= 20:\n    print('Rajin')\nelse:\n    print('Ayo lebih rajin')"
        pilihan:
          - "Rajin"
          - "Ayo lebih rajin"
          - "Rajin dan Ayo lebih rajin"
          - "error"
        jawaban: 1
        penjelasan: "18 kurang dari 20. Jadi blok else yang jalan."
      - soal: "jawaban berisi 'budi'. Kode ini mencetak apa?\n\nif jawaban != 'kancil':\n    print('Salah!')\nelse:\n    print('Benar!')"
        pilihan:
          - "Salah!"
          - "Benar!"
          - "Salah! dan Benar!"
          - "error"
        jawaban: 0
        penjelasan: "'budi' tidak sama dengan 'kancil'. Jadi syarat != benar dan blok if yang jalan."

  - id: "4-3"
    judul: "Banyak Pilihan: elif"
    menit: 8
    materi: |
      Bagaimana kalau pilihannya lebih dari dua? Misalnya nilai diubah
      jadi huruf A, B, atau C. Pakai `elif` — kependekan dari "else if".
      Elif dipasang di antara if dan else. Bisa dipasang berulang-ulang.

      `nilai = 85`
      `if nilai >= 85:`
      `    print('A')`
      `elif nilai >= 70:`
      `    print('B')`
      `elif nilai >= 60:`
      `    print('C')`
      `else:`
      `    print('D')`

      ## Cara kerja elif

      Python memeriksa dari atas ke bawah. Begitu menemukan syarat yang
      benar, blok itu dijalankan. Lalu Python melompat ke akhir
      percabangan. Syarat di bawahnya tidak diperiksa lagi.

      Jadi pada contoh di atas, nilai 85 memenuhi syarat pertama
      (>= 85) langsung dapat A. Nilai 75 tidak memenuhi syarat pertama.
      Tapi memenuhi `elif nilai >= 70`, jadi dapat B.

      ## Yang perlu diingat

      - Urutan elif itu penting! Periksa syarat yang paling ketat dulu
      - Hanya satu blok yang jalan — yang pertama kali benar dari atas
      - Else di paling akhir menangkap semua yang tidak lolos

      Coba ubah-ubah nilai di contoh dan lihat huruf apa yang keluar!
    contoh:
      - kode: |
          nilai = 90
          if nilai >= 85:
              print('A')
          elif nilai >= 70:
              print('B')
          else:
              print('C')
        penjelasan: "90 memenuhi syarat pertama (>= 85). Jadi langsung dapat A — elif tidak diperiksa."
      - kode: |
          menu = 'nasi'
          if menu == 'nasi':
              print('Nasi goreng!')
          elif menu == 'mie':
              print('Mie ayam!')
          else:
              print('Terserah kamu')
        penjelasan: "menu berisi 'nasi'. Jadi hanya blok pertama yang jalan."
    kuis:
      - soal: "Apa kepanjangan dari elif?"
        pilihan:
          - "else if"
          - "equal if"
          - "end if"
          - "elif tidak punya kepanjangan"
        jawaban: 0
        penjelasan: "elif adalah kependekan dari 'else if'. Syarat berikutnya yang diperiksa kalau yang sebelumnya salah."
      - soal: "Berapa blok yang dijalankan dalam satu rangkaian if/elif/else?"
        pilihan:
          - "semua blok"
          - "dua blok"
          - "tepat satu blok"
          - "tidak tentu"
        jawaban: 2
        penjelasan: "Python memeriksa dari atas. Begitu ada syarat benar, blok itu jalan dan sisanya dilewati."
      - soal: "Nilai 75 di kode ini dapat huruf apa?\n\nif nilai >= 85:\n    print('A')\nelif nilai >= 70:\n    print('B')\nelse:\n    print('C')"
        pilihan:
          - "A"
          - "B"
          - "C"
          - "error"
        jawaban: 1
        penjelasan: "75 tidak memenuhi syarat pertama. Tapi memenuhi elif nilai >= 70, jadi dapat B."
      - soal: "Nilai 55 di kode ini dapat huruf apa?\n\nif nilai >= 85:\n    print('A')\nelif nilai >= 70:\n    print('B')\nelse:\n    print('C')"
        pilihan:
          - "A"
          - "B"
          - "C"
          - "error"
        jawaban: 2
        penjelasan: "55 tidak lolos syarat pertama dan kedua. Dia masuk ke else dan dapat C."
      - soal: "Mengapa urutan elif itu penting?"
        pilihan:
          - "urutan tidak penting sama sekali"
          - "yang benar pertama kali dari atas yang jalan"
          - "yang benar terakhir yang jalan"
          - "semua blok ikut jalan"
        jawaban: 1
        penjelasan: "Python memeriksa dari atas ke bawah. Begitu ada syarat benar, blok itu jalan dan berhenti."

  - id: "4-4"
    judul: "Gabungkan Syarat & Sisa Bagi"
    menit: 9
    materi: |
      Satu syarat kadang tidak cukup. Bagaimana kalau mau naik wahana
      harus umur 12 ke atas DAN tinggi 140 ke atas? Gabungkan dengan
      kata kunci logika:

      - `and` — kedua syarat harus benar
      - `or` — salah satu benar saja cukup
      - `not` — membalikkan: benar jadi salah, salah jadi benar

      `if umur >= 12 and tinggi >= 140:`
      `    print('Boleh naik')`

      ## Sisa bagi dan pembagian bulat

      Ada dua operator keren untuk bilangan bulat:

      - `%` (modulo) — sisa bagi. `7 % 2` hasilnya 1 (7 dibagi 2 sisa 1).
        `10 % 5` hasilnya 0.
      - `//` — pembagian bulat. `7 // 2` hasilnya 3 (bagian bulatnya
        saja, sisa dibuang).

      Modulo jago untuk mengecek genap/ganjil: kalau `n % 2 == 0`,
      berarti n genap. Modulo juga dipakai untuk tahu apakah suatu
      bilangan habis dibagi bilangan lain. Kamu akan butuh ini di soal
      tahun kabisat nanti!

      Coba dua contoh di bawah: yang pertama memakai and, yang kedua
      memakai modulo. Ubah-ubah angkanya!
    contoh:
      - kode: |
          umur = 14
          tinggi = 150
          if umur >= 12 and tinggi >= 140:
              print('Boleh naik wahana')
          else:
              print('Belum boleh naik')
        penjelasan: "Kedua syarat benar (14 >= 12 dan 150 >= 140). Jadi and bernilai benar."
      - kode: |
          n = 7
          if n % 2 == 0:
              print('Genap')
          else:
              print('Ganjil')
        penjelasan: "7 % 2 = 1, tidak sama dengan 0. Jadi n ganjil."
    kuis:
      - soal: "Berapa hasil 10 % 3?"
        pilihan:
          - "3"
          - "1"
          - "0"
          - "3.33"
        jawaban: 1
        penjelasan: "10 dibagi 3 = 3 sisa 1. Operator % memberi sisanya, yaitu 1."
      - soal: "Berapa hasil 7 // 2?"
        pilihan:
          - "3"
          - "3.5"
          - "1"
          - "2"
        jawaban: 0
        penjelasan: "// membagi dan membuang sisanya: 7 // 2 = 3."
      - soal: "Syarat umur >= 12 and tinggi >= 140 bernilai benar kalau..."
        pilihan:
          - "salah satu benar"
          - "dua-duanya benar"
          - "umur saja yang benar"
          - "tinggi saja yang benar"
        jawaban: 1
        penjelasan: "and menuntut kedua syarat benar. Kalau mau salah satu cukup, pakai or."
      - soal: "Syarat mana yang bernilai benar?\n\numur = 10\ntinggi = 150"
        pilihan:
          - "umur >= 12 and tinggi >= 140"
          - "umur >= 12 or tinggi >= 140"
          - "umur >= 12 and tinggi >= 150"
          - "umur >= 12 or tinggi <= 140"
        jawaban: 1
        penjelasan: "and butuh dua-duanya benar. Umur 10 gagal. or cukup satu benar, tinggi 150 lolos."
      - soal: "Berapa hasil 17 % 5?"
        pilihan:
          - "3"
          - "2"
          - "3.4"
          - "1"
        jawaban: 1
        penjelasan: "17 dibagi 5 = 3 sisa 2. Operator % memberi sisanya, yaitu 2."

  - id: "4-5"
    judul: "Keputusan Berlapis: if di Dalam if"
    menit: 8
    materi: |
      Pernah masuk gerbang sekolah? Ada dua penjaga. Penjaga pertama memeriksa
      kartu pelajar. Kalau lolos, baru penjaga kedua memeriksa tasmu.

      Itulah if di dalam if. Disebut percabangan berlapis. If bagian luar
      diperiksa dulu. Kalau benar, barulah if bagian dalam diperiksa.
      Kalau if luar salah, if dalam tidak pernah diperiksa.

      ## Contoh sehari-hari

      Mau masuk pesta ulang tahun. Syarat pertama: diundang atau tidak.
      Kalau diundang, syarat kedua: bawa kado atau tidak.

      ```
      if diundang:
          if bawa_kado:
              print('Silakan masuk!')
          else:
              print('Kado dulu, ya!')
      else:
          print('Belum diundang')
      ```

      Anak yang tidak diundang langsung ditolak penjaga pertama.
      If dalam tidak sempat diperiksa.

      ## Aturan penting

      - Tulis if dalam dengan indentasi lebih dalam (8 spasi)
      - If dalam hanya jalan kalau if luar benar
      - Setiap if boleh punya else sendiri
      - Boleh berlapis lebih dari dua, tapi jangan terlalu dalam. Nanti susah dibaca

      Percabangan berlapis itu seperti permainan petak umpet bertingkat.
      Kamu baru bisa ke lantai dua kalau lantai satu sudah dilewati.
      Coba ubah nilai di contoh dan lihat hasilnya!
    contoh:
      - kode: |
          undangan = True
          kado = True
          if undangan:
              if kado:
                  print('Silakan masuk!')
              else:
                  print('Kado dulu, ya!')
          else:
              print('Belum diundang')
        penjelasan: "undangan benar, lalu kado diperiksa. Kado juga benar, jadi 'Silakan masuk!'."
      - kode: |
          nilai = 90
          if nilai >= 75:
              if nilai >= 90:
                  print('Hebat!')
              else:
                  print('Bagus!')
          else:
              print('Ayo belajar lagi')
        penjelasan: "Nilai 90 lolos syarat luar (>= 75), lalu diperiksa lagi. 90 >= 90, jadi 'Hebat!'."
    kuis:
      - soal: "Kode ini mencetak apa?\n\nx = 5\nif x > 3:\n    if x > 8:\n        print('A')\n    else:\n        print('B')"
        pilihan:
          - "A"
          - "B"
          - "A dan B"
          - "error"
        jawaban: 1
        penjelasan: "5 > 3 benar, lanjut ke if dalam. 5 > 8 salah, jadi else dalam yang jalan: B."
      - soal: "Kapan if bagian dalam diperiksa?"
        pilihan:
          - "selalu diperiksa"
          - "hanya kalau if bagian luar benar"
          - "hanya kalau if bagian luar salah"
          - "tidak pernah"
        jawaban: 1
        penjelasan: "If dalam hanya jalan kalau if luar benar. Kalau luar salah, langsung dilewati."
      - soal: "Kode ini mencetak apa?\n\nhujan = True\npayung = False\nif hujan:\n    if payung:\n        print('Boleh keluar')\n    else:\n        print('Pinjam payung dulu')\nelse:\n    print('Boleh keluar')"
        pilihan:
          - "Boleh keluar"
          - "Pinjam payung dulu"
          - "Boleh keluar dua kali"
          - "error"
        jawaban: 1
        penjelasan: "hujan benar, lanjut ke if dalam. payung salah, jadi else dalam yang jalan."


soal:
  - id: "s4-1"
    judul: "Permen Genap Ganjil"
    sulit: "mudah"
    cerita: |
      Bibi memberi Kancil sekantong permen. Kancil ingin membagi
      permennya jadi dua kelompok sama rata. Dia tidak tahu jumlahnya
      genap atau ganjil. Kalau jumlah permen habis dibagi dua, cetak
      'Genap'. Kalau bersisa satu, cetak 'Ganjil'. Bantuin Kancil: baca
      jumlah permen, periksa sisanya dengan operator %, lalu cetak
      jawabannya.
    input: "Satu baris: jumlah permen (int)."
    output: "Satu baris: Genap atau Ganjil."
    contoh:
      - input: "8"
        output: "Genap"
      - input: "7"
        output: "Ganjil"
    tes:
      - input: "8"
        output: "Genap"
      - input: "7"
        output: "Ganjil"
      - input: "0"
        output: "Genap"
      - input: "100"
        output: "Genap"
      - input: "33"
        output: "Ganjil"
    solusi: |
      n = int(input())
      if n % 2 == 0:
          print('Genap')
      else:
          print('Ganjil')
    petunjuk:
      - "Baca n dengan int(input())."
      - "n % 2 memberi sisa bagi 2. Kalau sisanya 0 berarti habis dibagi dua."
      - "Cetak 'Genap' kalau n % 2 == 0. Selain itu cetak 'Ganjil'."

  - id: "s4-2"
    judul: "Nilai Raport"
    sulit: "sedang"
    cerita: |
      Akhir semester tiba! Bu Guru membagikan raport dan mengubah nilai
      menjadi huruf. Nilai 85 ke atas mendapat A. Nilai 70 sampai 84
      mendapat B. Nilai 60 sampai 69 mendapat C. Nilai di bawah 60
      mendapat D. Kancil mengetik nilainya di komputer, lalu program
      mencetak huruf yang dia dapat. Bantuin Kancil: baca satu nilai,
      periksa dengan if dan elif dari atas ke bawah, lalu cetak
      hurufnya.
    input: "Satu baris: nilai (int)."
    output: "Satu baris: A, B, C, atau D."
    contoh:
      - input: "90"
        output: "A"
      - input: "75"
        output: "B"
    tes:
      - input: "90"
        output: "A"
      - input: "75"
        output: "B"
      - input: "60"
        output: "C"
      - input: "59"
        output: "D"
      - input: "85"
        output: "A"
      - input: "69"
        output: "C"
    solusi: |
      n = int(input())
      if n >= 85:
          print('A')
      elif n >= 70:
          print('B')
      elif n >= 60:
          print('C')
      else:
          print('D')
    petunjuk:
      - "Baca nilai dengan int(input()) dan simpan di variabel n."
      - "Periksa dari atas: n >= 85 dapat A. Lalu n >= 70 dapat B. Lalu n >= 60 dapat C."
      - "Semua yang tersisa (di bawah 60) masuk ke else dan dapat D."

  - id: "s4-3"
    judul: "Tahun Kabisat"
    sulit: "sulit"
    cerita: |
      Kancil membantu Bu Guru menyusun kalender sekolah untuk tahun
      depan. Bu Guru ingin tahu tahun mana yang kabisat. Aturannya:
      tahun habis dibagi 4 adalah kabisat. Kecuali kalau habis dibagi
      100. Tapi kalau habis dibagi 400, tetap kabisat. Contoh: 2024
      kabisat, 1900 bukan, 2000 kabisat. Baca satu tahun, lalu cetak
      'Kabisat' atau 'Bukan kabisat'. Gunakan operator % bersama and
      dan or!
    input: "Satu baris: tahun (int)."
    output: "Satu baris: Kabisat atau Bukan kabisat."
    contoh:
      - input: "2024"
        output: "Kabisat"
      - input: "1900"
        output: "Bukan kabisat"
    tes:
      - input: "2024"
        output: "Kabisat"
      - input: "1900"
        output: "Bukan kabisat"
      - input: "2000"
        output: "Kabisat"
      - input: "2021"
        output: "Bukan kabisat"
      - input: "1600"
        output: "Kabisat"
      - input: "2100"
        output: "Bukan kabisat"
    solusi: |
      t = int(input())
      if (t % 4 == 0 and t % 100 != 0) or t % 400 == 0:
          print('Kabisat')
      else:
          print('Bukan kabisat')
    petunjuk:
      - "Habis dibagi 4 artinya t % 4 == 0."
      - "Gabungkan syaratnya: (habis dibagi 4 DAN tidak habis dibagi 100) ATAU habis dibagi 400."
      - "Cetak 'Kabisat' kalau syarat gabungan benar. Selain itu cetak 'Bukan kabisat'."

  - id: "s4-4"
    judul: "Suhu Hari Ini"
    sulit: "mudah"
    cerita: |
      Pagi ini Kancil melihat termometer di sekolah.
      Kalau suhunya kurang dari 20 derajat, udara terasa dingin.
      Kalau 20 derajat atau lebih, udara terasa hangat.
      Kancil ingin komputer memutuskan: 'Dingin' atau 'Hangat'.
      Baca satu angka suhu, lalu cetak jawabannya.
    input: "Satu baris: suhu (int)."
    output: "Satu baris: Dingin atau Hangat."
    contoh:
      - input: "15"
        output: "Dingin"
      - input: "25"
        output: "Hangat"
    tes:
      - input: "15"
        output: "Dingin"
      - input: "25"
        output: "Hangat"
      - input: "20"
        output: "Hangat"
      - input: "0"
        output: "Dingin"
      - input: "35"
        output: "Hangat"
    solusi: |
      s = int(input())
      if s < 20:
          print('Dingin')
      else:
          print('Hangat')
    petunjuk:
      - "Baca suhu dengan int(input()) dan simpan di variabel."
      - "Pakai if s < 20 untuk kondisi dingin."
      - "Selain itu (20 ke atas) masuk ke else dan cetak 'Hangat'."

  - id: "s4-5"
    judul: "Wahana Bianglala"
    sulit: "sedang"
    cerita: |
      Di pasar malam ada wahana bianglala raksasa.
      Aturannya: anak boleh naik kalau umurnya 10 tahun atau lebih.
      Tinggi badannya juga harus 130 cm atau lebih.
      Dua syarat itu harus terpenuhi semua.
      Baca umur lalu tinggi, cetak 'Boleh naik' atau 'Belum boleh'.
    input: "Dua baris: umur (int), lalu tinggi badan (int)."
    output: "Satu baris: Boleh naik atau Belum boleh."
    contoh:
      - input: "12\n140"
        output: "Boleh naik"
      - input: "9\n140"
        output: "Belum boleh"
    tes:
      - input: "12\n140"
        output: "Boleh naik"
      - input: "9\n140"
        output: "Belum boleh"
      - input: "10\n130"
        output: "Boleh naik"
      - input: "12\n129"
        output: "Belum boleh"
      - input: "15\n150"
        output: "Boleh naik"
      - input: "10\n129"
        output: "Belum boleh"
