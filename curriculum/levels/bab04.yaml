  - id: "s4-6"
    judul: "Duel Angka"
    sulit: "sedang"
    cerita: |
      Kancil dan Siti main duel angka. Masing-masing memilih satu
      angka. Angka yang lebih besar menang. Kalau sama, hasilnya seri.
      Kancil mengetik angkanya, lalu Siti mengetik angkanya. Komputer
      mencetak pemenangnya: 'A lebih besar', 'B lebih besar', atau
      'Sama besar'. Baca dua angka, bandingkan, lalu cetak hasilnya.
    input: "Dua baris: angka A (int), lalu angka B (int)."
    output: "Satu baris: A lebih besar, B lebih besar, atau Sama besar."
    contoh:
      - input: "7\n3"
        output: "A lebih besar"
      - input: "4\n4"
        output: "Sama besar"
    tes:
      - input: "7\n3"
        output: "A lebih besar"
      - input: "4\n4"
        output: "Sama besar"
      - input: "3\n7"
        output: "B lebih besar"
      - input: "10\n10"
        output: "Sama besar"
      - input: "1\n9"
        output: "B lebih besar"
    solusi: |
      a = int(input())
      b = int(input())
      if a > b:
          print('A lebih besar')
      elif b > a:
          print('B lebih besar')
      else:
          print('Sama besar')
    petunjuk:
      - "Baca dua angka dengan int(input()). Simpan di a dan b."
      - "Bandingkan dengan a > b dan b > a."
      - "Kalau dua-duanya tidak lebih besar, berarti sama. Cetak 'Sama besar'."

  - id: "s4-7"
    judul: "Lampu Ajaib"
    sulit: "sulit"
    cerita: |
      Kancil menemukan lampu ajaib di laboratorium. Lampu menyala
      sesuai bilangan yang dimasukkan. Habis dibagi 3 dan 5? Lampu
      merah menyala. Habis dibagi 3 saja? Lampu hijau. Habis dibagi 5
      saja? Lampu kuning. Tidak habis dibagi keduanya? Lampu mati.
      Contoh: 15 habis dibagi 3 dan 5, jadi merah. Baca satu bilangan,
      lalu cetak warna lampunya.
    input: "Satu baris: bilangan (int)."
    output: "Satu baris: Merah, Hijau, Kuning, atau Mati."
    contoh:
      - input: "15"
        output: "Merah"
      - input: "9"
        output: "Hijau"
    tes:
      - input: "15"
        output: "Merah"
      - input: "9"
        output: "Hijau"
      - input: "10"
        output: "Kuning"
      - input: "7"
        output: "Mati"
      - input: "30"
        output: "Merah"
      - input: "25"
        output: "Kuning"
    solusi: |
      n = int(input())
      if n % 3 == 0 and n % 5 == 0:
          print('Merah')
      elif n % 3 == 0:
          print('Hijau')
      elif n % 5 == 0:
          print('Kuning')
      else:
          print('Mati')
    petunjuk:
      - "Cek dulu syarat paling ketat: habis dibagi 3 DAN 5."
      - "Pakai and: n % 3 == 0 and n % 5 == 0."
      - "Lalu cek habis dibagi 3 saja, habis dibagi 5 saja. Sisanya Mati."
  - id: "s4-8"
    judul: "Pintu Rahasia Game"
    sulit: "sedang"
    cerita: |
      Di game kesukaan Kancil ada pintu rahasia.
      Pintunya terbuka kalau kata sandinya benar.
      Kata sandinya 'kancil123'. Kalau ketikan sama
      dengan kata sandi, cetak 'Pintu terbuka'.
      Kalau tidak sama, cetak 'Kata sandi salah'.
      Baca satu kata sandi, lalu cetak hasilnya.
    input: "Satu baris: kata sandi (tulisan)."
    output: "Satu baris: Pintu terbuka atau Kata sandi salah."
    contoh:
      - input: "kancil123"
        output: "Pintu terbuka"
      - input: "budi99"
        output: "Kata sandi salah"
    tes:
      - input: "kancil123"
        output: "Pintu terbuka"
      - input: "budi99"
        output: "Kata sandi salah"
      - input: "Kancil123"
        output: "Kata sandi salah"
      - input: "kancil12"
        output: "Kata sandi salah"
      - input: "123kancil"
        output: "Kata sandi salah"
    solusi: |
      s = input()
      if s == 'kancil123':
          print('Pintu terbuka')
      else:
          print('Kata sandi salah')
    petunjuk:
      - "Baca kata sandi dengan input(). Simpan di variabel s."
      - "Bandingkan dengan tanda ==: s == 'kancil123'."
      - "Kalau benar cetak 'Pintu terbuka'. Kalau tidak, cetak 'Kata sandi salah'."
  - id: "s4-9"
    judul: "Rencana Hari Libur"
    sulit: "sulit"
    cerita: |
      Kancil membuat program rencana hari libur.
      Program membaca hari lalu cuaca. Kalau hari
      Sabtu atau Minggu dan cuacanya cerah, Kancil
      main di luar. Kalau hari libur tapi hujan,
      dia main di rumah. Kalau hari sekolah, dia
      ke sekolah walau cuaca apa pun. Baca dua
      ketikan, lalu cetak rencananya.
    input: "Dua baris: hari (tulisan), lalu cuaca (tulisan: cerah atau hujan)."
    output: "Satu baris: Main di luar, Main di rumah, atau Ke sekolah."
    contoh:
      - input: "Sabtu\ncerah"
        output: "Main di luar"
      - input: "Sabtu\nhujan"
        output: "Main di rumah"
    tes:
      - input: "Sabtu\ncerah"
        output: "Main di luar"
      - input: "Sabtu\nhujan"
        output: "Main di rumah"
      - input: "Minggu\ncerah"
        output: "Main di luar"
      - input: "Senin\ncerah"
        output: "Ke sekolah"
      - input: "Rabu\nhujan"
        output: "Ke sekolah"
      - input: "Minggu\nhujan"
        output: "Main di rumah"
    solusi: |
      hari = input()
      cuaca = input()
      if (hari == 'Sabtu' or hari == 'Minggu') and cuaca == 'cerah':
          print('Main di luar')
      elif hari == 'Sabtu' or hari == 'Minggu':
          print('Main di rumah')
      else:
          print('Ke sekolah')
    petunjuk:
      - "Gabung syarat hari libur dengan or: hari == 'Sabtu' or hari == 'Minggu'."
      - "Kalau hari libur DAN cuaca cerah, pakai and. Cetak 'Main di luar'."
      - "Hari libur tapi tidak cerah masuk ke elif. Hari lain masuk ke else."
