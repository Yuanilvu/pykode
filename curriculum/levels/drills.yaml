  - id: "d17"
    judul: "Angka Terbesar dari Tiga"
    emoji: "🥇"
    tema: "Logika Kondisi"
    tingkat: 4
    cerita: |
      Kancil, Sari, dan Tono bermain lompat jauh.
      Mereka ingin tahu siapa yang melompat paling jauh.
      Baca tiga angka: jarak Kancil, Sari, lalu Tono.
      Cetak angka terbesarnya.
      Kalau ada yang sama besar, cetak angka itu juga.
    input: "Tiga baris: tiga angka."
    output: "Satu baris: angka terbesar."
    contoh:
      - input: "5\n9\n3"
        output: "9"
      - input: "7\n7\n2"
        output: "7"
    tes:
      - input: "5\n9\n3"
        output: "9"
      - input: "7\n7\n2"
        output: "7"
      - input: "1\n2\n3"
        output: "3"
      - input: "10\n10\n10"
        output: "10"
      - input: "4\n4\n8"
        output: "8"
      - input: "6\n1\n2"
        output: "6"
    solusi: |
      a = int(input())
      b = int(input())
      c = int(input())
      if a >= b and a >= c:
          print(a)
      elif b >= c:
          print(b)
      else:
          print(c)
    penjelasan: |
      Baca tiga angka dengan int(input()) dan simpan di a, b, dan c.
      Sekarang cari yang terbesar.
      Pertama, cek apakah a paling besar: a >= b dan a >= c.
      Kalau benar, a yang terbesar, cetak a.
      Kalau tidak, berarti a bukan yang terbesar.
      Lalu cek apakah b >= c.
      Kalau benar, b yang terbesar, cetak b.
      Kalau tidak, berarti c yang terbesar, cetak c.
      Tanda >= dipakai supaya angka yang sama besar tetap dianggap menang.
      Contoh: a = 5, b = 9, c = 3. a bukan terbesar, lalu b >= c benar, jadi cetak 9.
      Cara ini sederhana dan tidak perlu loop sama sekali!

