# Drill latihan logika — satu file untuk semua bab
# tingkat = bab minimal yang sudah dikuasai anak

drill:
  - id: "d1"
    judul: "Kembalian Kantin"
    emoji: "🏪"
    tema: "Deret Angka"
    tingkat: 2
    cerita: |
      Di kantin sekolah, Kancil jualan es teh.
      Kamu bantu dia menghitung kembalian pembeli!
      Baca harga es teh dan uang yang dibayar.
      Cetak kembaliannya, yaitu uang dikurangi harga.
      Uang dikurangi harga itulah kembaliannya.
    input: "Dua baris: harga, lalu uang yang dibayar."
    output: "Satu baris: Kembalian: <hasil pengurangan>."
    contoh:
      - input: "5000\n10000"
        output: "Kembalian: 5000"
      - input: "2500\n5000"
        output: "Kembalian: 2500"
    tes:
      - input: "5000\n10000"
        output: "Kembalian: 5000"
      - input: "2500\n5000"
        output: "Kembalian: 2500"
      - input: "1000\n1000"
        output: "Kembalian: 0"
      - input: "7500\n10000"
        output: "Kembalian: 2500"
      - input: "3000\n2000"
        output: "Kembalian: -1000"
      - input: "8000\n10000"
        output: "Kembalian: 2000"
    solusi: |
      harga = int(input())
      uang = int(input())
      print('Kembalian:', uang - harga)
    penjelasan: |
      Pertama, baca harga jajan dengan int(input()) dan simpan ke variabel harga.
      Kedua, baca uang yang dibayar dan simpan ke variabel uang.
      Ingat, input() selalu mengembalikan teks, jadi kita bungkus dengan int() supaya bisa dihitung.
      Ketiga, hitung kembalian dengan mengurangi: uang - harga.
      Terakhir, cetak hasilnya dengan print('Kembalian:', ...).
      Tanda koma di print otomatis memberi spasi antara teks dan angka.
      Contoh: harga 5000 dan uang 10000, maka 10000 - 5000 = 5000, dan program mencetak "Kembalian: 5000".
      Kalau uangnya kurang, hasilnya angka negatif — itu wajar, artinya pembeli masih kurang bayar!

  - id: "d2"
    judul: "Kartu Nama"
    emoji: "🪪"
    tema: "String"
    tingkat: 3
    cerita: |
      OSIS membuat kartu nama untuk semua anggota baru.
      Setiap kartu harus bertuliskan nama dan kelas.
      Bantu Kancil mencetak kartu nama dengan f-string!
      Baca nama dulu, lalu kelas.
      Hasilnya harus persis seperti contoh.
    input: "Dua baris: nama, lalu kelas."
    output: "Satu baris: Halo, <nama>! Kamu di kelas <kelas>."
    contoh:
      - input: "Budi\n7A"
        output: "Halo, Budi! Kamu di kelas 7A."
      - input: "Sari\n8B"
        output: "Halo, Sari! Kamu di kelas 8B."
    tes:
      - input: "Budi\n7A"
        output: "Halo, Budi! Kamu di kelas 7A."
      - input: "Sari\n8B"
        output: "Halo, Sari! Kamu di kelas 8B."
      - input: "Kancil\n9C"
        output: "Halo, Kancil! Kamu di kelas 9C."
      - input: "Umi\n7A"
        output: "Halo, Umi! Kamu di kelas 7A."
      - input: "Tono\n8A"
        output: "Halo, Tono! Kamu di kelas 8A."
      - input: "Rina\n9A"
        output: "Halo, Rina! Kamu di kelas 9A."
    solusi: |
      nama = input()
      kelas = input()
      print(f'Halo, {nama}! Kamu di kelas {kelas}.')
    penjelasan: |
      Baca nama dengan input() dan simpan ke variabel nama, lalu baca kelas ke variabel kelas.
      Kedua input ini memang harus teks karena akan digabung ke kalimat.
      Untuk menyusun kalimat dengan variabel di tengahnya, pakai f-string: tulis huruf f sebelum tanda kutip, lalu tempatkan variabel di dalam kurung kurawal {nama} dan {kelas}.
      Python akan mengganti {nama} dengan isi variabel nama, dan {kelas} dengan isi variabel kelas.
      Perhatikan tanda seru dan titik di akhir kalimat — hasilnya harus persis sama dengan contoh.
      Coba ganti nama dan kelasnya dengan datamu sendiri, lalu jalankan lagi!

  - id: "d3"
    judul: "Predikat Raport"
    emoji: "📊"
    tema: "Logika Kondisi"
    tingkat: 4
    cerita: |
      Nilai raport sudah keluar!
      Aturannya: nilai 85 ke atas dapat A, 70 ke atas dapat B, 55 ke atas dapat C, sisanya D.
      Bantu Kancil membuat program penentu predikat.
      Satu nilai hanya mendapat satu predikat.
    input: "Satu baris: nilai (angka)."
    output: "Satu baris: predikat A, B, C, atau D."
    contoh:
      - input: "90"
        output: "A"
      - input: "69"
        output: "C"
    tes:
      - input: "90"
        output: "A"
      - input: "69"
        output: "C"
      - input: "85"
        output: "A"
      - input: "74"
        output: "B"
      - input: "55"
        output: "C"
      - input: "40"
        output: "D"
    solusi: |
      nilai = int(input())
      if nilai >= 85:
          print('A')
      elif nilai >= 70:
          print('B')
      elif nilai >= 55:
          print('C')
      else:
          print('D')
    penjelasan: |
      Baca nilai dengan int(input()) supaya berbentuk angka, lalu simpan ke variabel nilai.
      Sekarang periksa dari predikat tertinggi: kalau nilai 85 atau lebih, cetak 'A' — selesai, pemeriksaan berhenti.
      Kalau tidak, cek elif berikutnya: nilai 70 atau lebih dapat 'B'.
      Kalau masih tidak memenuhi, cek apakah nilai 55 atau lebih — dapat 'C'.
      Terakhir, kalau semua syarat gagal, else mencetak 'D'.
      Urutan ini penting: kalau kita cek 'B' dulu, nilai 90 juga memenuhi dan salah dapat 'B'.
      Makanya cek dari yang paling tinggi dulu.
      Nilai 85 masuk A karena >= 85, sedangkan 84 jatuh ke B.

  - id: "d4"
    judul: "Tabel Perkalian"
    emoji: "✖️"
    tema: "Perulangan"
    tingkat: 5
    cerita: |
      Bu Guru menyuruh kelas menghafal tabel perkalian.
      Kancil malas menulisnya manual — dia minta Python membuatkannya!
      Baca satu angka, lalu cetak tabel perkaliannya dari 1 sampai 10.
      Cetak urut dari 1 sampai 10.
    input: "Satu baris: angka n."
    output: "10 baris: n x 1 = ... sampai n x 10 = ..."
    contoh:
      - input: "5"
        output: "5 x 1 = 5\n5 x 2 = 10\n5 x 3 = 15\n5 x 4 = 20\n5 x 5 = 25\n5 x 6 = 30\n5 x 7 = 35\n5 x 8 = 40\n5 x 9 = 45\n5 x 10 = 50"
      - input: "3"
        output: "3 x 1 = 3\n3 x 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n3 x 5 = 15\n3 x 6 = 18\n3 x 7 = 21\n3 x 8 = 24\n3 x 9 = 27\n3 x 10 = 30"
    tes:
      - input: "5"
        output: "5 x 1 = 5\n5 x 2 = 10\n5 x 3 = 15\n5 x 4 = 20\n5 x 5 = 25\n5 x 6 = 30\n5 x 7 = 35\n5 x 8 = 40\n5 x 9 = 45\n5 x 10 = 50"
      - input: "3"
        output: "3 x 1 = 3\n3 x 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n3 x 5 = 15\n3 x 6 = 18\n3 x 7 = 21\n3 x 8 = 24\n3 x 9 = 27\n3 x 10 = 30"
      - input: "7"
        output: "7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21\n7 x 4 = 28\n7 x 5 = 35\n7 x 6 = 42\n7 x 7 = 49\n7 x 8 = 56\n7 x 9 = 63\n7 x 10 = 70"
      - input: "2"
        output: "2 x 1 = 2\n2 x 2 = 4\n2 x 3 = 6\n2 x 4 = 8\n2 x 5 = 10\n2 x 6 = 12\n2 x 7 = 14\n2 x 8 = 16\n2 x 9 = 18\n2 x 10 = 20"
      - input: "1"
        output: "1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n1 x 4 = 4\n1 x 5 = 5\n1 x 6 = 6\n1 x 7 = 7\n1 x 8 = 8\n1 x 9 = 9\n1 x 10 = 10"
      - input: "9"
        output: "9 x 1 = 9\n9 x 2 = 18\n9 x 3 = 27\n9 x 4 = 36\n9 x 5 = 45\n9 x 6 = 54\n9 x 7 = 63\n9 x 8 = 72\n9 x 9 = 81\n9 x 10 = 90"
    solusi: |
      n = int(input())
      for i in range(1, 11):
          print(f'{n} x {i} = {n * i}')
    penjelasan: |
      Baca angka n dengan int(input()).
      Kita mau mencetak 10 baris, jadi pakai for dengan range(1, 11) — range ini menghasilkan 1 sampai 10.
      Setiap putaran, variabel i berisi pengali: 1, 2, 3, sampai 10.
      Di dalam loop, cetak satu baris tabel memakai f-string: f'{n} x {i} = {n * i}'.
      Python mengganti {n} dengan angka yang dibaca, {i} dengan pengali, dan {n * i} dengan hasil kalinya.
      Perhatikan formatnya persis: spasi di sekitar tanda x dan sama dengan.
      Kalau n = 5, baris pertama menjadi "5 x 1 = 5", baris kedua "5 x 2 = 10", dan seterusnya sampai "5 x 10 = 50".

  - id: "d5"
    judul: "Tangga Bintang"
    emoji: "⭐"
    tema: "Pola Bintang"
    tingkat: 5
    cerita: |
      Kancil menemukan tangga ajaib di taman bermain.
      Setiap anak tangganya terbuat dari bintang!
      Bantu dia menggambar tangga bintang: baris 1 satu bintang, baris 2 dua bintang, sampai n baris.
      Baris terakhir berisi n bintang.
    input: "Satu baris: angka n."
    output: "n baris: baris ke-i berisi i bintang."
    contoh:
      - input: "3"
        output: "*\n**\n***"
      - input: "1"
        output: "*"
    tes:
      - input: "3"
        output: "*\n**\n***"
      - input: "1"
        output: "*"
      - input: "5"
        output: "*\n**\n***\n****\n*****"
      - input: "2"
        output: "*\n**"
      - input: "4"
        output: "*\n**\n***\n****"
      - input: "6"
        output: "*\n**\n***\n****\n*****\n******"
    solusi: |
      n = int(input())
      for i in range(1, n + 1):
          print('*' * i)
    penjelasan: |
      Baca n dengan int(input()).
      Kita mau mencetak n baris, dan baris ke-i harus berisi i bintang.
      Pakai for dengan range(1, n + 1) supaya i berjalan dari 1 sampai n.
      Di dalam loop, print('*' * i).
      Tanda kali di sini bukan menghitung angka, melainkan mengulang string: '*' * 1 menghasilkan satu bintang, '*' * 2 menghasilkan dua bintang, dan seterusnya.
      Jadi saat i = 1 tercetak "*", saat i = 2 tercetak "**", sampai baris terakhir berisi n bintang.
      print() otomatis pindah ke baris baru setiap kali dipanggil, jadi setiap i menghasilkan satu baris tersendiri.
      Untuk n = 3 hasilnya: *, **, ***.

  - id: "d6"
    judul: "Angka Terbesar"
    emoji: "🔢"
    tema: "List"
    tingkat: 6
    cerita: |
      Kancil mengumpulkan skor teman-temannya di lomba lari.
      Dia ingin tahu siapa yang mencetak skor terbesar.
      Baca jumlah skor n, lalu n skor.
      Simpan semuanya di list, lalu cari angka terbesarnya.
    input: "Baris pertama: n. Lalu n baris berisi skor."
    output: "Satu baris: Angka terbesar: <skor>."
    contoh:
      - input: "3\n5\n9\n2"
        output: "Angka terbesar: 9"
      - input: "1\n7"
        output: "Angka terbesar: 7"
    tes:
      - input: "3\n5\n9\n2"
        output: "Angka terbesar: 9"
      - input: "1\n7"
        output: "Angka terbesar: 7"
      - input: "4\n10\n10\n3\n8"
        output: "Angka terbesar: 10"
      - input: "5\n1\n2\n3\n4\n5"
        output: "Angka terbesar: 5"
      - input: "2\n100\n99"
        output: "Angka terbesar: 100"
      - input: "4\n8\n8\n8\n8"
        output: "Angka terbesar: 8"
    solusi: |
      n = int(input())
      angka = []
      for i in range(n):
          angka.append(int(input()))
      terbesar = angka[0]
      for a in angka:
          if a > terbesar:
              terbesar = a
      print('Angka terbesar:', terbesar)
    penjelasan: |
      Baca n, lalu buat list kosong bernama angka.
      Ulangi n kali: setiap putaran baca satu skor dengan int(input()) dan tambahkan ke list memakai angka.append(...).
      Setelah semua skor masuk list, kita cari yang terbesar dengan cara manual: ambil angka pertama (angka[0]) sebagai juara sementara di variabel terbesar.
      Lalu loop seluruh list: kalau ada anggota a yang lebih besar dari terbesar, ganti terbesar dengan a.
      Karena kita memakai perbandingan >, angka yang sama besarnya tidak menggantikan juara — itu tidak masalah karena hasilnya tetap sama.
      Terakhir cetak dengan print('Angka terbesar:', terbesar).

  - id: "d7"
    judul: "Penghitung Huruf"
    emoji: "🔤"
    tema: "Kombinasi"
    tingkat: 7
    cerita: |
      Kancil iseng menghitung berapa kali tiap huruf muncul di sebuah kata.
      Ternyata seru!
      Bantu dia: baca satu kata, lalu cetak tiap huruf beserta jumlah kemunculannya.
      Contohnya, kata "banana" punya huruf b 1 kali, a 3 kali, dan n 2 kali.
    input: "Satu baris: kata."
    output: "Beberapa baris: <huruf>:<jumlah>, urut sesuai kemunculan pertama."
    contoh:
      - input: "banana"
        output: "b:1\na:3\nn:2"
      - input: "hello"
        output: "h:1\ne:1\nl:2\no:1"
    tes:
      - input: "banana"
        output: "b:1\na:3\nn:2"
      - input: "hello"
        output: "h:1\ne:1\nl:2\no:1"
      - input: "aaaa"
        output: "a:4"
      - input: "abc"
        output: "a:1\nb:1\nc:1"
      - input: "kancil"
        output: "k:1\na:1\nn:1\nc:1\ni:1\nl:1"
      - input: "mama"
        output: "m:2\na:2"
    solusi: |
      kata = input()
      hitung = {}
      for h in kata:
          if h in hitung:
              hitung[h] += 1
          else:
              hitung[h] = 1
      for h in hitung:
          print(h + ':' + str(hitung[h]))
    penjelasan: |
      Baca kata, lalu buat dictionary kosong bernama hitung.
      Dictionary dipakai untuk menyimpan pasangan huruf dan jumlahnya.
      Loop setiap huruf h di dalam kata: kalau h sudah pernah masuk dictionary (h in hitung), tambah jumlahnya dengan hitung[h] += 1.
      Kalau belum ada, buat entri baru dengan hitung[h] = 1.
      Dengan cara ini setiap huruf dihitung tepat sekali.
      Setelah selesai, loop dictionary untuk mencetak hasil.
      Ingat, dictionary di Python menjaga urutan kemunculan pertama, jadi "banana" mencetak b dulu, lalu a, lalu n.
      Jumlahnya harus diubah jadi teks dulu dengan str() sebelum digabung pakai tanda +.

  - id: "d8"
    judul: "Cek Palindrom"
    emoji: "🪞"
    tema: "String"
    tingkat: 8
    cerita: |
      Kancil belajar kata yang bisa dibaca dari depan maupun belakang, seperti "katak" dan "malam" — namanya palindrom!
      Buatlah fungsi cek_palindrom(kata) untuk memeriksa sebuah kata.
      Baca satu kata, lalu cetak hasilnya.
    input: "Satu baris: kata."
    output: "Satu baris: Palindrom atau Bukan palindrom."
    contoh:
      - input: "katak"
        output: "Palindrom"
      - input: "buku"
        output: "Bukan palindrom"
    tes:
      - input: "katak"
        output: "Palindrom"
      - input: "buku"
        output: "Bukan palindrom"
      - input: "malam"
        output: "Palindrom"
      - input: "a"
        output: "Palindrom"
      - input: "python"
        output: "Bukan palindrom"
      - input: "radar"
        output: "Palindrom"
    solusi: |
      def cek_palindrom(kata):
          return kata == kata[::-1]

      kata = input()
      if cek_palindrom(kata):
          print('Palindrom')
      else:
          print('Bukan palindrom')
    penjelasan: |
      Pertama, buat fungsi cek_palindrom yang menerima satu parameter kata.
      Di dalam fungsi, kita balik katanya memakai slicing kata[::-1] — cara ajaib untuk membalik string.
      Lalu bandingkan: kalau kata sama dengan kebalikannya, kembalikan True; kalau tidak, False.
      Ekspresi kata == kata[::-1] sudah menghasilkan True/False, jadi bisa langsung di-return.
      Setelah fungsi siap, baca input dengan input() dan simpan ke variabel kata.
      Panggil fungsi di dalam if: kalau hasilnya True, cetak 'Palindrom'; kalau False, cetak 'Bukan palindrom'.
      Contoh: "katak" dibalik menjadi "katak" juga, jadi Palindrom.
      Sedangkan "buku" dibalik menjadi "ukub" — tidak sama.

  - id: "d9"
    judul: "Tiga Angka Aman"
    emoji: "🛡️"
    tema: "Deret Angka"
    tingkat: 9
    cerita: |
      Kancil membuat program penjumlah tiga angka, tapi sering ada teman yang iseng mengetik huruf.
      Dengan try/except, program tidak akan mati!
      Baca tiga angka, jumlahkan, dan tangkap kalau ada yang bukan angka.
    input: "Tiga baris angka (bisa ada yang bukan angka)."
    output: "Satu baris: Total: <jumlah> atau Ada angka yang bukan bilangan!."
    contoh:
      - input: "5\n7\n9"
        output: "Total: 21"
      - input: "a\n5\n5"
        output: "Ada angka yang bukan bilangan!"
    tes:
      - input: "5\n7\n9"
        output: "Total: 21"
      - input: "a\n5\n5"
        output: "Ada angka yang bukan bilangan!"
      - input: "10\n20\n30"
        output: "Total: 60"
      - input: "1\nx\n2"
        output: "Ada angka yang bukan bilangan!"
      - input: "100\n-50\n25"
        output: "Total: 75"
      - input: "0\n0\n0"
        output: "Total: 0"
    solusi: |
      total = 0
      for i in range(3):
          try:
              total += int(input())
          except ValueError:
              print('Ada angka yang bukan bilangan!')
              break
      else:
          print('Total:', total)
    penjelasan: |
      Siapkan variabel total mulai dari 0.
      Kita membaca tepat tiga angka, jadi pakai for dengan range(3).
      Di dalam loop, bungkus int(input()) dengan try: kalau inputnya angka, langsung ditambahkan ke total.
      Kalau inputnya bukan angka (misalnya huruf), int() memicu ValueError — dan except ValueError menangkapnya, mencetak 'Ada angka yang bukan bilangan!', lalu break menghentikan loop supaya tidak membaca sisa input.
      Bagian else yang menempel pada for hanya dijalankan kalau loop selesai tanpa break — artinya ketiga angka bagus semua, baru kita cetak 'Total: ...'.
      Jadi kalau ada satu saja data rusak, yang tercetak hanya pesan peringatan.

  - id: "d10"
    judul: "Berlian Bintang"
    emoji: "💎"
    tema: "Pola Bintang"
    tingkat: 10
    cerita: |
      Kancil ingin membuat berlian dari bintang untuk hadiah sahabatnya.
      Berliannya terdiri dari piramida atas dan bawah yang saling menempel!
      Baca angka n dan gambarkan berlian bintangnya.
      Baris paling tengah adalah yang paling lebar.
    input: "Satu baris: angka n."
    output: "Berlian bintang: baris tengah berisi 2*n-1 bintang."
    contoh:
      - input: "3"
        output: "  *\n ***\n*****\n ***\n  *"
      - input: "2"
        output: " *\n***\n *"
    tes:
      - input: "3"
        output: "  *\n ***\n*****\n ***\n  *"
      - input: "2"
        output: " *\n***\n *"
      - input: "1"
        output: "*"
      - input: "4"
        output: "   *\n  ***\n *****\n*******\n *****\n  ***\n   *"
      - input: "5"
        output: "    *\n   ***\n  *****\n *******\n*********\n *******\n  *****\n   ***\n    *"
      - input: "3"
        output: "  *\n ***\n*****\n ***\n  *"
    solusi: |
      n = int(input())
      for i in range(1, n + 1):
          print(' ' * (n - i) + '*' * (2 * i - 1))
      for i in range(n - 1, 0, -1):
          print(' ' * (n - i) + '*' * (2 * i - 1))
    penjelasan: |
      Berlian terdiri dari dua bagian: piramida atas dan piramida bawah (terbalik).
      Bagian atas: loop i dari 1 sampai n.
      Setiap baris mencetak spasi sebanyak n - i (makin ke bawah makin sedikit) lalu bintang sebanyak 2 * i - 1 (bilangan ganjil: 1, 3, 5, ...).
      Untuk n = 3: baris 1 = 2 spasi + 1 bintang, baris 2 = 1 spasi + 3 bintang, baris 3 = 0 spasi + 5 bintang.
      Bagian bawah: loop i mundur dari n - 1 sampai 1 memakai range(n - 1, 0, -1).
      Rumusnya sama, jadi baris-baris bawah adalah cermin bagian atas tanpa baris tengah.
      Gabungan kedua loop menghasilkan bentuk berlian yang simetris.

  - id: "d11"
    judul: "Urutkan Skor"
    emoji: "🏆"
    tema: "Perulangan"
    tingkat: 10
    cerita: |
      Papan peringkat turnamen catur sekolah masih acak!
      Bu Guru minta skor diurutkan dari yang terbesar ke terkecil, tanpa memakai .sort().
      Gunakan bubble sort buatanmu sendiri.
      Baca jumlah skor n, lalu n skor.
    input: "Baris pertama: n. Lalu n baris berisi skor."
    output: "Satu baris: skor urut menurun, dipisah spasi."
    contoh:
      - input: "3\n8\n3\n5"
        output: "8 5 3"
      - input: "4\n10\n2\n7\n1"
        output: "10 7 2 1"
    tes:
      - input: "3\n8\n3\n5"
        output: "8 5 3"
      - input: "4\n10\n2\n7\n1"
        output: "10 7 2 1"
      - input: "2\n5\n5"
        output: "5 5"
      - input: "1\n9"
        output: "9"
      - input: "5\n4\n3\n2\n1\n0"
        output: "4 3 2 1 0"
      - input: "3\n100\n50\n75"
        output: "100 75 50"
    solusi: |
      n = int(input())
      a = []
      for i in range(n):
          a.append(int(input()))
      for i in range(n):
          for j in range(n - 1):
              if a[j] < a[j + 1]:
                  a[j], a[j + 1] = a[j + 1], a[j]
      for x in a:
          print(x, end=' ')
      print()
    penjelasan: |
      Simpan semua skor ke list a dengan loop dan append.
      Sekarang urutkan menurun (terbesar dulu) dengan bubble sort.
      Loop luar berjalan n kali sebagai jumlah pass.
      Di setiap pass, loop dalam membandingkan pasangan bersebelahan a[j] dan a[j + 1].
      Karena kita mau urut menurun, tukar kalau yang kiri LEBIH KECIL dari yang kanan — bedanya dengan urut naik yang menukar kalau kiri lebih besar.
      Setiap pass, angka terkecil "menggelembung" ke belakang.
      Setelah semua pass, list rapi dari besar ke kecil.
      Terakhir cetak semua anggota list dengan end=' ' supaya sebaris dipisah spasi, lalu print() kosong untuk pindah baris.

  - id: "d12"
    judul: "Tabungan Kancil"
    emoji: "🐷"
    tema: "List"
    tingkat: 11
    cerita: |
      Kancil mulai menabung untuk membeli sepeda baru!
      Dia membuat class Tabungan yang bisa menyimpan saldo dan menerima setoran.
      Bantu dia: baca saldo awal dan setoran, lalu cetak saldo setelah menabung.
    input: "Dua baris: saldo awal, lalu setoran."
    output: "Satu baris: Saldo sekarang: <saldo>."
    contoh:
      - input: "10000\n5000"
        output: "Saldo sekarang: 15000"
      - input: "0\n1000"
        output: "Saldo sekarang: 1000"
    tes:
      - input: "10000\n5000"
        output: "Saldo sekarang: 15000"
      - input: "0\n1000"
        output: "Saldo sekarang: 1000"
      - input: "50000\n25000"
        output: "Saldo sekarang: 75000"
      - input: "7500\n7500"
        output: "Saldo sekarang: 15000"
      - input: "100000\n1"
        output: "Saldo sekarang: 100001"
      - input: "2000\n8000"
        output: "Saldo sekarang: 10000"
    solusi: |
      class Tabungan:
          def __init__(self, saldo):
              self.saldo = saldo
          def nabung(self, jumlah):
              self.saldo += jumlah
          def lihat(self):
              return self.saldo

      awal = int(input())
      setoran = int(input())
      t = Tabungan(awal)
      t.nabung(setoran)
      print('Saldo sekarang:', t.lihat())
    penjelasan: |
      Buat class Tabungan dengan __init__ yang menerima saldo awal dan menyimpannya ke attribute self.saldo.
      Method nabung menerima jumlah setoran lalu menambahkannya ke saldo dengan self.saldo += jumlah.
      Method lihat mengembalikan saldo saat ini.
      Di bagian utama program, baca saldo awal dan setoran dengan int(input()).
      Buat object t = Tabungan(awal) — saat ini __init__ otomatis dipanggil dan saldo terisi.
      Panggil t.nabung(setoran) untuk menambah saldo.
      Terakhir cetak t.lihat() untuk menampilkan saldo terbaru.
      Contoh: saldo 10000 + setoran 5000 = 15000.

  - id: "d13"
    judul: "Kuadrat Angka Genap"
    emoji: "⚡"
    tema: "Kombinasi"
    tingkat: 12
    cerita: |
      Kancil menemukan pola ajaib: kuadrat dari bilangan genap!
      Dengan list comprehension, dia bisa membuat daftarnya secepat kilat.
      Baca angka n, lalu cetak kuadrat dari semua bilangan genap antara 2 sampai n.
    input: "Satu baris: angka n."
    output: "Satu baris: kuadrat bilangan genap 2..n, dipisah spasi."
    contoh:
      - input: "10"
        output: "4 16 36 64 100"
      - input: "4"
        output: "4 16"
    tes:
      - input: "10"
        output: "4 16 36 64 100"
      - input: "4"
        output: "4 16"
      - input: "2"
        output: "4"
      - input: "8"
        output: "4 16 36 64"
      - input: "12"
        output: "4 16 36 64 100 144"
      - input: "1"
        output: ""
    solusi: |
      n = int(input())
      kuadrat = [x * x for x in range(2, n + 1, 2)]
      for x in kuadrat:
          print(x, end=' ')
      print()
    penjelasan: |
      Baca n dengan int(input()).
      Kita mau bilangan genap dari 2 sampai n, dan range(2, n + 1, 2) menghasilkan tepat itu — mulai dari 2, naik 2 setiap langkah.
      Gabungkan dengan list comprehension: [x * x for x in range(2, n + 1, 2)] artinya "buat list berisi kuadrat x untuk setiap x genap".
      Jadi untuk n = 10: x = 2, 4, 6, 8, 10, dan kuadratnya 4, 16, 36, 64, 100.
      Kalau n = 1, tidak ada bilangan genap sama sekali, listnya kosong, dan tidak ada yang tercetak.
      Terakhir, loop list dan cetak setiap anggota dengan end=' ' supaya hasilnya satu baris dipisah spasi.

  - id: "d14"
    judul: "Judul Buku"
    emoji: "📚"
    tema: "String"
    tingkat: 12
    cerita: |
      Perpustakaan ingin semua judul buku ditulis dengan rapi: huruf pertama setiap kata jadi besar.
      Ada ratusan buku — mengetik manual jelas tidak mungkin!
      Bantu Kancil merapikan judul dengan metode string ajaib.
    input: "Satu baris: judul buku (huruf kecil)."
    output: "Satu baris: judul dengan huruf pertama tiap kata kapital."
    contoh:
      - input: "aku suka python"
        output: "Aku Suka Python"
      - input: "si kancil dan buaya"
        output: "Si Kancil Dan Buaya"
    tes:
      - input: "aku suka python"
        output: "Aku Suka Python"
      - input: "si kancil dan buaya"
        output: "Si Kancil Dan Buaya"
      - input: "PETUALANGAN DI PULAU"
        output: "Petualangan Di Pulau"
      - input: "buku 1"
        output: "Buku 1"
      - input: "python untuk pemula"
        output: "Python Untuk Pemula"
      - input: "hujan di kota"
        output: "Hujan Di Kota"
    solusi: |
      judul = input()
      print(judul.title())
    penjelasan: |
      Baca judul dengan input() dan simpan ke variabel judul.
      Metode string .title() melakukan semuanya sekaligus: huruf pertama setiap kata diubah menjadi kapital, sedangkan huruf lainnya dibuat kecil.
      Jadi "aku suka python" berubah menjadi "Aku Suka Python".
      Yang menarik, .title() juga merapikan judul yang semua hurufnya kapital: "PETUALANGAN DI PULAU" menjadi "Petualangan Di Pulau" — huruf pertama tiap kata tetap besar, sisanya kecil.
      Angka tidak terpengaruh: "buku 1" menjadi "Buku 1".
      Cukup satu baris kode, ratusan judul buku langsung rapi.
      Bayangkan kalau harus mengetik manual satu per satu!
