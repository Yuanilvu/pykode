    contoh:
      - input: "4"
        output: "Jumlah: 10"
      - input: "3"
        output: "Jumlah: 6"
    tes:
      - input: "4"
        output: "Jumlah: 10"
      - input: "3"
        output: "Jumlah: 6"
      - input: "1"
        output: "Jumlah: 1"
      - input: "10"
        output: "Jumlah: 55"
