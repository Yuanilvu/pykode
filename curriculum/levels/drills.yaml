  - id: "d19"
    judul: "Piramida Bintang"
    emoji: "🔺"
    tema: "Pola Bintang"
    tingkat: 5
    cerita: |
      Kancil membangun piramida dari bintang di pantai.
      Baris paling atas satu bintang.
      Setiap baris ke bawah bertambah dua bintang.
      Baca angka n.
      Cetak piramida dengan n baris.
      Baris paling bawah berisi 2*n - 1 bintang.
    input: "Satu baris: angka n."
    output: "n baris piramida: baris ke-i punya n-i spasi lalu 2*i-1 bintang."
    contoh:
      - input: "3"
        output: "  *\n ***\n*****"
      - input: "2"
        output: " *\n***"
    tes:
      - input: "3"
        output: "  *\n ***\n*****"
      - input: "2"
        output: " *\n***"
      - input: "1"
        output: "*"
      - input: "4"
        output: "   *\n  ***\n *****\n*******"
      - input: "5"
        output: "    *\n   ***\n  *****\n *******\n*********"
    solusi: |
      n = int(input())
      for i in range(1, n + 1):
          print(' ' * (n - i) + '*' * (2 * i - 1))
    penjelasan: |
      Baca n dengan int(input()).
      Piramida punya n baris.
      Untuk baris ke-i, kita butuh dua bagian: spasi di kiri dan bintang.
      Spasi di kiri sebanyak n - i. Makin ke bawah, makin sedikit spasi.
      Bintang sebanyak 2 * i - 1. Angka ini selalu ganjil: 1, 3, 5, dan seterusnya.
      Pakai for dengan range(1, n + 1) supaya i berjalan dari 1 sampai n.
      Cetak dengan print(' ' * (n - i) + '*' * (2 * i - 1)).
      Tanda kali pada teks mengulang teks: ' ' * 2 membuat dua spasi.
      Untuk n = 3: baris 1 = 2 spasi + 1 bintang, baris 2 = 1 spasi + 3 bintang, baris 3 = 0 spasi + 5 bintang.
      Hasilnya piramida yang rapi!

  - id: "d20"
    judul: "Rata-Rata Skor"
    emoji: "📈"
    tema: "List"
    tingkat: 6
    cerita: |
      Kancil mencatat skor kuis semua temannya.
      Dia ingin tahu rata-rata skor kelas.
      Baca banyak skor n, lalu n skor.
      Simpan skor di list.
      Jumlahkan semua, lalu bagi dengan n.
      Cetak 'Rata-rata: <hasil>'.
    input: "Baris 1: n (banyak skor). n baris berikutnya: skor."
    output: "Satu baris: Rata-rata: <total dibagi n>."
    contoh:
      - input: "3\n5\n6\n7"
        output: "Rata-rata: 6.0"
      - input: "2\n10\n4"
        output: "Rata-rata: 7.0"
    tes:
      - input: "3\n5\n6\n7"
        output: "Rata-rata: 6.0"
      - input: "2\n10\n4"
        output: "Rata-rata: 7.0"
      - input: "1\n8"
        output: "Rata-rata: 8.0"
      - input: "4\n2\n4\n6\n8"
        output: "Rata-rata: 5.0"
      - input: "5\n10\n10\n10\n10\n10"
        output: "Rata-rata: 10.0"
      - input: "3\n1\n2\n3"
        output: "Rata-rata: 2.0"
    solusi: |
      n = int(input())
      skor = []
