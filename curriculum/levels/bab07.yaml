    cerita: |
      Kancil membantu Bu Guru merapikan rak buku.
      Bu Guru minta Kancil menghitung buku berdasarkan huruf pertama judulnya.
      Buku 'apel' dan 'anggur' sama-sama huruf a.
      Contoh: apel, anggur, jeruk.
      Hasilnya a: 2 dan j: 1.
      Baca N, lalu N judul buku (satu kata).
      Cetak tiap huruf dan banyaknya.
      Urut sesuai kemunculan pertama.
    input: "Baris 1: N (banyak judul). N baris berikutnya: judul buku (satu kata, huruf kecil)."
    output: "Beberapa baris: <huruf>: <banyak>. Urut sesuai kemunculan pertama."
    contoh:
      - input: "3\napel\nanggur\njeruk"
        output: "a: 2\nj: 1"
      - input: "1\nmangga"
        output: "m: 1"
    tes:
      - input: "3\napel\nanggur\njeruk"
        output: "a: 2\nj: 1"
      - input: "1\nmangga"
        output: "m: 1"
      - input: "4\nbuku\nbuku\nbuku\nbuku"
        output: "b: 4"
      - input: "5\napel\njeruk\nanggur\njambu\napel"
        output: "a: 3\nj: 2"
      - input: "3\nkancil\nbuaya\nrusa"
        output: "k: 1\nb: 1\nr: 1"
      - input: "2\nmeja\nmobil"
        output: "m: 2"
    solusi: |
