bab: 7
judul: "Dictionary & Set"
emoji: "🗂️"
warna: "#8b5cf6"
deskripsi: "Simpan data berpasangan (dict) dan kumpulan unik (set)."

pelajaran:
  - id: "7-1"
    judul: "Dictionary: Kamus Ajaib"
    menit: 7
    materi: |
      List menyimpan data berurutan dengan nomor index.
      Tapi kadang kita tidak mau memanggil data dengan angka.
      Kita mau memanggil dengan NAMA. Di sinilah **dictionary** (dict) bekerja.

      Dict menyimpan pasangan **kunci → nilai** (key → value).
      Bayangkan buku nilai: kuncinya nama siswa, nilainya angka ulangan.
      Ditulis dengan kurung kurawal:

      `nilai = {'Budi': 90, 'Sari': 85}`

      ## Mengambil dan mengubah nilai

      - `nilai['Budi']` → 90. Panggil dengan kunci, bukan index!
      - `nilai['Sari'] = 88` → mengubah nilai Sari jadi 88.
      - `nilai['Rina'] = 92` → kalau Rina belum ada, otomatis
        DITAMBAHKAN sebagai pasangan baru.

      ## Aturan kunci

      - Kunci harus unik. Tidak boleh ada dua 'Budi'.
      - Kunci biasanya teks, tapi bisa juga angka.
      - Kalau kamu memanggil kunci yang tidak ada, Python error
        (KeyError). Hati-hati!

      Dict itu seperti lemari arsip. Setiap map punya label nama.
      Kamu tidak perlu mencari berurutan. Cukup sebut labelnya,
      langsung ketemu. Jauh lebih cepat daripada membongkar semua map
      satu per satu!
    contoh:
      - kode: |
          nilai = {'Budi': 90, 'Sari': 85}
          print(nilai['Budi'])
          nilai['Sari'] = 88
          print(nilai['Sari'])
        penjelasan: "Mencetak 90 lalu 88 — nilai Sari berhasil diubah."
      - kode: |
          nilai = {}
          nilai['Rina'] = 92
          print(nilai)
        penjelasan: "Dict kosong lalu diisi satu pasangan kunci-nilai: {'Rina': 92}."
    kuis:
      - soal: "Untuk mengambil nilai dengan kunci 'Budi' dari dict nilai, kita menulis..."
        pilihan:
          - "nilai[0]"
          - "nilai['Budi']"
          - "nilai.getBudi"
          - "nilai.Budi"
        jawaban: 1
        penjelasan: "Dict dipanggil dengan kunci di dalam kurung siku: nilai['Budi']."
      - soal: "Kalau kita menulis nilai['Tono'] padahal 'Tono' tidak ada di dict, yang terjadi adalah..."
        pilihan:
          - "nilai 0 dikembalikan"
          - "dict bertambah otomatis"
          - "Python error (KeyError)"
          - "nilai None dikembalikan"
        jawaban: 2
        penjelasan: "Memanggil kunci yang tidak ada menyebabkan KeyError."
      - soal: "nilai = {'A': 80}. Lalu nilai['B'] = 90. Berapa len(nilai)?"
        pilihan:
          - "1"
          - "2"
          - "3"
          - "error"
        jawaban: 1
        penjelasan: "Kunci 'B' belum ada, jadi otomatis ditambahkan. Sekarang ada 2 pasangan: A dan B."
      - soal: "d = {} lalu d['a'] = 1 dan d['a'] = 2. Berapa len(d)?"
        pilihan:
          - "1"
          - "2"
          - "3"
          - "error"
        jawaban: 0
        penjelasan: "Mengubah nilai kunci yang sudah ada tidak menambah pasangan baru. Isi d tetap satu: {'a': 2}."


  - id: "7-2"
    judul: "Menjelajah Dictionary"
    menit: 7
    materi: |
      Dict punya banyak cara untuk dilihat isinya. Tiga jurus andalan:

      - `d.keys()` — daftar semua kunci.
      - `d.values()` — daftar semua nilai.
      - `d.items()` — pasangan kunci dan nilai sekaligus.

      ## Cek dengan in

      Mau tahu apakah sebuah kunci ada? Pakai `in`:
      `'Budi' in d` memberi True kalau ada, False kalau tidak.
      Ini cara aman sebelum mengambil nilai.

      ## .get() — pengambil yang ramah

      `d.get(kunci)` hampir sama dengan `d[kunci]`, tapi TIDAK error
      kalau kuncinya tidak ada. Dia mengembalikan None.
      Bahkan bisa dikasih nilai cadangan: `d.get('Tono', 0)`
      mengembalikan 0 kalau 'Tono' tidak ada.

      ## Loop atas dict

      for bisa langsung menjelajah dict:

      ```
      for k in d:
          print(k)
      ```

      Itu mencetak semua KUNCI. Kalau mau kunci DAN nilai sekaligus,
      pakai items():

      ```
      for k, v in d.items():
          print(k, v)
      ```

      Pola `for k, v in d.items()` ini sangat sering dipakai.
      Misalnya untuk mencetak daftar nilai atau mencari nilai terbesar.
      Dengan dict, data "nama → nilai" jadi mudah dijelajahi.
    contoh:
      - kode: |
          nilai = {'Budi': 90, 'Sari': 85, 'Rina': 92}
          print(nilai.keys())
          print('Sari' in nilai)
          print('Tono' in nilai)
        penjelasan: "Mencetak daftar kunci, lalu True, lalu False."
      - kode: |
          nilai = {'Budi': 90, 'Sari': 85}
          for k, v in nilai.items():
              print(k, v)
        penjelasan: "Mencetak 'Budi 90' dan 'Sari 85' — kunci dan nilai bersama-sama."
    kuis:
      - soal: "Untuk mendapat daftar semua kunci sebuah dict d, gunakan..."
        pilihan:
          - "d.values()"
          - "d.keys()"
          - "d.items()"
          - "d.list()"
        jawaban: 1
        penjelasan: "d.keys() mengembalikan semua kunci. d.values() untuk nilai."
      - soal: "d.get('Tono') ketika 'Tono' tidak ada akan mengembalikan..."
        pilihan:
          - "error"
          - "0"
          - "None"
          - "string kosong"
        jawaban: 2
        penjelasan: "get() tidak error. Dia mengembalikan None kalau kunci tidak ada."
      - soal: "d = {'a': 1, 'b': 2}. Lalu for k in d: print(k) mencetak..."
        pilihan:
          - "a, b"
          - "1, 2"
          - "a 1, b 2"
          - "error"
        jawaban: 0
        penjelasan: "for langsung menjelajah KUNCI dict. Jadi yang tercetak a lalu b."
      - soal: "d = {'a': 1, 'b': 2}. Hasil d.get('c', 0) adalah..."
        pilihan:
          - "error"
          - "None"
          - "0"
          - "'c'"
        jawaban: 2
        penjelasan: "Kunci 'c' tidak ada, jadi get memakai nilai cadangan 0."


  - id: "7-3"
    judul: "Set: Koleksi Tanpa Duplikat"
    menit: 7
    materi: |
      Bayangkan kamu mengumpulkan stiker. Kalau sudah punya, stiker
      yang sama tidak perlu disimpan lagi. Di Python, kumpulan tanpa
      duplikat disebut **set**. Ditulis dengan kurung kurawal tanpa
      pasangan kunci: `hobi = {'membaca', 'renang'}`.

      ## Aturan set

      - Semua isi **unik**. Duplikat otomatis dibuang.
      - Tidak ada urutan dan tidak ada index. Kamu tidak bisa
        memanggil `s[0]`.
      - Isinya bisa ditambah dengan `add()`: `hobi.add('ngoding')`.
        Kalau ditambah yang sudah ada, tidak terjadi apa-apa.

      ## Fungsi yang sering dipakai

      - `len(s)` — berapa isi unik.
      - `x in s` — cek apakah x ada di set.

      ## Operasi dasar antar set

      - `s1 | s2` — gabungan (semua yang ada di salah satu set).
      - `s1 & s2` — irisan (yang ada di KEDUA set).

      Set itu seperti daftar hadir. Satu nama hanya boleh muncul sekali.
      Kalau Budi absen dua kali, tetap dihitung satu.
      Itu sebabnya set cocok untuk menghitung "berapa macam"
      atau "berapa orang berbeda".
    contoh:
      - kode: |
          hobi = set()
          hobi.add('membaca')
          hobi.add('membaca')
          hobi.add('renang')
          print(len(hobi))
        penjelasan: "Mencetak 2 — 'membaca' yang dobel hanya dihitung sekali."
      - kode: |
          a = {1, 2, 3}
          b = {2, 3, 4}
          print(a | b)
          print(a & b)
        penjelasan: "Gabungan berisi 1, 2, 3, 4; irisan berisi 2, 3."
    kuis:
      - soal: "Ciri utama set adalah..."
        pilihan:
          - "bisa punya duplikat"
          - "semua isinya unik"
          - "berurutan dan ber-index"
          - "tidak bisa ditambah"
        jawaban: 1
        penjelasan: "Set otomatis membuang duplikat. Jadi semua isinya unik."
      - soal: "s = {1, 2, 2, 3}; len(s) menghasilkan..."
        pilihan:
          - "4"
          - "3"
          - "2"
          - "error"
        jawaban: 1
        penjelasan: "Angka 2 yang dobel dihitung sekali. Isi uniknya 1, 2, 3 = 3 buah."
      - soal: "s = {1, 2, 3}. Lalu s.add(2). Berapa len(s)?"
        pilihan:
          - "2"
          - "3"
          - "4"
          - "error"
        jawaban: 1
        penjelasan: "Angka 2 sudah ada di set. add(2) tidak menambah apa pun. Isinya tetap 3."
      - soal: "a = {1, 2} dan b = {2, 3}. Isi a & b adalah..."
        pilihan:
          - "{1, 2, 3}"
          - "{2}"
          - "{1, 3}"
          - "error"
        jawaban: 1
        penjelasan: "Tanda & mengambil irisan: angka yang ada di kedua set, yaitu 2."


  - id: "7-4"
    judul: "Dict + Set untuk Menghitung"
    menit: 8
    materi: |
      Sekarang saatnya menggabungkan semuanya!
      Pola paling berguna: **menghitung dengan dict**.

      Misalnya menghitung suara ketua kelas. Setiap nama yang muncul,
      tambah satu. Polanya:

      ```
      if nama in hitung:
          hitung[nama] = hitung[nama] + 1
      else:
          hitung[nama] = 1
      ```

      Artinya: "kalau namanya sudah ada, naikkan satu.
      Kalau belum, buat dengan nilai 1".
      Setelah semua data dibaca, `hitung` berisi berapa kali
      setiap nama muncul. Lalu pakai loop `for k, v in hitung.items()`
      untuk mencari siapa yang paling banyak.

      ## Set sebagai penyaring

      Set berguna untuk pertanyaan "berapa yang BERBEDA".
      Masukkan semua ke set, lalu `len(set)` memberi jawabannya.
      Tidak perlu mikir dua kali. Duplikat dibuang otomatis.

      ## Trik gabungan

      - Set → tahu "berapa macam".
      - Dict → tahu "berapa kali masing-masing".

      Kombinasi keduanya menyelesaikan banyak soal.
      Dari absen kelas sampai pemilihan ketua OSIS.
      Latih pola `if kunci in dict` sampai lancar.
      Itu kunci utama soal-soal dict!

      Semakin sering berlatih, semakin cepat kamu tahu kapan
      memakai dict dan kapan memakai set.
    contoh:
      - kode: |
          suara = ['Budi', 'Sari', 'Budi', 'Budi', 'Sari']
          hitung = {}
          for nama in suara:
              if nama in hitung:
                  hitung[nama] = hitung[nama] + 1
              else:
                  hitung[nama] = 1
          print(hitung)
        penjelasan: "Mencetak {'Budi': 3, 'Sari': 2} — setiap nama dihitung berapa kali muncul."
      - kode: |
          nama = ['Budi', 'Sari', 'Budi', 'Rina']
          print(len(set(nama)))
        penjelasan: "Mencetak 3 — hanya nama berbeda yang dihitung: Budi, Sari, Rina."
    kuis:
      - soal: "Pola untuk menambah hitungan nama di dict adalah..."
        pilihan:
          - "hitung[nama] = hitung[nama] + 1 tanpa cek apa pun"
          - "cek dulu dengan in: kalau ada tambah 1, kalau belum mulai dari 1"
          - "hitung.append(nama)"
          - "len(hitung) + 1"
        jawaban: 1
        penjelasan: "Pola aman: cek dulu apakah kunci sudah ada. Baru tambah atau mulai dari 1."
      - soal: "Untuk tahu berapa NAMA BERBEDA dari sebuah list nama, gunakan..."
        pilihan:
          - "len(nama)"
          - "len(set(nama))"
          - "max(nama)"
          - "nama.sort()"
        jawaban: 1
        penjelasan: "Set membuang duplikat. Lalu len menghitung nama yang tersisa."
      - soal: "s = {1, 2, 3}. Berapa len(s | {3, 4})?"
        pilihan:
          - "3"
          - "4"
          - "5"
          - "6"
        jawaban: 1
        penjelasan: "Gabungan berisi 1, 2, 3, 4. Angka 3 yang dobel dihitung sekali, jadi ada 4."


  - id: "7-5"
    judul: "Menghapus dan Menggabung Kamus"
    menit: 6
    materi: |
      Dict tidak hanya bisa diisi. Kamu juga bisa menghapus isinya.
      Menghapus itu penting. Misalnya siswa pindah sekolah, namanya
      harus keluar dari buku nilai.

      ## Menghapus dengan del

      `del nilai['Sari']` menghapus pasangan 'Sari' dari dict.
      Kalau kuncinya tidak ada, Python error (KeyError).
      Jadi cek dulu dengan `in` kalau kamu ragu.

      ## Menghapus dengan pop

      `nilai.pop('Sari')` juga menghapus. Bedanya: pop
      MENGEMBALIKAN nilai yang dihapus. Kamu bisa menyimpannya:
      `v = nilai.pop('Sari')`.

      ## Menggabung dua dict

      Punya dua buku nilai? Gabung dengan `update()`:
      `nilai1.update(nilai2)` menyalin semua isi nilai2 ke nilai1.
      Kalau ada kunci yang sama, isi dari nilai2 yang menang.

      ## Ringkasan

      - `del d[kunci]` — hapus tanpa mengambil nilainya.
      - `d.pop(kunci)` — hapus dan ambil nilainya.
      - `d.update(d2)` — gabung dua dict.

      Dict itu seperti loker pribadi. Kadang kamu harus
      mengeluarkan barang lama atau memindahkan barang
      dari loker lain. Sekarang kamu bisa!
    contoh:
      - kode: |
          nilai = {'Budi': 90, 'Sari': 85, 'Rina': 92}
          del nilai['Sari']
          print(nilai)
        penjelasan: "Pasangan 'Sari' dihapus. Isi dict tinggal Budi dan Rina."
      - kode: |
          nilai = {'Budi': 90, 'Sari': 85}
          nilai.update({'Rina': 92, 'Tono': 88})
          print(nilai)
        penjelasan: "Isi dict kedua disalin ke nilai. Sekarang ada 4 pasangan."
    kuis:
      - soal: "Untuk menghapus kunci 'Sari' dari dict tanpa mengambil nilainya, kita menulis..."
        pilihan:
          - "nilai.pop('Sari')"
          - "del nilai['Sari']"
          - "nilai.remove('Sari')"
          - "nilai['Sari'] = None"
        jawaban: 1
        penjelasan: "del menghapus pasangan dari dict. pop juga menghapus, tapi dia mengembalikan nilainya."
      - soal: "Perbedaan utama pop() dengan del adalah..."
        pilihan:
          - "pop lebih cepat"
          - "pop mengembalikan nilai yang dihapus"
          - "del bisa dipakai di semua tipe"
          - "tidak ada bedanya"
        jawaban: 1
        penjelasan: "pop() menghapus DAN mengembalikan nilainya. del hanya menghapus."
      - soal: "d1 = {'a': 1} dan d2 = {'b': 2}. Setelah d1.update(d2), isi d1 adalah..."
        pilihan:
          - "{'a': 1}"
          - "{'b': 2}"
          - "{'a': 1, 'b': 2}"
          - "error"
        jawaban: 2
        penjelasan: "update() menyalin semua isi d2 ke d1. Jadi d1 berisi a dan b."


soal:
  - id: "s7-1"
    judul: "Absen Ekstrakurikuler"
    sulit: "mudah"
    cerita: |
      Setiap hari Senin, kelas 7A mengadakan ekstrakurikuler.
      Bu Guru mencatat nama siswa yang hadir. Ternyata beberapa nama
      muncul berkali-kali karena absennya diulang.

      Bu Guru penasaran: ada berapa siswa BERBEDA yang hadir?
      Baca N (banyak catatan), lalu N nama. Cetak banyaknya nama berbeda.
    input: "Baris 1: N (banyak catatan). N baris berikutnya: nama siswa."
    output: "Satu angka: banyak nama berbeda."
    contoh:
      - input: "4\nBudi\nSari\nBudi\nRina"
        output: "3"
      - input: "3\nTono\nTono\nTono"
        output: "1"
    tes:
      - input: "4\nBudi\nSari\nBudi\nRina"
        output: "3"
      - input: "3\nTono\nTono\nTono"
        output: "1"
      - input: "1\nAyu"
        output: "1"
      - input: "5\nA\nB\nC\nB\nA"
        output: "3"
      - input: "6\nx\nx\ny\nx\ny\nz"
        output: "3"
    solusi: |
      n = int(input())
      nama = set()
      for i in range(n):
          nama.add(input())
      print(len(nama))
    petunjuk:
      - "Buat set kosong. Tambahkan setiap nama dengan add()."
      - "Duplikat otomatis dibuang oleh set."
      - "Cetak len(set). Itulah banyak nama berbeda."

  - id: "s7-2"
    judul: "Kamus Nilai Ulangan"
    sulit: "sedang"
    cerita: |
      Bu Guru menyimpan nilai ulangan matematika di buku catatan.
      Kamu diminta mencari nilai seorang siswa dengan cepat.

      Baca N (banyak siswa), lalu N baris berisi nama dan nilai
      (dipisah spasi), lalu satu nama yang dicari. Cetak nilai siswa itu.
      Kalau namanya tidak ada di catatan, cetak tulisan: tidak ada
    input: "Baris 1: N. N baris berikutnya: nama dan nilai (dipisah spasi). Baris terakhir: nama yang dicari."
    output: "Satu baris: nilai siswa itu, atau tulisan: tidak ada"
    contoh:
      - input: "3\nBudi 90\nSari 85\nRina 88\nSari"
        output: "85"
      - input: "2\nBudi 90\nSari 85\nTono"
        output: "tidak ada"
    tes:
      - input: "3\nBudi 90\nSari 85\nRina 88\nSari"
        output: "85"
      - input: "2\nBudi 90\nSari 85\nTono"
        output: "tidak ada"
      - input: "1\nAyu 100\nAyu"
        output: "100"
      - input: "4\nA 70\nB 80\nC 90\nD 60\nC"
        output: "90"
      - input: "3\nx 50\ny 60\nz 70\nq"
        output: "tidak ada"
    solusi: |
      n = int(input())
      nilai = {}
      for i in range(n):
          baris = input().split()
          nilai[baris[0]] = int(baris[1])
      tanya = input()
      if tanya in nilai:
          print(nilai[tanya])
      else:
          print('tidak ada')
    petunjuk:
      - "Simpan pasangan nama-nilai ke dict: nilai[nama] = angka."
      - "Pisahkan nama dan nilai dengan split(): baris.split()."
      - "Cek dengan in. Kalau ada, cetak nilainya. Kalau tidak, cetak 'tidak ada'."

  - id: "s7-3"
    judul: "Pemilihan Ketua OSIS"
    sulit: "sulit"
    cerita: |
      Pemilihan ketua OSIS sudah selesai! Setiap suara ditulis sebagai
      satu nama kandidat di secarik kertas. Panitia harus menghitung suara
      dan mengumumkan pemenangnya: kandidat dengan suara terbanyak.

      Kalau ada seri, kandidat yang namanya muncul lebih dulu yang menang.
      Baca N (banyak suara), lalu N nama kandidat. Cetak nama pemenang.
    input: "Baris 1: N (banyak suara). N baris berikutnya: nama kandidat."
    output: "Satu baris: nama pemenang."
    contoh:
      - input: "5\nBudi\nSari\nBudi\nRina\nBudi"
        output: "Budi"
      - input: "4\nSari\nRina\nSari\nRina"
        output: "Sari"
    tes:
      - input: "5\nBudi\nSari\nBudi\nRina\nBudi"
        output: "Budi"
      - input: "4\nSari\nRina\nSari\nRina"
        output: "Sari"
      - input: "1\nTono"
        output: "Tono"
      - input: "6\nA\nB\nB\nC\nC\nC"
        output: "C"
      - input: "3\nx\ny\nz"
        output: "x"
    solusi: |
      n = int(input())
      suara = {}
      for i in range(n):
          nama = input()
          if nama in suara:
              suara[nama] = suara[nama] + 1
          else:
              suara[nama] = 1
      terbanyak = 0
      pemenang = ''
      for k, v in suara.items():
          if v > terbanyak:
              terbanyak = v
              pemenang = k
      print(pemenang)
    petunjuk:
      - "Hitung suara dengan pola: if nama in suara, tambah 1. Kalau belum, mulai dari 1."
      - "Jelajahi suara.items() untuk mencari nilai terbesar."
      - "Simpan pemenang sementara. Ganti hanya kalau ada suara yang lebih banyak."

  - id: "s7-4"
    judul: "Koleksi Stiker"
    sulit: "mudah"
    cerita: |
      Kancil suka mengoleksi stiker.
      Setiap stiker punya nama tokoh.
      Ada stiker yang dobel.
      Kancil ingin tahu stiker tokoh apa saja yang dia punya.
      Baca banyak stiker, lalu nama-nama tokohnya.
      Lalu baca satu nama yang dicari.
      Kalau ada, cetak 'ada'.
      Kalau tidak, cetak 'tidak ada'.
    input: "Baris 1: n (banyak stiker). n baris berikutnya: nama tokoh. Baris terakhir: nama yang dicari."
    output: "Satu baris: ada atau tidak ada"
    contoh:
      - input: "3\nKancil\nBuaya\nRusa\nKancil"
        output: "ada"
      - input: "2\nKancil\nBuaya\nHarimau"
        output: "tidak ada"
    tes:
      - input: "3\nKancil\nBuaya\nRusa\nKancil"
        output: "ada"
      - input: "2\nKancil\nBuaya\nHarimau"
        output: "tidak ada"
      - input: "1\nKancil\nKancil"
        output: "ada"
      - input: "4\nA\nB\nC\nD\nE"
        output: "tidak ada"
      - input: "3\nX\nX\nY\nX"
        output: "ada"
      - input: "2\nMilo\nMimi\nMimi"
        output: "ada"
    solusi: |
      n = int(input())
      stiker = set()
      for i in range(n):
          stiker.add(input())
      tanya = input()
      if tanya in stiker:
          print('ada')
      else:
          print('tidak ada')
    petunjuk:
      - "Buat set kosong. Tambahkan setiap nama tokoh dengan add()."
      - "Duplikat otomatis dibuang oleh set."
      - "Cek dengan in: kalau ada cetak 'ada', kalau tidak cetak 'tidak ada'."

  - id: "s7-5"
    judul: "Jualan Kue Kancil"
    sulit: "sedang"
    cerita: |
      Kancil jualan kue di kantin.
      Dia mencatat siapa saja yang beli.
      Beberapa teman membeli lebih dari sekali.
      Kancil ingin tahu total kue yang dibeli setiap teman.
      Baca banyak catatan, lalu tiap catatan: nama teman dan jumlah kue.
      Cetak nama teman dan jumlah totalnya.
      Satu teman satu baris.
    input: "Baris 1: n (banyak catatan). n baris berikutnya: nama teman dan jumlah kue (dipisah spasi)."
    output: "Beberapa baris: <nama>: <total>, urut sesuai kemunculan pertama."
    contoh:
      - input: "3\nBudi 2\nSari 3\nBudi 1"
        output: "Budi: 3\nSari: 3"
      - input: "2\nRina 5\nRina 2"
        output: "Rina: 7"
    tes:
      - input: "3\nBudi 2\nSari 3\nBudi 1"
        output: "Budi: 3\nSari: 3"
      - input: "2\nRina 5\nRina 2"
        output: "Rina: 7"
      - input: "1\nTono 4"
        output: "Tono: 4"
      - input: "4\nA 1\nB 2\nA 3\nB 4"
        output: "A: 4\nB: 6"
      - input: "3\nX 10\nY 20\nY 5"
        output: "X: 10\nY: 25"
      - input: "2\nKancil 1\nBuaya 1"
        output: "Kancil: 1\nBuaya: 1"
    solusi: |
      n = int(input())
      total = {}
      for i in range(n):
          baris = input().split()
          nama = baris[0]
          jml = int(baris[1])
          if nama in total:
              total[nama] = total[nama] + jml
          else:
              total[nama] = jml
      for k, v in total.items():
          print(k + ':', v)
    petunjuk:
      - "Simpan total per teman di dict: total[nama]."
      - "Kalau nama sudah ada, tambahkan: total[nama] = total[nama] + jml."
      - "Cetak dengan loop for k, v in total.items()."

  - id: "s7-6"
    judul: "Belanja di Toko Kue"
    sulit: "sedang"
    cerita: |
      Kancil berbelanja di toko kue.
      Di papan tulis tertulis daftar harga kue.
      Kancil membeli beberapa kue.
      Ia harus menghitung total uang yang dibayar.
      Kamu akan membaca daftar harga dulu, lalu daftar kue yang dibeli.
      Jumlahkan harga semua kue yang dibeli.

      Baca N, lalu N pasangan nama dan harga.
      Lalu baca M, lalu M nama kue.
      Cetak total harganya.
    input: "Baris 1: N (banyak kue di daftar). N baris berikutnya: nama dan harga (dipisah spasi). Baris berikutnya: M (banyak kue dibeli). M baris berikutnya: nama kue yang dibeli."
    output: "Satu angka: total harga kue yang dibeli."
    contoh:
      - input: "3\nkue 5000\nroti 3000\nsusu 2000\n2\nkue\nsusu"
        output: "7000"
      - input: "2\napel 1000\nmangga 2000\n1\nmangga"
        output: "2000"
    tes:
      - input: "3\nkue 5000\nroti 3000\nsusu 2000\n2\nkue\nsusu"
        output: "7000"
      - input: "2\napel 1000\nmangga 2000\n1\nmangga"
        output: "2000"
      - input: "2\nkopi 4000\nteh 3000\n2\nkopi\nteh"
        output: "7000"
      - input: "3\na 10\nb 20\nc 30\n3\na\nb\nc"
        output: "60"
      - input: "1\nkue 5000\n1\nkue"
        output: "5000"
      - input: "2\nx 100\ny 200\n2\nx\nx"
        output: "200"
    solusi: |
      n = int(input())
      harga = {}
      for i in range(n):
          baris = input().split()
          harga[baris[0]] = int(baris[1])
      m = int(input())
      total = 0
      for i in range(m):
          nama = input()
          total = total + harga[nama]
      print(total)
    petunjuk:
      - "Simpan daftar harga ke dict: harga[nama] = angka."
      - "Baca M, lalu loop sebanyak M kali."
      - "Setiap nama, tambahkan harga[nama] ke total. Cetak total setelah loop."

  - id: "s7-7"
    judul: "Penghitung Kata"
    sulit: "sulit"
    cerita: |
      Kancil suka menulis cerita pendek.
      Bu Guru minta ia menghitung kata di ceritanya.
      Setiap kata yang sama dihitung jadi satu baris saja.
      Kamu akan membaca satu baris berisi beberapa kata.
      Hitung berapa kali tiap kata muncul.
      Cetak tiap kata dan jumlahnya.
      Urutannya sesuai kemunculan pertama.
    input: "Satu baris: beberapa kata dipisah spasi."
    output: "Beberapa baris: <kata>: <jumlah>. Urut sesuai kemunculan pertama."
    contoh:
      - input: "apel jeruk apel"
        output: "apel: 2\njeruk: 1"
      - input: "kancil buaya kancil rusa kancil"
        output: "kancil: 3\nbuaya: 1\nrusa: 1"
    tes:
      - input: "apel jeruk apel"
        output: "apel: 2\njeruk: 1"
      - input: "kancil buaya kancil rusa kancil"
        output: "kancil: 3\nbuaya: 1\nrusa: 1"
      - input: "satu"
        output: "satu: 1"
      - input: "a b c a b a"
        output: "a: 3\nb: 2\nc: 1"
      - input: "x x x x"
        output: "x: 4"
      - input: "meja kursi meja papan kursi meja"
        output: "meja: 3\nkursi: 2\npapan: 1"
    solusi: |
      kata = input().split()
      hitung = {}
      for k in kata:
          if k in hitung:
              hitung[k] = hitung[k] + 1
          else:
              hitung[k] = 1
      for k, v in hitung.items():
          print(k + ':', v)
    petunjuk:
      - "Pecah kalimat dengan split(): kata = input().split()."
      - "Hitung tiap kata dengan pola dict: kalau ada tambah 1, kalau belum mulai dari 1."
      - "Cetak dengan for k, v in hitung.items(): print(k + ':', v)."
  - id: "s7-9"
    judul: "Piket Setiap Hari"
    sulit: "sulit"
    cerita: |
      Kelas 7A mengadakan piket kelas setiap hari.
      Setiap hari, beberapa siswa datang piket.
      Siswa yang rajin piket setiap hari dapat hadiah.
      Kancil ingin tahu siapa saja yang piket setiap hari.
      Dia juga ingin tahu berapa siswa berbeda yang pernah piket.
      Baca banyak hari.
      Untuk tiap hari, baca banyak nama, lalu nama-namanya.
      Cetak banyak siswa yang piket semua hari.
      Lalu cetak banyak siswa berbeda yang pernah piket.
    input: "Baris 1: d (banyak hari). Untuk tiap hari: baris berisi m (banyak nama), lalu m baris nama."
    output: "Baris 1: Semua hari: <banyak siswa piket setiap hari>. Baris 2: Pernah: <banyak siswa berbeda pernah piket>."
    contoh:
      - input: "2\n3\nBudi\nSari\nRina\n2\nSari\nTono"
        output: "Semua hari: 1\nPernah: 4"
      - input: "1\n2\nAyu\nBudi"
        output: "Semua hari: 2\nPernah: 2"
    tes:
      - input: "2\n3\nBudi\nSari\nRina\n2\nSari\nTono"
        output: "Semua hari: 1\nPernah: 4"
      - input: "1\n2\nAyu\nBudi"
        output: "Semua hari: 2\nPernah: 2"
      - input: "2\n2\nA\nB\n2\nC\nD"
        output: "Semua hari: 0\nPernah: 4"
      - input: "3\n1\nA\n1\nA\n1\nA"
        output: "Semua hari: 1\nPernah: 1"
      - input: "2\n3\nX\nX\nY\n2\nY\nZ"
        output: "Semua hari: 1\nPernah: 3"
      - input: "3\n2\nA\nB\n2\nB\nC\n2\nC\nA"
        output: "Semua hari: 0\nPernah: 3"
    solusi: |
      d = int(input())
      semua = None
      pernah = set()
      for i in range(d):
          m = int(input())
          hari = set()
          for j in range(m):
              hari.add(input())
          if semua is None:
              semua = hari
          else:
              semua = semua & hari
          pernah = pernah | hari
      print('Semua hari:', len(semua))
      print('Pernah:', len(pernah))
    petunjuk:
      - "Simpan nama tiap hari di satu set."
      - "Iriskan dengan set hari sebelumnya untuk siswa yang piket semua hari."
      - "Gabungkan semua set untuk siswa yang pernah piket. Cetak len keduanya."

  - id: "s7-8"
    judul: "Dua Kelompok Piket"
    sulit: "sedang"
    cerita: |
      Kelas 7A punya dua kelompok piket.
      Kelompok A piket hari Senin.
      Kelompok B piket hari Selasa.
      Bu Guru ingin tahu siswa yang masuk dua kelompok sekaligus.
      Dia juga ingin tahu banyak siswa berbeda di dua kelompok itu.
      Baca banyak anggota kelompok A, lalu nama-namanya.
      Baca banyak anggota kelompok B, lalu nama-namanya.
      Cetak banyak siswa yang sama, lalu banyak siswa berbeda.
    input: "Baris 1: n (banyak anggota kelompok A). n baris nama. Baris berikutnya: m (banyak anggota kelompok B). m baris nama."
    output: "Baris 1: Sama: <banyak siswa di dua kelompok>. Baris 2: Semua: <banyak siswa berbeda>."
    contoh:
      - input: "3\nBudi\nSari\nRina\n2\nSari\nTono"
        output: "Sama: 1\nSemua: 4"
      - input: "2\nAyu\nBudi\n2\nAyu\nBudi"
        output: "Sama: 2\nSemua: 2"
    tes:
      - input: "3\nBudi\nSari\nRina\n2\nSari\nTono"
        output: "Sama: 1\nSemua: 4"
      - input: "2\nAyu\nBudi\n2\nAyu\nBudi"
        output: "Sama: 2\nSemua: 2"
      - input: "1\nTono\n1\nTono"
        output: "Sama: 1\nSemua: 1"
      - input: "2\nA\nB\n2\nC\nD"
        output: "Sama: 0\nSemua: 4"
      - input: "3\nX\nX\nY\n2\nY\nZ"
        output: "Sama: 1\nSemua: 3"
      - input: "2\nKancil\nBuaya\n3\nRusa\nKancil\nBuaya"
        output: "Sama: 2\nSemua: 3"
    solusi: |
      n = int(input())
      a = set()
      for i in range(n):
          a.add(input())
      m = int(input())
      b = set()
      for i in range(m):
          b.add(input())
      print('Sama:', len(a & b))
      print('Semua:', len(a | b))
    petunjuk:
      - "Simpan nama kelompok A di satu set, kelompok B di set lain."
      - "a & b adalah siswa di kedua kelompok. a | b adalah semua siswa berbeda."
      - "Cetak len(a & b) lalu len(a | b)."


  - id: "s7-10"
    judul: "Kelompok Huruf Awal"
