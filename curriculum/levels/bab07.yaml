  - id: "s7-11"
    judul: "Harga Naik Turun"
    sulit: "sulit"
    cerita: |
      Kancil jualan kue di kantin.
      Hari Senin ia mencatat harga semua kue.
      Hari Selasa harganya berubah.
      Kancil harus membuat daftar perubahan harga.
      Untuk tiap kue di catatan Selasa, cetak nama dan selisihnya.
      Selisihnya: harga Selasa dikurangi harga Senin.
      Kalau kue belum ada di Senin, selisihnya harga Selasa saja.
    input: "Baris 1: N (banyak kue di catatan Senin). N baris berikutnya: nama dan harga Senin (dipisah spasi). Baris berikutnya: M (banyak kue di catatan Selasa). M baris berikutnya: nama dan harga Selasa."
    output: "M baris: <nama>: <selisih harga>. Urut sesuai catatan Selasa."
    contoh:
      - input: "2\nkue 5000\nroti 3000\n2\nkue 6000\nroti 3000"
        output: "kue: 1000\nroti: 0"
      - input: "1\nroti 4000\n1\nroti 2000"
        output: "roti: -2000"
    tes:
      - input: "2\nkue 5000\nroti 3000\n2\nkue 6000\nroti 3000"
        output: "kue: 1000\nroti: 0"
      - input: "1\nkue 5000\n2\nkue 5000\nsusu 2000"
        output: "kue: 0\nsusu: 2000"
      - input: "1\nroti 4000\n1\nroti 2000"
        output: "roti: -2000"
      - input: "3\na 10\nb 20\nc 30\n1\na 10"
        output: "a: 0"
      - input: "1\nx 100\n1\nx 100"
        output: "x: 0"
      - input: "2\nkue 1000\nteh 500\n2\nkue 1500\nte 1000"
        output: "kue: 500\nte: 1000"
    solusi: |
      n = int(input())
      senin = {}
      for i in range(n):
          b = input().split()
          senin[b[0]] = int(b[1])
      m = int(input())
      selasa = {}
      for i in range(m):
          b = input().split()
          selasa[b[0]] = int(b[1])
      for k, v in selasa.items():
          print(k + ':', v - senin.get(k, 0))
    petunjuk:
      - "Simpan harga Senin ke dict: senin[nama] = harga."
      - "Simpan harga Selasa ke dict lain."
      - "Untuk tiap kue di Selasa, cetak selisihnya: harga Selasa dikurangi senin.get(nama, 0)."
