    - id: "m6"
      judul: "Daftar Siswa"
      emoji: "📋"
      bab: 6
      menit: 12
      xp: 100
      cerita: |
        Sekolah makin ramai. Satu kartu tidak cukup.
        Aplikasi harus menyimpan banyak siswa. List bisa menyimpan banyak data.
        Setiap siswa ditambah, masuk ke list. Lalu list ditampilkan dengan nomor urut.
        len() menghitung isi list. Sekarang aplikasimu punya daftar siswa sungguhan.
        Ayo isi daftarnya!

      instruksi: |
        Sekarang aplikasi bisa menyimpan banyak siswa. Pakai list!
        
        1. Buat list kosong di awal program: `daftar = []`
        2. Ganti menu jadi persis ini:
        
        ```
        Menu:
        1. Lihat nama sekolah
        2. Kartu siswa
        3. Tambah siswa
        4. Lihat daftar siswa
        5. Keluar
        ```
        
        3. Tanya pilihan dengan `input('Pilih menu (1-5): ')`.
        4. Pilihan 3 (Tambah siswa): tanya `Nama siswa: ` dan `Kelas: `,
           lalu simpan ke list:
        
        ```python
        daftar.append(f'{nama} ({kelas})')
        ```
        
        5. Pilihan 4 (Lihat daftar siswa): cetak tiap siswa dengan nomor urut,
           lalu cetak jumlah siswa:
        
        ```python
        no = 1
        for siswa in daftar:
            print(f'{no}. {siswa}')
            no = no + 1
        print('Jumlah siswa:', len(daftar))
        ```
        
        Contoh hasilnya:
        
        ```
        1. Budi (5A)
        2. Siti (6B)
        Jumlah siswa: 2
        ```
        
        6. Keluar sekarang pilihan 5: cetak `Sampai jumpa!` lalu `break`.
           Pilihan 1 dan 2 tetap sama seperti misi 5.

      contoh:
