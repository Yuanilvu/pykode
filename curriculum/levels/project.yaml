            Nama sekolahmu: Sekolah: SD Nusantara
            Nama siswa: Kelas: Nama: Budi
            Kelas: 5A

        - input: "SD Harapan Jaya\nSiti\n6B"
          output: |
            === SISTEM INFORMASI SEKOLAH ===
            Nama sekolahmu: Sekolah: SD Harapan Jaya
            Nama siswa: Kelas: Nama: Siti
            Kelas: 6B

      tes:
