        ```
        === SISTEM INFORMASI SEKOLAH ===
        Selamat datang di aplikasi sekolah!

        Menu:
        1. Lihat nama sekolah
        2. Keluar
        ```

        - Pakai satu `print()` untuk tiap baris.
        - Baris kosong di tengah pakai `print()` tanpa isi.
        - Perhatikan tanda sama dengan (===) di baris pertama!
      contoh:
