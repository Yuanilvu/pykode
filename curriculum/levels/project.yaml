        def tambah_siswa():
            nama = input('Nama siswa: ')
            kelas = input('Kelas: ')
            while True:
                nilai = input('Nilai: ')
                try:
                    nilai = int(nilai)
                    break
                except ValueError:
                    print('Nilai harus angka!')
            siswa[nama] = {'kelas': kelas, 'nilai': nilai}


        def lihat_siswa():
            for nama in siswa:
                data = siswa[nama]
                print(f'{nama} - {data["kelas"]} - nilai {data["nilai"]}')


        def hitung_rata(nilai_list):
            total = 0
            for n in nilai_list:
                total = total + n
            return total / len(nilai_list)


        print('=== SISTEM INFORMASI SEKOLAH ===')
        sekolah = input('Nama sekolahmu: ')
        siswa = {'Budi': {'kelas': '5A', 'nilai': 85}}
        while True:
            print('Menu:')
            print('1. Lihat nama sekolah')
            print('2. Kartu siswa')
            print('3. Tambah siswa')
            print('4. Lihat daftar siswa')
            print('5. Detail siswa')
            print('6. Rata-rata nilai')
            print('7. Peringkat nilai')
            print('8. Cari siswa')
            print('9. Keluar')
            pilihan = input('Pilih menu (1-9): ')
            try:
                pilihan = int(pilihan)
            except ValueError:
                print('Pilih angka ya!')
                continue
            if pilihan == 1:
                print('Sekolah:', sekolah)
            elif pilihan == 2:
                nama = input('Nama siswa: ')
                kelas = input('Kelas: ')
                print(f'Nama: {nama}')
                print(f'Kelas: {kelas}')
            elif pilihan == 3:
                tambah_siswa()
            elif pilihan == 4:
                lihat_siswa()
            elif pilihan == 5:
                cari = input('Nama yang dicari: ')
                if cari in siswa:
                    data = siswa[cari]
                    print(f'{cari} - {data["kelas"]} - nilai {data["nilai"]}')
                else:
                    print('Siswa tidak ditemukan.')
            elif pilihan == 6:
                daftar_nilai = []
                for nama in siswa:
                    daftar_nilai.append(siswa[nama]['nilai'])
                rata = hitung_rata(daftar_nilai)
                print(f'Rata-rata nilai: {rata:.1f}')
            elif pilihan == 7:
                urutan = list(siswa.keys())
                n = len(urutan)
                for i in range(n):
                    for j in range(n - 1):
                        if siswa[urutan[j]]['nilai'] < siswa[urutan[j + 1]]['nilai']:
                            urutan[j], urutan[j + 1] = urutan[j + 1], urutan[j]
                no = 1
                for nama in urutan:
                    print(f'{no}. {nama} - {siswa[nama]["nilai"]}')
                    no = no + 1
            elif pilihan == 8:
                cari = input('Nama yang dicari: ')
                ketemu = False
                for nama in siswa:
                    if nama == cari:
                        data = siswa[nama]
                        print(f'{nama} - {data["kelas"]} - nilai {data["nilai"]}')
                        ketemu = True
                if not ketemu:
                    print('Siswa tidak ditemukan.')
            elif pilihan == 9:
                print('Sampai jumpa!')
                break
            else:
                print('Pilihan tidak ada.')
