      solusi: |
        class Siswa:
            def __init__(self, nama, kelas, nilai):
                self.nama = nama
                self.kelas = kelas
                self.nilai = nilai

            def tampilkan(self):
                print(f'Nama: {self.nama}')
                print(f'Kelas: {self.kelas}')
                print(f'Nilai: {self.nilai}')


        def tambah_siswa():
            nama = input('Nama siswa: ')
            kelas = input('Kelas: ')
            while True:
                nilai = input('Nilai: ')
                try:
                    nilai = int(nilai)
                    break
                except ValueError:
                    print('Nilai harus angka!')
            daftar.append(Siswa(nama, kelas, nilai))


        def lihat_siswa():
            for s in daftar:
                print(f'{s.nama} - {s.kelas} - nilai {s.nilai}')


        def hitung_rata(nilai_list):
            total = 0
            for n in nilai_list:
                total = total + n
            return total / len(nilai_list)


        print('=== SISTEM INFORMASI SEKOLAH ===')
        sekolah = input('Nama sekolahmu: ')
        daftar = [Siswa('Budi', '5A', 85)]
        try:
            with open('data_siswa.txt') as f:
                daftar = []
                for baris in f:
                    nama, kelas, nilai = baris.strip().split('|')
                    daftar.append(Siswa(nama, kelas, int(nilai)))
        except FileNotFoundError:
            pass
        while True:
            print('Menu:')
            print('1. Lihat nama sekolah')
            print('2. Kartu siswa')
            print('3. Tambah siswa')
            print('4. Lihat daftar siswa')
            print('5. Detail siswa')
            print('6. Rata-rata nilai')
            print('7. Peringkat nilai')
            print('8. Cari siswa')
            print('9. Simpan data')
            print('10. Muat data')
            print('11. Keluar')
            pilihan = input('Pilih menu (1-11): ')
            try:
                pilihan = int(pilihan)
            except ValueError:
                print('Pilih angka ya!')
                continue
            if pilihan == 1:
                print('Sekolah:', sekolah)
            elif pilihan == 2:
                nama = input('Nama siswa: ')
                kelas = input('Kelas: ')
                print(f'Nama: {nama}')
                print(f'Kelas: {kelas}')
            elif pilihan == 3:
                tambah_siswa()
            elif pilihan == 4:
                laporan = [f'{s.nama} - {s.kelas} - nilai {s.nilai}' for s in daftar]
                for baris in laporan:
                    print(baris)
            elif pilihan == 5:
                cari = input('Nama yang dicari: ')
                ketemu = False
                for s in daftar:
                    if s.nama == cari:
                        s.tampilkan()
                        ketemu = True
                if not ketemu:
                    print('Siswa tidak ditemukan.')
            elif pilihan == 6:
                daftar_nilai = [s.nilai for s in daftar]
                rata = hitung_rata(daftar_nilai)
                print(f'Rata-rata nilai: {rata:.1f}')
            elif pilihan == 7:
                urutan = sorted(daftar, key=lambda s: s.nilai, reverse=True)
                no = 1
                for s in urutan:
                    print(f'{no}. {s.nama} - {s.nilai}')
                    no = no + 1
            elif pilihan == 8:
                cari = input('Nama yang dicari: ')
                ketemu = False
                for s in daftar:
                    if s.nama == cari:
                        s.tampilkan()
                        ketemu = True
                if not ketemu:
                    print('Siswa tidak ditemukan.')
            elif pilihan == 9:
                with open('data_siswa.txt', 'w') as f:
                    for s in daftar:
                        f.write(f'{s.nama}|{s.kelas}|{s.nilai}\n')
                print('Data tersimpan!')
            elif pilihan == 10:
                with open('data_siswa.txt') as f:
                    daftar = []
                    for baris in f:
                        nama, kelas, nilai = baris.strip().split('|')
                        daftar.append(Siswa(nama, kelas, int(nilai)))
                print('Data dimuat!')
            elif pilihan == 11:
                print('Sampai jumpa!')
                break
            else:
                print('Pilihan tidak ada.')
      petunjuk:
        - "open('data_siswa.txt', 'w') untuk menulis. open('data_siswa.txt') untuk membaca."
        - "lambda s: s.nilai artinya ambil nilai dari benda s."
        - "List comprehension ditulis di dalam kurung siku: [x for x in daftar]."
