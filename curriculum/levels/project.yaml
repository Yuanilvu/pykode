        Programmu makin panjang. Banyak kode berulang di dalamnya. Fungsi bisa merapikan program. Fungsi itu kode dengan nama. Kamu panggil namanya, kodenya jalan. Fungsi juga bisa menghitung dan mengembalikan hasil. Sekarang kita bikin fungsi untuk tiap kerjaan. Program jadi rapi dan pendek. Ayo rapikan programmu!
      instruksi: |
        Bikin fungsi untuk tiap kerjaan. Fungsi ditulis dengan `def`.

        1. Tambah fungsi di awal program (sebelum judul):

        ```python
        def tambah_siswa():
            nama = input('Nama siswa: ')
            kelas = input('Kelas: ')
            nilai = input('Nilai: ')
            siswa[nama] = {'kelas': kelas, 'nilai': int(nilai)}

        def lihat_siswa():
            for nama in siswa:
                data = siswa[nama]
                print(f'{nama} - {data["kelas"]} - nilai {data["nilai"]}')

        def hitung_rata(nilai_list):
            total = 0
            for n in nilai_list:
                total = total + n
            return total / len(nilai_list)
        ```

        2. Ganti menu jadi persis ini:

        ```
        Menu:
        1. Lihat nama sekolah
        2. Kartu siswa
        3. Tambah siswa
        4. Lihat daftar siswa
        5. Detail siswa
        6. Rata-rata nilai
        7. Keluar
        ```

        3. Tanya pilihan dengan `input('Pilih menu (1-7): ')`.

        4. Pilihan 3 tinggal panggil `tambah_siswa()`. Pilihan 4 panggil `lihat_siswa()`.

        5. Pilihan 6 (Rata-rata nilai): kumpulkan semua nilai, lalu panggil `hitung_rata`:

        ```python
        daftar_nilai = []
        for nama in siswa:
            daftar_nilai.append(siswa[nama]['nilai'])
        rata = hitung_rata(daftar_nilai)
        print(f'Rata-rata nilai: {rata:.1f}')
