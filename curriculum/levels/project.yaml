            def __init__(self, nama, kelas, nilai):
                self.nama = nama
                self.kelas = kelas
                self.nilai = nilai

            def tampilkan(self):
                print(f'Nama: {self.nama}')
                print(f'Kelas: {self.kelas}')
                print(f'Nilai: {self.nilai}')


        def tambah_siswa():
            nama = input('Nama siswa: ')
