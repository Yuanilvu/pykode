            elif pilihan == 6:
                daftar_nilai = []
                for s in daftar:
                    daftar_nilai.append(s.nilai)
                rata = hitung_rata(daftar_nilai)
                print(f'Rata-rata nilai: {rata:.1f}')
            elif pilihan == 7:
