    - id: "m5"
      judul: "Menu Berulang"
      emoji: "🔁"
      bab: 5
      menit: 12
      xp: 100
      cerita: |
        Menu di misi 4 hanya jalan sekali. Selesai memilih, program berhenti.
        Padahal pengguna mau memilih lagi. Pakai while True.
        while True artinya ulangi terus. break artinya berhenti.
        Pilihan 3 memakai break. Jadi program berhenti kalau kamu memilih Keluar.
        Menu tampil lagi setiap selesai aksi. Ayo coba!

      instruksi: |
        Menu di misi 4 hanya jalan sekali. Sekarang buat menu berulang!
        
        1. Tanya `Nama sekolahmu: ` dulu (di luar perulangan, tetap).
        2. Tulis `while True:` lalu bungkus semua baris menu ke dalamnya.
           Baris di dalamnya menjorok ke dalam.
        3. Pilihan 3 mencetak `Sampai jumpa!` lalu `break`.
        
        ```python
        while True:
            print('Menu:')
            print('1. Lihat nama sekolah')
            print('2. Kartu siswa')
            print('3. Keluar')
            pilihan = input('Pilih menu (1-3): ')
            if pilihan == '1':
                print('Sekolah:', sekolah)
            elif pilihan == '2':
                nama = input('Nama siswa: ')
                kelas = input('Kelas: ')
                print(f'Nama: {nama}')
                print(f'Kelas: {kelas}')
            elif pilihan == '3':
                print('Sampai jumpa!')
                break
            else:
                print('Pilihan tidak ada.')
        ```
        
        `while True` artinya ulangi terus. `break` menghentikan perulangan.
        Teks menu dan prompt tetap sama seperti misi 4.

