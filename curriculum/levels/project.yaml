            Nama sekolahmu: Menu:
            1. Lihat nama sekolah
            2. Kartu siswa
            3. Tambah siswa
            4. Lihat daftar siswa
            5. Keluar
            Pilih menu (1-5): Nama siswa: Kelas: Nama: Siti
            Kelas: 6B
            Menu:
            1. Lihat nama sekolah
            2. Kartu siswa
            3. Tambah siswa
            4. Lihat daftar siswa
            5. Keluar
            Pilih menu (1-5): Sampai jumpa!

      tes:
