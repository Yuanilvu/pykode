      cerita: |
        Menu sudah ada sejak misi 1. Tapi belum bisa dipilih.
        Sekarang menu jadi beneran! Kamu mengetik angka pilihan.
        Program menjalankan pilihanmu. Pakai if, elif, dan else.
        if itu cara program memilih. Kalau angkanya tidak ada di menu,
        program mencetak Pilihan tidak ada. Ayo coba semua pilihannya!

      instruksi: |
        Menu sekarang bisa dipilih! Ubah programmu jadi seperti ini:
        
        1. Cetak judul `=== SISTEM INFORMASI SEKOLAH ===` (tetap).
        2. Tanya `Nama sekolahmu: ` dan simpan di variabel `sekolah` (tetap).
        3. Cetak menu persis ini:
        
        ```
        Menu:
        1. Lihat nama sekolah
        2. Kartu siswa
        3. Keluar
        ```
        
        4. Tanya pilihan dengan `input('Pilih menu (1-3): ')` dan simpan di variabel `pilihan`.
        5. Pakai if, elif, dan else seperti ini:
        
        ```python
        pilihan = input('Pilih menu (1-3): ')
        if pilihan == '1':
            print('Sekolah:', sekolah)
        elif pilihan == '2':
            nama = input('Nama siswa: ')
            kelas = input('Kelas: ')
            print(f'Nama: {nama}')
            print(f'Kelas: {kelas}')
        elif pilihan == '3':
            print('Sampai jumpa!')
        else:
            print('Pilihan tidak ada.')
        ```
        
        Pilihan 1 mencetak nama sekolah. Pilihan 2 mencetak kartu siswa (sama seperti misi 3).
        Pilihan 3 mencetak `Sampai jumpa!`. Angka lain mencetak `Pilihan tidak ada.`

