    - id: "m3"
      judul: "Kartu Siswa"
      emoji: "📇"
      bab: 3
      menit: 10
      xp: 80
      cerita: |
        Kartu siswa itu penting. Semua siswa di sekolah punya kartu.
        Kartu berisi nama dan kelas. Sekarang aplikasimu bisa bikin kartu siswa.
        Kamu mengetik nama dan kelas. Aplikasi mencetak kartunya.
        Kita pakai f-string. f-string itu cara mencetak teks berisi variabel.
        Simbolnya kurung kurawal {}. Ayo bikin kartu pertamamu!

      instruksi: |
        Ubah programmu jadi seperti ini:
        
        1. Cetak judul `=== SISTEM INFORMASI SEKOLAH ===` (tetap).
        2. Tanya `Nama sekolahmu: ` lalu cetak `Sekolah: ` dan isinya (tetap dari misi 2).
        3. Tanya `Nama siswa: ` dengan `input()` dan simpan di variabel `nama`.
        4. Tanya `Kelas: ` dan simpan di variabel `kelas`.
        5. Cetak kartu siswa dengan f-string, persis seperti ini:
        
        ```
        Nama: Budi
        Kelas: 5A
        ```
        
        f-string diawali huruf `f`. Isi variabel ditulis di dalam kurung kurawal `{}`:
        
        ```python
        print(f'Nama: {nama}')
        print(f'Kelas: {kelas}')
        ```
        
        Menu lama belum berfungsi. Nanti di misi berikutnya kita buat menunya jalan!

      contoh:
        - input: "SD Nusantara\nBudi\n5A"
          output: |
