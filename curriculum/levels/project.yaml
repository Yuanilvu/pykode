        dari kamu.

        Kamu mengetik nama sekolahnya, lalu aplikasi menyimpannya
        di variabel dan menyapanya.
      instruksi: |
        Ubah programmu jadi seperti ini:

        1. Cetak judul `=== SISTEM INFORMASI SEKOLAH ===` (tetap).
        2. Tampilkan pertanyaan: `Nama sekolahmu: `
        3. Baca ketikan dengan `input()` dan simpan di variabel `sekolah`.
        4. Cetak: `Sekolah: ` lalu isi variabelnya (contoh: `Sekolah: SD Nusantara`).
        5. Cetak baris kosong, lalu menu seperti misi 1.

        Pertanyaan di langkah 2 memakai `input('Nama sekolahmu: ')` —
        teks di dalam kurung akan tampil dulu, lalu program menunggu ketikanmu.
      contoh:
        - input: "SD Nusantara"
          output: |
            === SISTEM INFORMASI SEKOLAH ===
            Nama sekolahmu: Sekolah: SD Nusantara

            Menu:
            1. Lihat nama sekolah
            2. Keluar
      tes:
        - input: "SD Nusantara"
          output: |
            === SISTEM INFORMASI SEKOLAH ===
            Nama sekolahmu: Sekolah: SD Nusantara

            Menu:
            1. Lihat nama sekolah
            2. Keluar
        - input: "SD Harapan Jaya"
          output: |
            === SISTEM INFORMASI SEKOLAH ===
            Nama sekolahmu: Sekolah: SD Harapan Jaya

            Menu:
            1. Lihat nama sekolah
            2. Keluar
        - input: "SD Ceria"
          output: |
            === SISTEM INFORMASI SEKOLAH ===
            Nama sekolahmu: Sekolah: SD Ceria

            Menu:
            1. Lihat nama sekolah
            2. Keluar
      solusi: |
        print('=== SISTEM INFORMASI SEKOLAH ===')
        sekolah = input('Nama sekolahmu: ')
