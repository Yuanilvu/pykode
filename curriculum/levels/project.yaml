      cerita: |
        Semua siswa punya nilai. Nilai siapa yang paling tinggi? Kamu bisa mengurutkan siswa dari nilai tertinggi. Itu namanya sorting. Sorting itu cara mengurutkan data. Kita pakai bubble sort. Bubble sort membandingkan dua data dan menukarnya. Kamu juga bisa mencari siswa dengan perulangan. Ayo urutkan dan cari siswa!
      instruksi: |
        Tambahkan menu peringkat nilai dan cari siswa.

        1. Ganti menu jadi persis ini:

        ```
        Menu:
        1. Lihat nama sekolah
        2. Kartu siswa
        3. Tambah siswa
        4. Lihat daftar siswa
        5. Detail siswa
        6. Rata-rata nilai
        7. Peringkat nilai
        8. Cari siswa
        9. Keluar
        ```

        2. Tanya pilihan dengan `input('Pilih menu (1-9): ')`.

        3. Pilihan 7 (Peringkat nilai): urutkan dari nilai tertinggi ke terendah. Pakai bubble sort:

        ```python
        urutan = list(siswa.keys())
        n = len(urutan)
        for i in range(n):
            for j in range(n - 1):
                if siswa[urutan[j]]['nilai'] < siswa[urutan[j + 1]]['nilai']:
                    urutan[j], urutan[j + 1] = urutan[j + 1], urutan[j]
        no = 1
        for nama in urutan:
            print(f'{no}. {nama} - {siswa[nama]["nilai"]}')
            no = no + 1
        ```

        Hasilnya:

        ```
        1. Siti - 90
        2. Budi - 85
        ```

