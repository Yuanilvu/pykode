            daftar.append(Siswa(nama, kelas, nilai))


        def lihat_siswa():
            for s in daftar:
                print(f'{s.nama} - {s.kelas} - nilai {s.nilai}')


        def hitung_rata(nilai_list):
            total = 0
            for n in nilai_list:
                total = total + n
            return total / len(nilai_list)


