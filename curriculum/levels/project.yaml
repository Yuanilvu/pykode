            === SISTEM INFORMASI SEKOLAH ===
            Nama sekolahmu: Sekolah: SD Ceria
            Nama siswa: Kelas: Nama: Rina
            Kelas: 7C

        - input: "SD Nusantara\nAndi\n4A"
