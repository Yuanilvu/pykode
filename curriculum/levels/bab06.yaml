bab: 6
judul: "List & Tuple: Kumpulan Data"
emoji: "📦"
warna: "#10b981"
deskripsi: "Simpan banyak nilai: list, tuple, index, slicing, metode list."

pelajaran:
  - id: "6-1"
    judul: "List: Rak Penyimpanan"
    menit: 6
    materi: |
      Bayangkan loker sekolah dengan banyak slot bernomor.
      Slot pertama nomor 0. Slot kedua nomor 1. Begitu seterusnya.
      Di Python, loker seperti itu disebut **list**.
      Ditulis dengan tanda kurung siku `[...]`.

      List bisa menyimpan banyak nilai sekaligus:
      `nilai = [8, 9, 7]`. Untuk mengambil satu nilai, sebut nomor slotnya.
      Nomor slot itu disebut **index**: `nilai[0]` mengambil 8.

      ## Aturan index

      - Index mulai dari **0**, bukan 1! Ini yang paling sering bikin bingung.
      - `nilai[0]` = nilai pertama
      - `nilai[1]` = nilai kedua
      - `nilai[2]` = nilai ketiga

      ## List bisa diubah

      Isi list bisa ditambah, diubah, dan diurutkan.
      Kamu juga bisa membuat list kosong: `kosong = []`.

      List itu seperti tas ransel. Bisa diisi banyak barang.
      Kamu bisa mengambil barang dari slot tertentu tanpa membongkar semuanya.
      Coba perhatikan contoh di bawah. Hitung sendiri indexnya
      sebelum menjalankan!

      List juga bisa berisi campuran: [1, 'dua', 3.5].
      Tapi untuk sekarang, list angka dan list teks saja sudah cukup.
    contoh:
      - kode: |
          nilai = [8, 9, 7]
          print(nilai)
          print(nilai[0])
          print(nilai[2])
        penjelasan: "nilai[0] adalah 8 (elemen pertama), nilai[2] adalah 7 (elemen ketiga)."
      - kode: |
          hobi = ['membaca', 'main game', 'renang']
          print(hobi[1])
        penjelasan: "Mencetak 'main game' — index 1 adalah elemen kedua."
    kuis:
      - soal: "Index elemen PERTAMA sebuah list adalah..."
        pilihan:
          - "1"
          - "0"
          - "-1"
          - "2"
        jawaban: 1
        penjelasan: "Index selalu mulai dari 0. Jadi elemen pertama ada di index 0."
      - soal: "Dari list buah = ['apel', 'mangga', 'jeruk'], buah[2] berisi..."
        pilihan:
          - "apel"
          - "mangga"
          - "jeruk"
          - "error"
        jawaban: 2
        penjelasan: "Index 0 = apel, index 1 = mangga, index 2 = jeruk."
      - soal: "Apa outputnya?\n\nnilai = [4, 8, 2]\nprint(nilai[1])"
        pilihan:
          - "4"
          - "8"
          - "2"
          - "error"
        jawaban: 1
        penjelasan: "Index 1 adalah elemen kedua, yaitu 8."
      - soal: "Apa outputnya?\n\nhobi = ['baca', 'main', 'renang']\nprint(hobi[0])"
        pilihan:
          - "baca"
          - "main"
          - "renang"
          - "error"
        jawaban: 0
        penjelasan: "Index 0 adalah elemen pertama, yaitu 'baca'."

  - id: "6-2"
    judul: "Index Negatif dan Slicing"
    menit: 7
    materi: |
      Kadang kita ingin mengambil isi list dari belakang.
      Python punya trik keren: **index negatif**.
      `angka[-1]` mengambil elemen TERAKHIR.
      `angka[-2]` mengambil satu sebelum terakhir. Begitu seterusnya.
      Tidak perlu menghitung panjang list!

      ## Slicing: potong list

      Mau mengambil beberapa elemen berurutan? Pakai **slicing**: `list[a:b]`.
      Hasilnya elemen dari index a sampai **sebelum** index b.
      Sama seperti range: angka b tidak ikut!

      Contoh, dari `angka = [10, 20, 30, 40, 50]`:

      - `angka[1:3]` → [20, 30] (index 1 sampai sebelum 3)
      - `angka[:2]` → [10, 20] (dari awal sampai sebelum 2)
      - `angka[2:]` → [30, 40, 50] (dari index 2 sampai akhir)

      Slicing itu seperti memotong kue. Kamu tentukan potongan mulai
      dari mana dan berhenti di mana. Potongan selalu berhenti sebelum
      index yang disebut terakhir. Jangan sampai memotong kelebihan!

      Ingat: `[a:b]` artinya "mulai a, berhenti sebelum b".
      Kalau b lebih besar dari panjang list, Python tetap aman.
      Dia hanya memberi sampai akhir.
    contoh:
      - kode: |
          angka = [10, 20, 30, 40, 50]
          print(angka[-1])
          print(angka[-2])
        penjelasan: "Mencetak 50 (terakhir) dan 40 (sebelum terakhir)."
      - kode: |
          angka = [10, 20, 30, 40, 50]
          print(angka[1:4])
          print(angka[:3])
        penjelasan: "angka[1:4] = [20, 30, 40]; angka[:3] = [10, 20, 30]."
    kuis:
      - soal: "Dari list x = [5, 10, 15, 20], x[-1] berisi..."
        pilihan:
          - "5"
          - "10"
          - "20"
          - "15"
        jawaban: 2
        penjelasan: "Index -1 selalu elemen terakhir, yaitu 20."
      - soal: "x[1:3] dari x = [5, 10, 15, 20] menghasilkan..."
        pilihan:
          - "[5, 10]"
          - "[10, 15]"
          - "[10, 15, 20]"
          - "[15, 20]"
        jawaban: 1
        penjelasan: "Mulai index 1 (10), berhenti sebelum index 3. Jadi [10, 15]."
      - soal: "x = [1, 2, 3, 4, 5]. Hasil x[2:] adalah..."
        pilihan:
          - "[1, 2]"
          - "[2, 3, 4, 5]"
          - "[3, 4, 5]"
          - "[3, 4]"
        jawaban: 2
        penjelasan: "x[2:] berarti mulai dari index 2 sampai akhir. Jadi [3, 4, 5]."
      - soal: "x = [1, 2, 3, 4, 5]. Berapa isi x[-2]?"
        pilihan:
          - "4"
          - "5"
          - "2"
          - "error"
        jawaban: 0
        penjelasan: "Index -2 adalah satu sebelum terakhir. Dari belakang: 5, lalu 4."

  - id: "6-3"
    judul: "Metode List: Tumbuhkan dan Urutkan"
    menit: 7
    materi: |
      List punya jurus-jurus sakti yang disebut **metode**.
      Tinggal panggil dengan titik. Jurus yang paling sering dipakai:

      - `append(x)` — menambahkan x ke akhir list. Seperti memasukkan
        barang ke ujung tas.
      - `len(list)` — menghitung berapa isi list.
      - `min(list)` / `max(list)` — nilai terkecil / terbesar.
      - `sum(list)` — jumlah semua isi (kalau isinya angka).
      - `sort()` — mengurutkan dari kecil ke besar.

      ## Pola penting: list dari ketikan

      Kamu sering perlu mengisi list angka dari ketikan user.
      Polanya selalu sama:

      1. buat list kosong
      2. loop sebanyak n kali
      3. di dalam loop, `append` angka yang dibaca

      `len()` berguna untuk tahu berapa banyak data.
      Misalnya untuk menghitung rata-rata: `sum(nilai) / len(nilai)`.

      Metode-metode ini membuatmu tidak perlu menulis ulang logika
      yang sudah ada. Python sudah menyediakannya. Kamu tinggal memanggil,
      seperti menekan tombol di mesin cuci.

      Jangan lupa: sort() mengubah list aslinya langsung.
      Setelah dipanggil, urutannya sudah berubah.
    contoh:
      - kode: |
          nilai = []
          nilai.append(8)
          nilai.append(9)
          nilai.append(7)
          print(len(nilai))
          print(sum(nilai))
        penjelasan: "len(nilai) = 3 (tiga isi), sum(nilai) = 24."
      - kode: |
          angka = [5, 2, 8, 1]
          angka.sort()
          print(angka)
          print(min(angka))
          print(max(angka))
        penjelasan: "Setelah sort, list jadi [1, 2, 5, 8]; min = 1, max = 8."
    kuis:
      - soal: "Metode untuk menambahkan nilai di akhir list adalah..."
        pilihan:
          - "add()"
          - "append()"
          - "insert()"
          - "push()"
        jawaban: 1
        penjelasan: "append(x) menambahkan x ke akhir list."
      - soal: "Fungsi untuk menghitung banyak isi list adalah..."
        pilihan:
          - "size()"
          - "count()"
          - "len()"
          - "length()"
        jawaban: 2
        penjelasan: "len(list) menghitung jumlah isi list."
      - soal: "Apa outputnya?\n\nx = [3, 1, 2]\nx.sort()\nprint(x)"
        pilihan:
          - "[1, 2, 3]"
          - "[3, 1, 2]"
          - "[3, 2, 1]"
          - "error"
        jawaban: 0
        penjelasan: "sort() mengurutkan dari kecil ke besar. Hasilnya [1, 2, 3]."
      - soal: "Apa outputnya?\n\nx = [7, 1, 9]\nx.sort()\nprint(x[0])"
        pilihan:
          - "7"
          - "1"
          - "9"
          - "error"
        jawaban: 1
        penjelasan: "Setelah sort, x = [1, 7, 9]. x[0] adalah 1."
      - soal: "Apa outputnya?\n\nx = [4, 9, 2]\nx.append(7)\nprint(len(x))"
        pilihan:
          - "3"
          - "4"
          - "7"
          - "error"
        jawaban: 1
        penjelasan: "append menambah satu isi, jadi isinya 4. len(x) menghitungnya."

  - id: "6-4"
    judul: "Tuple dan Jelajah List"
    menit: 7
    materi: |
      Pernah lihat kartu pelajar? Datanya tetap: nama, kelas, nomor absen.
      Tidak boleh diubah seenaknya. Di Python, data tetap seperti itu
      disebut **tuple**. Ditulis dengan kurung biasa:
      `data = ('Budi', '7A', 12)`.

      Tuple hampir sama dengan list, tapi **tidak bisa diubah**
      setelah dibuat. Tidak ada append. Tidak ada sort.
      Kalau dicoba, Python protes.
      Gunakan list untuk data yang berubah-ubah.
      Gunakan tuple untuk data yang tetap. Seperti koordinat titik di peta.

      ## Menjelajah list dengan for

      Kabar gembira: `for` bisa langsung jalan di atas list!
      Setiap putaran, variabel loop berisi satu elemen secara berurutan.
      Tidak perlu menghitung index.

      ```
      for x in angka:
          print(x)
      ```

      Itu mencetak semua isi angka satu per satu.
      Pola ini dipakai terus-menerus: menghitung total, mencari nilai,
      mencetak daftar. Loop + list adalah pasangan terbaik di Python.
      Begitu kamu menguasainya, banyak soal terasa jauh lebih mudah!

      Tuple juga bisa dijelajah dengan for, sama seperti list.
      Bedanya hanya pada kemampuan mengubah isi.
      Itulah yang membuat tuple aman untuk data tetap.
    contoh:
      - kode: |
          nilai = [8, 9, 7]
          for x in nilai:
              print(x)
        penjelasan: "Mencetak 8, 9, 7 — satu per satu, tanpa menghitung index."
      - kode: |
          posisi = (3, 5)
          print(posisi[0])
          print(posisi[1])
        penjelasan: "Isi tuple bisa diambil dengan index, tapi tidak bisa diubah."
    kuis:
      - soal: "Perbedaan utama tuple dan list adalah..."
        pilihan:
          - "tuple bisa diubah, list tidak"
          - "list bisa diubah, tuple tidak"
          - "tidak ada bedanya"
          - "tuple selalu lebih panjang"
        jawaban: 1
        penjelasan: "List bisa diubah (append, sort). Tuple tidak bisa diubah."
      - soal: "for x in [4, 7, 9]: print(x) mencetak..."
        pilihan:
          - "4, 7, 9"
          - "0, 1, 2"
          - "9, 7, 4"
          - "error"
        jawaban: 0
        penjelasan: "for mengambil setiap elemen list berurutan: 4, lalu 7, lalu 9."
      - soal: "Manakah yang TIDAK bisa dilakukan pada tuple?"
        pilihan:
          - "mengambil isi dengan index"
          - "menjelajah dengan for"
          - "mengubah isinya dengan append"
          - "mencetak isinya"
        jawaban: 2
        penjelasan: "Tuple tidak bisa diubah. append hanya bisa dipakai di list."

  - id: "6-5"
    judul: "Berburu Nilai Terbesar"
    menit: 8
    materi: |
      Guru mau memilih anak dengan nilai tertinggi di kelas. Guru tidak
      menghafal semua nilai. Dia menunjuk anak pertama sebagai juara sementara.
      Lalu membandingkan satu per satu. Kalau ada yang lebih besar, juaranya
      diganti.

      Di Python, cara itu bisa ditulis. Ini namanya mencari nilai terbesar
      dengan loop. Kita tidak perlu menghitung sendiri!

      ## Pola dasarnya

      ```
      nilai = [7, 9, 4, 8]
      terbesar = nilai[0]
      for x in nilai:
          if x > terbesar:
              terbesar = x
      print(terbesar)
      ```

      Baris pertama: terbesar diisi elemen pertama, yaitu 7. Itu juara sementara.
      Lalu loop memeriksa tiap elemen. 9 lebih besar dari 7, jadi juara diganti 9.
      4 tidak lebih besar, dilewati. 8 juga tidak. Hasil akhir: 9!

      ## Mau yang terkecil?

      Ganti tanda `>` dengan `<`. Sekarang yang dicari yang paling kecil.
      Sama caranya, beda arahnya. Seperti memilih pemain terpendek di barisan.

      Kenapa harus pakai loop? Karena daftar bisa sangat panjang. Seribu nilai
      pun tetap cepat. Kamu tidak perlu membacanya satu per satu.

      Ingat: Python juga punya `max()` dan `min()` yang lebih singkat.
      Tapi memahami cara kerjanya membuatmu lebih pintar. Kamu tahu apa yang
      terjadi di dalamnya. Itulah bedanya pemain dan penonton!
    contoh:
      - kode: |
          nilai = [7, 9, 4, 8]
          terbesar = nilai[0]
          for x in nilai:
              if x > terbesar:
                  terbesar = x
          print(terbesar)
        penjelasan: "terbesar mulai dari 7. 9 lebih besar, juara diganti. Hasilnya 9."
      - kode: |
          skor = [12, 5, 20, 8]
          terkecil = skor[0]
          for s in skor:
              if s < terkecil:
                  terkecil = s
          print(terkecil)
        penjelasan: "Tanda < mencari yang terkecil. Hasilnya 5."
    kuis:
      - soal: "Kode ini mencetak apa?\n\nnilai = [7, 9, 4]\nterbesar = nilai[0]\nfor x in nilai:\n    if x > terbesar:\n        terbesar = x\nprint(terbesar)"
        pilihan:
          - "7"
          - "9"
          - "4"
          - "error"
        jawaban: 1
        penjelasan: "terbesar mulai 7. Lalu 9 lebih besar, juara diganti 9. 4 tidak mengalahkannya."
      - soal: "Kenapa terbesar diisi nilai[0] dulu sebelum loop?"
        pilihan:
          - "supaya ada juara sementara untuk dibandingkan"
          - "karena nilai[0] pasti yang terbesar"
          - "supaya loop tidak jalan"
          - "tidak perlu, boleh langsung loop"
        jawaban: 0
        penjelasan: "Tanpa juara sementara, tidak ada pembanding pertama. Elemen pertama jadi titik awal."
      - soal: "Agar mencari nilai TERKECIL, tanda yang dipakai di if adalah..."
        pilihan:
          - ">"
          - "<"
          - "=="
          - "!="
        jawaban: 1
        penjelasan: "Tanda < memilih elemen yang lebih kecil. Juara diganti kalau ada yang lebih kecil."


soal:
  - id: "s6-1"
    judul: "Total Belanja Kantin"
    sulit: "mudah"
    cerita: |
      Raka menjaga kantin sekolah. Setiap kali ada yang membeli jajanan,
      ia mencatat harganya di buku. Di akhir hari, Bu Kantin bertanya:
      "Berapa total uang yang masuk hari ini?"

      Bantu Raka: baca N (banyak jajanan yang terjual), lalu N harga
      jajanan, lalu cetak total seluruh harga.
    input: "Baris 1: N (banyak jajanan). N baris berikutnya: harga tiap jajanan."
    output: "Satu angka: total seluruh harga."
    contoh:
      - input: "3\n10\n20\n30"
        output: "60"
      - input: "2\n500\n1500"
        output: "2000"
    tes:
      - input: "3\n10\n20\n30"
        output: "60"
      - input: "2\n500\n1500"
        output: "2000"
      - input: "1\n7"
        output: "7"
      - input: "4\n1000\n2000\n3000\n4000"
        output: "10000"
      - input: "5\n1\n2\n3\n4\n5"
        output: "15"
    solusi: |
      n = int(input())
      harga = []
      for i in range(n):
          harga.append(int(input()))
      print(sum(harga))
    petunjuk:
      - "Buat list kosong, lalu isi dengan append di dalam loop."
      - "Ulangi sebanyak n kali. Baca satu angka tiap putaran."
      - "Jumlahkan semua isi list dengan sum()."

  - id: "s6-2"
    judul: "Lompatan Jauh"
    sulit: "sedang"
    cerita: |
      Lomba lompat jauh antar kelas sedang berlangsung!
      Panitia mencatat jarak lompatan setiap peserta.
      Sekarang mereka ingin tahu lompatan terjauh dan terpendek
      dari seorang peserta yang melompat N kali.

      Bantu panitia: baca N, lalu N jarak lompatan.
      Cetak jarak terjauh di baris pertama, jarak terpendek di baris kedua.
    input: "Baris 1: N (banyak lompatan). N baris berikutnya: jarak tiap lompatan."
    output: "Baris 1: jarak terjauh. Baris 2: jarak terpendek."
    contoh:
      - input: "4\n3\n9\n5\n7"
        output: "9\n3"
      - input: "3\n120\n95\n110"
        output: "120\n95"
    tes:
      - input: "4\n3\n9\n5\n7"
        output: "9\n3"
      - input: "3\n120\n95\n110"
        output: "120\n95"
      - input: "1\n50"
        output: "50\n50"
      - input: "5\n10\n10\n10\n10\n10"
        output: "10\n10"
      - input: "2\n100\n1"
        output: "100\n1"
    solusi: |
      n = int(input())
      lompat = []
      for i in range(n):
          lompat.append(int(input()))
      print(max(lompat))
      print(min(lompat))
    petunjuk:
      - "Simpan semua lompatan di dalam list dengan append."
      - "Pakai max() untuk terjauh dan min() untuk terpendek."
      - "Cetak max dulu (baris pertama), lalu min (baris kedua)."

  - id: "s6-3"
    judul: "Podium Juara Game"
    sulit: "sulit"
    cerita: |
      Turnamen game kelas 7 seru banget! Panitia mencatat skor tiap pemain.
      Tiga skor tertinggi berhak naik podium: juara 1, 2, dan 3.

      Bantu panitia: baca N (banyak pemain, minimal 3), lalu N skor.
      Cetak tiga skor terbesar secara urut, satu per baris:
      terbesar dulu, lalu yang kedua, lalu yang ketiga.
    input: "Baris 1: N (banyak pemain). N baris berikutnya: skor tiap pemain."
    output: "Tiga baris: skor terbesar pertama, kedua, dan ketiga."
    contoh:
      - input: "5\n80\n50\n90\n70\n60"
        output: "90\n80\n70"
      - input: "4\n100\n1\n50\n25"
        output: "100\n50\n25"
    tes:
      - input: "5\n80\n50\n90\n70\n60"
        output: "90\n80\n70"
      - input: "4\n100\n1\n50\n25"
        output: "100\n50\n25"
      - input: "3\n5\n5\n5"
        output: "5\n5\n5"
      - input: "6\n30\n60\n10\n40\n20\n50"
        output: "60\n50\n40"
      - input: "3\n7\n9\n8"
        output: "9\n8\n7"
    solusi: |
      n = int(input())
      skor = []
      for i in range(n):
          skor.append(int(input()))
      skor.sort()
      print(skor[-1])
      print(skor[-2])
      print(skor[-3])
    petunjuk:
      - "Urutkan list dengan sort() dulu. Yang terbesar ada di belakang."
      - "Elemen terakhir ada di index -1. Satu sebelumnya di -2. Begitu seterusnya."
      - "Cetak skor[-1], skor[-2], skor[-3]. Masing-masing di baris sendiri."

  - id: "s6-4"
    judul: "Skor Panahan"
    sulit: "mudah"
    cerita: |
      Kancil mengikuti lomba panahan. Dia memanah N kali.
      Skor tiap panahan dicatat berurutan di dalam list.
      Kancil penasaran dengan skor panahan pertama dan terakhirnya.
      Baca N, lalu N skor. Simpan di list.
      Cetak skor pertama di baris pertama dan skor terakhir di baris kedua.
    input: "Baris 1: N (banyak skor). N baris berikutnya: skor tiap panahan."
    output: "Baris 1: skor pertama. Baris 2: skor terakhir."
    contoh:
      - input: "3\n10\n20\n30"
        output: "10\n30"
      - input: "4\n7\n8\n9\n10"
        output: "7\n10"
    tes:
      - input: "3\n10\n20\n30"
        output: "10\n30"
      - input: "4\n7\n8\n9\n10"
        output: "7\n10"
      - input: "1\n5"
        output: "5\n5"
      - input: "2\n100\n200"
        output: "100\n200"
      - input: "5\n1\n2\n3\n4\n5"
        output: "1\n5"
    solusi: |
      n = int(input())
      skor = []
      for i in range(n):
          skor.append(int(input()))
      print(skor[0])
      print(skor[-1])
    petunjuk:
      - "Buat list kosong, lalu isi dengan append di dalam loop."
      - "Elemen pertama ada di index 0: skor[0]."
      - "Elemen terakhir ada di index -1: skor[-1]. Cetak keduanya berurutan."

  - id: "s6-5"
    judul: "Judul Buku Terpanjang"
    sulit: "sedang"
    cerita: |
      Perpustakaan sekolah mendapat kiriman buku baru.
      Kancil bertugas mencari judul buku yang paling panjang.
      Dia mengetik judul buku satu per satu ke komputer.
      Komputer harus memilih judul dengan huruf paling banyak.
      Baca N, lalu N judul. Cetak judul yang paling panjang.
    input: "Baris 1: N (banyak judul). N baris berikutnya: judul tiap buku."
    output: "Satu baris: judul dengan huruf paling banyak."
    contoh:
      - input: "3\nBuku\nPython\nAku"
        output: "Python"
      - input: "4\napel\nmangga\njeruk\nsalak"
        output: "mangga"
    tes:
      - input: "3\nBuku\nPython\nAku"
        output: "Python"
      - input: "4\napel\nmangga\njeruk\nsalak"
        output: "mangga"
      - input: "1\nPensil"
        output: "Pensil"
      - input: "2\nMeja\nKursi"
        output: "Kursi"
      - input: "3\nAI\nPython\nGo"
        output: "Python"
    solusi: |
      n = int(input())
      terpanjang = ''
      for i in range(n):
          judul = input()
          if len(judul) > len(terpanjang):
              terpanjang = judul
      print(terpanjang)
    petunjuk:
      - "Buat variabel terpanjang = '' sebelum loop."
      - "Bandingkan dengan len(): kalau len(judul) lebih besar, ganti terpanjang."
      - "Cetak terpanjang setelah loop selesai."

  - id: "s6-6"
    judul: "Cari Angka Kembar"
    sulit: "sedang"
    cerita: |
      Kancil mendapat sekantong kelereng bernomor.
      Bu Guru bertanya: kelereng nomor berapa yang paling banyak?
      Kancil memilih satu nomor, lalu menghitung kelerengnya.
      Kamu akan membaca daftar nomor kelereng, lalu satu nomor tebakan.
      Hitung berapa kali nomor tebakan muncul di daftar.

      Baca N, lalu N nomor kelereng, lalu angka X.
      Cetak berapa kali X muncul.
    input: "Baris 1: N (banyak kelereng). N baris berikutnya: nomor kelereng. Baris terakhir: X yang dicari."
    output: "Satu angka: banyak kemunculan X."
    contoh:
      - input: "5\n3\n1\n3\n7\n3\n3"
        output: "3"
      - input: "4\n1\n2\n3\n4\n5"
        output: "0"
    tes:
      - input: "5\n3\n1\n3\n7\n3\n3"
        output: "3"
      - input: "4\n1\n2\n3\n4\n5"
        output: "0"
      - input: "1\n9\n9"
        output: "1"
      - input: "6\n2\n2\n2\n2\n2\n2\n2"
        output: "6"
      - input: "3\n5\n5\n5\n4"
        output: "0"
      - input: "5\n1\n2\n1\n2\n1\n1"
        output: "3"
    solusi: |
      n = int(input())
      kelereng = []
      for i in range(n):
          kelereng.append(int(input()))
      x = int(input())
      hitung = 0
      for a in kelereng:
          if a == x:
              hitung = hitung + 1
      print(hitung)
    petunjuk:
      - "Simpan semua nomor ke list dengan append."
      - "Baca X, lalu buat hitung = 0."
      - "Jelajahi list dengan for. Kalau isinya sama dengan X, tambah hitung 1."

  - id: "s6-7"
    judul: "Barisan Terbalik"
    sulit: "sulit"
    cerita: |
      Guru olahraga mencatat urutan lari siswa.
      Yang dicatat pertama berarti pelari paling depan.
      Sekarang ia ingin daftarnya dibalik:
      yang terakhir jadi yang pertama.
      Kamu punya list berisi urutan lari.
      Cetak isi list dari belakang ke depan.

      Baca N, lalu N angka urutan.
      Cetak urutan terbalik, satu angka per baris.
    input: "Baris 1: N (banyak angka). N baris berikutnya: angka urutan."
    output: "N baris: angka urutan terbalik (dari belakang ke depan)."
    contoh:
      - input: "3\n1\n2\n3"
        output: "3\n2\n1"
      - input: "4\n10\n20\n30\n40"
        output: "40\n30\n20\n10"
    tes:
      - input: "3\n1\n2\n3"
        output: "3\n2\n1"
      - input: "4\n10\n20\n30\n40"
        output: "40\n30\n20\n10"
      - input: "1\n7"
        output: "7"
      - input: "5\n1\n2\n3\n4\n5"
        output: "5\n4\n3\n2\n1"
      - input: "2\n100\n200"
        output: "200\n100"
      - input: "4\n3\n3\n3\n3"
        output: "3\n3\n3\n3"
    solusi: |
      n = int(input())
      urut = []
      for i in range(n):
          urut.append(int(input()))
      for i in range(n - 1, -1, -1):
          print(urut[i])
    petunjuk:
      - "Simpan semua angka ke list dengan append."
      - "Pakai for i in range(n - 1, -1, -1) untuk mundur dari akhir."
      - "Cetak urut[i] di dalam loop. Elemen terakhir juga bisa dipanggil dengan index -1."
  - id: "s6-8"
    judul: "Tiga Skor Pertama"
    sulit: "sedang"
    cerita: |
      Kancil mengikuti lomba panahan dan mencatat semua
      skornya di list. Ibu penasaran dengan tiga skor
      pertamanya. Baca N (banyak skor), lalu N skor.
      Simpan di list. Lalu cetak tiga skor pertama,
      satu per baris. Pakai slicing untuk memotongnya!
    input: "Baris 1: N (banyak skor, minimal 3). N baris berikutnya: skor tiap panahan."
    output: "Tiga baris: skor pertama, kedua, dan ketiga."
    contoh:
      - input: "5\n10\n20\n30\n40\n50"
        output: "10\n20\n30"
      - input: "3\n7\n8\n9"
        output: "7\n8\n9"
    tes:
      - input: "5\n10\n20\n30\n40\n50"
        output: "10\n20\n30"
      - input: "3\n7\n8\n9"
        output: "7\n8\n9"
      - input: "4\n100\n200\n300\n400"
        output: "100\n200\n300"
      - input: "6\n1\n2\n3\n4\n5\n6"
        output: "1\n2\n3"
      - input: "3\n5\n5\n5"
        output: "5\n5\n5"
    solusi: |
      n = int(input())
      skor = []
      for i in range(n):
          skor.append(int(input()))
      for x in skor[:3]:
          print(x)
    petunjuk:
      - "Isi list dengan append di dalam loop."
      - "skor[:3] memotong tiga elemen pertama."
      - "Jelajahi potongan itu dengan for, lalu cetak satu per satu."
  - id: "s6-9"
    judul: "Gabung Dua Antrean"
    sulit: "sulit"
    cerita: |
      Dua kelas mengantre di kantin. Bu Kantin ingin
      menggabungkan nomor antrean kedua kelas jadi satu
      daftar. Lalu daftarnya diurutkan dari kecil ke
      besar. Baca N, lalu N nomor antrean kelas satu.
      Baca M, lalu M nomor antrean kelas dua. Gabungkan,
      urutkan, lalu cetak semua nomor satu per baris.
    input: "Baris 1: N. N baris berikutnya: nomor kelas satu. Baris berikutnya: M. M baris berikutnya: nomor kelas dua."
    output: "Semua nomor gabungan yang sudah diurutkan, satu per baris."
    contoh:
      - input: "2\n3\n1\n3\n2\n5\n4"
        output: "1\n2\n3\n4\n5"
      - input: "1\n10\n1\n5"
        output: "5\n10"
    tes:
      - input: "2\n3\n1\n3\n2\n5\n4"
        output: "1\n2\n3\n4\n5"
      - input: "1\n10\n1\n5"
        output: "5\n10"
      - input: "3\n1\n1\n1\n2\n1\n1"
        output: "1\n1\n1\n1\n1"
      - input: "2\n100\n200\n2\n50\n150"
        output: "50\n100\n150\n200"
      - input: "4\n9\n7\n5\n3\n1\n8"
        output: "3\n5\n7\n8\n9"
    solusi: |
      n = int(input())
      a = []
      for i in range(n):
          a.append(int(input()))
      m = int(input())
      b = []
      for i in range(m):
          b.append(int(input()))
      gabung = a + b
      gabung.sort()
      for x in gabung:
          print(x)
    petunjuk:
      - "Baca dan simpan dua list dengan append."
      - "Gabungkan dengan tanda tambah: a + b."
      - "Urutkan dengan sort(), lalu cetak semua isinya satu per baris."

  - id: "s6-10"
    judul: "Juara Dua Lomba Lari"
    sulit: "sulit"
    cerita: |
      Kancil ikut lomba lari antar kelas.
      Juara satu dapat sepeda.
      Juara dua dapat buku gambar.
      Panitia mencatat waktu semua pelari.
      Kancil penasaran dengan waktu juara dua.
      Itu angka terbesar kedua.
      Kalau ada dua angka sama, tetap dihitung dua.
      Baca N (banyak pelari, minimal 2), lalu N waktu.
      Cetak angka terbesar kedua.
    input: "Baris 1: N (banyak pelari, minimal 2). N baris berikutnya: waktu tiap pelari."
    output: "Satu angka: waktu terbesar kedua."
    contoh:
      - input: "5\n7\n9\n4\n8\n6"
        output: "8"
      - input: "3\n5\n5\n5"
        output: "5"
    tes:
      - input: "5\n7\n9\n4\n8\n6"
        output: "8"
      - input: "2\n1\n2"
        output: "1"
      - input: "2\n2\n1"
        output: "1"
      - input: "3\n5\n5\n5"
        output: "5"
      - input: "4\n10\n3\n10\n1"
        output: "10"
      - input: "6\n50\n30\n40\n20\n10\n25"
        output: "40"
    solusi: |
      n = int(input())
      a = []
      for i in range(n):
          a.append(int(input()))
      terbesar = a[0]
      kedua = None
      for x in a[1:]:
          if x > terbesar:
              kedua = terbesar
              terbesar = x
          elif kedua is None or x > kedua:
              kedua = x
      print(kedua)
    petunjuk:
      - "Simpan semua waktu ke list dengan append."
      - "Pakai dua variabel: terbesar dan kedua. Awalnya kedua = None (belum ada)."
      - "Kalau angka lebih besar dari terbesar, kedua jadi terbesar lama. Kalau tidak, cek apakah angka lebih besar dari kedua. Cetak kedua."

  - id: "s6-11"
    judul: "Selisih Tiang Bendera"
    sulit: "sulit"
    cerita: |
      Kancil memasang tiang bendera di halaman.
      Tiap tiang punya tinggi berbeda.
      Bu Guru bertanya: dua tiang mana yang tingginya paling dekat?
      Contoh: tinggi 7 dan 4, selisihnya 3.
      Tiang sama tinggi, selisihnya 0.
      Kancil harus mencari selisih terkecil antara dua tiang mana pun.
      Baca N (banyak tiang, minimal 2), lalu N tinggi tiang.
      Cetak selisih terkecilnya.
    input: "Baris 1: N (banyak tiang, minimal 2). N baris berikutnya: tinggi tiap tiang."
    output: "Satu angka: selisih terkecil antara dua tiang."
    contoh:
      - input: "4\n7\n2\n9\n4"
        output: "2"
      - input: "3\n5\n5\n5"
        output: "0"
    tes:
      - input: "4\n7\n2\n9\n4"
        output: "2"
      - input: "2\n100\n1"
        output: "99"
      - input: "3\n5\n5\n5"
        output: "0"
      - input: "5\n50\n10\n40\n20\n30"
        output: "10"
      - input: "3\n1\n100\n50"
        output: "49"
      - input: "4\n10\n20\n30\n40"
        output: "10"
    solusi: |
      n = int(input())
      a = []
      for i in range(n):
          a.append(int(input()))
      a.sort()
      d = a[1] - a[0]
      for i in range(2, n):
          s = a[i] - a[i - 1]
          if s < d:
              d = s
      print(d)
    petunjuk:
      - "Urutkan list dengan sort(). Selisih terkecil pasti dari dua angka yang berdekatan."
      - "Mulai dengan selisih a[1] - a[0]."
      - "Bandingkan dengan selisih pasangan lain: a[i] - a[i - 1]. Simpan yang paling kecil."
