    contoh:
      - input: "10000\n3500"
        output: "Uang saku: 10000\nHarga jajan: 3500\nSisa: 6500"
      - input: "5000\n5000"
        output: "Uang saku: 5000\nHarga jajan: 5000\nSisa: 0"
    tes:
      - input: "10000\n3500"
        output: "Uang saku: 10000\nHarga jajan: 3500\nSisa: 6500"
      - input: "5000\n5000"
        output: "Uang saku: 5000\nHarga jajan: 5000\nSisa: 0"
      - input: "15000\n12300"
        output: "Uang saku: 15000\nHarga jajan: 12300\nSisa: 2700"
