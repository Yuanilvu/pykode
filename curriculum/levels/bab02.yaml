  - id: "s2-10"
    judul: "Laporan Lab Angka"
    sulit: "sulit"
    cerita: |
      Di laboratorium komputer ada mesin laporan angka.
      Mesin membaca dua angka dari kamu.
      Lalu mesin mencetak empat baris laporan: jumlah, selisih, kali, dan dua kali jumlah.
      Jumlah artinya angka pertama ditambah angka kedua.
      Selisih artinya angka pertama dikurangi angka kedua.
      Kali artinya angka pertama dikali angka kedua.
      Dua kali jumlah artinya jumlah dikali dua.
      Baca dua angka, lalu cetak empat baris persis seperti contoh.
    input: "Dua baris: angka pertama (int), lalu angka kedua (int)."
    output: "Empat baris: Jumlah: <a+b>, Selisih: <a-b>, Kali: <a*b>, Dua kali jumlah: <(a+b)*2>."
    contoh:
      - input: "8\n4"
        output: "Jumlah: 12\nSelisih: 4\nKali: 32\nDua kali jumlah: 24"
      - input: "10\n3"
        output: "Jumlah: 13\nSelisih: 7\nKali: 30\nDua kali jumlah: 26"
    tes:
      - input: "8\n4"
        output: "Jumlah: 12\nSelisih: 4\nKali: 32\nDua kali jumlah: 24"
      - input: "0\n0"
        output: "Jumlah: 0\nSelisih: 0\nKali: 0\nDua kali jumlah: 0"
      - input: "5\n5"
        output: "Jumlah: 10\nSelisih: 0\nKali: 25\nDua kali jumlah: 20"
      - input: "2\n9"
        output: "Jumlah: 11\nSelisih: -7\nKali: 18\nDua kali jumlah: 22"
      - input: "10\n3"
        output: "Jumlah: 13\nSelisih: 7\nKali: 30\nDua kali jumlah: 26"
    solusi: |
      a = int(input())
      b = int(input())
      print('Jumlah:', a + b)
      print('Selisih:', a - b)
      print('Kali:', a * b)
      print('Dua kali jumlah:', (a + b) * 2)
    petunjuk:
      - "Baca dua angka dengan int(input()). Simpan di variabel a dan b."
      - "Jumlah = a + b. Selisih = a - b. Kali = a * b."
      - "Dua kali jumlah memakai tanda kurung: (a + b) * 2."

