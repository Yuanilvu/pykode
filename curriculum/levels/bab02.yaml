bab: 2
judul: "Variabel & Tipe Data"
emoji: "📦"
warna: "#10b981"
deskripsi: "Simpan nilai di kotak bernama: variabel & tipe data."

pelajaran:
  - id: "2-1"
    judul: "Kotak Penyimpan Ajaib"
    menit: 7
    materi: |
      Bayangkan rak sepatumu di rumah. Setiap kotak ada namanya. Ada kotak
      "sepatu bola", ada kotak "sandal". Kamu tinggal taruh barangnya di
      kotak yang tepat. Nanti tinggal ambil lagi pakai nama kotaknya.

      Variabel di Python itu seperti kotak ajaib. Dia bisa menyimpan nilai.
      Setiap kotak punya nama. Kalau kamu panggil namanya, isinya keluar.

      ## Cara membuat variabel

      Tulis nama kotak, tanda sama dengan (=), lalu isinya:

      `nama = 'Budi'`

      Tanda `=` artinya "masukkan ke kotak". Bukan arti "sama dengan"
      seperti di pelajaran matematika! Setelah diisi, kamu bisa pakai
      isinya kapan saja.

      ## Aturan nama kotak

      - Pakai huruf kecil
      - Tidak boleh ada spasi
      - Dua kata disambung garis bawah: `nama_lengkap`
      - Nama yang jelas lebih baik: `uang_jajan` lebih jelas daripada `x`

      Kabar bagus: `print()` bisa mencetak banyak nilai sekaligus. Cukup
      pisahkan dengan koma. Python menaruh satu spasi di antara nilainya.
      Coba dua contoh di bawah ini!
    contoh:
      - kode: |
          nama = 'Budi'
          print(nama)
        penjelasan: "Variabel nama diisi tulisan 'Budi'. Lalu isinya dicetak di layar."
      - kode: |
          uang = 5000
          print('Uang jajanku:', uang)
        penjelasan: "print dengan koma mencetak tulisan lalu isi variabel. Ada satu spasi otomatis di antaranya."
    kuis:
      - soal: "Tanda = di Python artinya apa?"
        pilihan:
          - "sama dengan seperti di matematika"
          - "memasukkan nilai ke kotak variabel"
          - "membandingkan dua nilai"
          - "membuang isi variabel"
        jawaban: 1
        penjelasan: "Tanda = berarti memasukkan nilai ke variabel. Kalau mau membandingkan, pakai tanda == (dua tanda)."
      - soal: "Nama variabel mana yang benar?"
        pilihan:
          - "uang jajan"
          - "uang_jajan"
          - "2uang"
          - "uang-jajan"
        jawaban: 1
        penjelasan: "Nama variabel tidak boleh ada spasi. Dua kata disambung garis bawah. Tidak boleh diawali angka atau memakai tanda minus."
      - soal: "Kode ini mencetak apa?\n\nx = 7\nprint('Nilai:', x)"
        pilihan:
          - "Nilai: x"
          - "7"
          - "Nilai: 7"
          - "x: 7"
        jawaban: 2
        penjelasan: "print dengan koma mencetak tulisan 'Nilai:' lalu isi variabel x, yaitu 7."
      - soal: "Kode ini mencetak apa?\n\nx = 5\nx = 8\nprint(x)"
        pilihan:
          - "5"
          - "8"
          - "5 dan 8"
          - "error"
        jawaban: 1
        penjelasan: "Variabel menyimpan nilai terakhir. Kotak x diisi ulang jadi 8, lalu dicetak 8."
      - soal: "Kode ini mencetak apa?\n\na = 3\nb = a\nprint(b)"
        pilihan:
          - "3"
          - "a"
          - "b"
          - "error"
        jawaban: 0
        penjelasan: "Isi kotak a disalin ke kotak b. Jadi b berisi 3, lalu dicetak 3."

  - id: "2-2"
    judul: "Jenis-Jenis Isi Kotak"
    menit: 8
    materi: |
      Setiap kotak variabel menyimpan satu jenis isi. Jenis isi itu namanya
      tipe data. Tipe data seperti label di kotak mainanmu. Label itu
      memberi tahu isi kotaknya.

      ## Empat tipe dasar

      - **int** — angka bulat. Contoh: 5, -3, 0. Tidak ada komanya.
      - **float** — angka desimal. Contoh: 3.5, 0.75. Pakai titik,
        bukan koma!
      - **str** — tulisan (string). Contoh: 'Halo', 'Python'. Selalu
        dibungkus tanda kutip.
      - **bool** — cuma dua nilai: True atau False. Dipakai untuk
        jawaban ya/tidak.

      Kamu tidak perlu bilang ke Python isinya tipe apa. Python menebaknya
      sendiri. Angka tanpa kutip jadi int atau float. Tulisan dengan kutip
      jadi str.

      Kenapa penting tahu tipenya? Karena ada cara yang hanya mau satu
      jenis isi. Kamu tidak bisa mencampur tulisan dan angka seenaknya.
      Di Bab 3 kamu akan lihat caranya.

      Yang sering bikin bingung: `'123'` itu tulisan (str). Sedangkan
      `123` itu angka (int). Walau terlihat sama, isinya beda jenis!
    contoh:
      - kode: |
          umur = 13
          tinggi = 158.5
          nama = 'Budi'
          lulus = True
          print(umur, tinggi, nama, lulus)
        penjelasan: "Empat variabel dengan empat tipe berbeda: int, float, str, dan bool. Semuanya dicetak sekaligus."
      - kode: |
          pi = 3.14
          print('Nilai pi:', pi)
        penjelasan: "pi adalah float karena ada titik desimalnya."
    kuis:
      - soal: "Manakah yang termasuk bilangan bulat (int)?"
        pilihan:
          - "3.5"
          - "7"
          - "'7'"
          - "True"
        jawaban: 1
        penjelasan: "7 tidak pakai koma dan tidak pakai kutip, jadi int. 3.5 itu float, '7' itu tulisan, True itu bool."
      - soal: "Tipe data apa yang isinya cuma True atau False?"
        pilihan:
          - "int"
          - "float"
          - "str"
          - "bool"
        jawaban: 3
        penjelasan: "bool cuma punya dua nilai: True dan False."
      - soal: "Manakah yang merupakan tulisan (str)?"
        pilihan:
          - "123"
          - "'123'"
          - "12.3"
          - "-5"
        jawaban: 1
        penjelasan: "Yang dibungkus tanda kutip adalah tulisan, walau isinya angka."
      - soal: "Manakah yang merupakan angka desimal (float)?"
        pilihan:
          - "7"
          - "'3.5'"
          - "3.5"
          - "False"
        jawaban: 2
        penjelasan: "3.5 memakai titik, jadi float. '3.5' pakai tanda kutip, jadi tulisan."
      - soal: "Manakah pernyataan yang benar?"
        pilihan:
          - "'123' itu angka"
          - "123 itu tulisan"
          - "'123' itu tulisan, 123 itu angka"
          - "'123' dan 123 sama saja"
        jawaban: 2
        penjelasan: "Yang memakai tanda kutip adalah tulisan. '123' tulisan, 123 angka."

  - id: "2-3"
    judul: "Bertanya ke User: input()"
    menit: 8
    materi: |
      Program yang seru harus bisa bertanya! `input()` membuat program
      berhenti sejenak. Dia menunggu kamu mengetik. Setelah kamu tekan
      Enter, ketikanmu disimpan ke variabel.

      Lihat contoh ini:

      `nama = input()`

      Saat program sampai di baris ini, dia menunggu. Kamu mengetik
      "Budi" lalu tekan Enter. Sekarang variabel `nama` berisi tulisan
      'Budi'.

      ## Jebakan kecil: input() selalu memberi tulisan

      Ini penting! Apa pun yang kamu ketik — angka sekalipun — `input()`
      selalu memberikannya sebagai tulisan (str). Jadi kalau kamu mengetik
      `5`, isinya bukan angka 5, melainkan tulisan '5'.

      Supaya menjadi angka sungguhan, bungkus dengan `int()` atau
      `float()`:

      `umur = int(input())`
      `tinggi = float(input())`

      `int()` mengubah tulisan jadi angka bulat. `float()` mengubah
      tulisan jadi angka desimal. Keduanya dipelajari lagi nanti. Kalau
      kamu lupa membungkusnya, Python menganggap angkamu hanya tulisan.
      Itu sering bikin error di Bab 3 nanti!

      Kamu juga bisa menaruh pertanyaan di dalam kurung `input()`. Contoh:
      `input('Siapa namamu? ')`. Pertanyaan itu muncul di layar dulu.
      Seperti petugas loket yang bertanya sebelum memberi tiket.
    contoh:
      - kode: |
          harga = '5000'
          print(harga)
        penjelasan: "harga diisi tulisan '5000' (ada tanda kutipnya). Jadi isinya masih tulisan, walau terlihat seperti angka."
      - kode: |
          harga = int('5000')
          print('Harga dalam bentuk angka:', harga)
        penjelasan: "int() mengubah tulisan '5000' menjadi angka 5000. Ini yang terjadi di balik int(input())."
    kuis:
      - soal: "Apa yang dilakukan input()?"
        pilihan:
          - "mencetak tulisan di layar"
          - "menunggu ketikanmu lalu menyimpannya"
          - "menghitung angka"
          - "menutup program"
        jawaban: 1
        penjelasan: "input() membuat program berhenti sejenak. Dia menunggu ketikanmu, lalu menyimpannya ke variabel."
      - soal: "Kamu mengetik angka 5. Apa tipe hasil input()?"
        pilihan:
          - "int"
          - "float"
          - "str"
          - "bool"
        jawaban: 2
        penjelasan: "input() selalu memberi tulisan (str). Supaya jadi angka, bungkus dengan int() atau float()."
      - soal: "Bagaimana cara membaca umur sebagai angka bulat?"
        pilihan:
          - "input(umur)"
          - "int(input())"
          - "umur = int"
          - "float(umur)"
        jawaban: 1
        penjelasan: "int(input()) mengubah hasil ketikan yang berupa tulisan menjadi angka bulat."
      - soal: "Kamu mengetik Budi. Apa isi variabel nama setelah kode ini?\n\nnama = input()"
        pilihan:
          - "tulisan 'Budi'"
          - "angka 0"
          - "error"
          - "kosong"
        jawaban: 0
        penjelasan: "input() menyimpan ketikanmu sebagai tulisan. Jadi isi nama adalah 'Budi'."
      - soal: "Apa yang terjadi saat program sampai di baris ini?\n\nnama = input('Siapa namamu? ')"
        pilihan:
          - "Tulisan 'Siapa namamu? ' muncul, lalu program menunggu ketikan"
          - "Program langsung selesai"
          - "Program error"
          - "Tidak ada yang muncul"
        jawaban: 0
        penjelasan: "Tulisan di dalam kurung input() muncul di layar dulu. Lalu program menunggu ketikanmu."

  - id: "2-4"
    judul: "Mengubah Tipe: int() & float()"
    menit: 7
    materi: |
      Di pelajaran sebelumnya, `int()` dan `float()` dipakai mengubah
      hasil `input()` jadi angka. Ternyata keduanya juga bisa mengubah
      angka lain!

      ## Mengubah float menjadi int

      `int()` membuang bagian desimal. Bukan membulatkan, tapi memotong.
      Jadi:

      - `int(7.9)` hasilnya 7
      - `int(3.14)` hasilnya 3
      - `int(158.7)` hasilnya 158

      ## Mengubah int menjadi float

      `float()` menambahkan titik nol di belakangnya:

      - `float(7)` hasilnya 7.0

      ## Mengubah tulisan menjadi angka

      Kalau tulisan berisi angka, `int('12')` hasilnya 12 dan
      `float('2.5')` hasilnya 2.5. Tapi hati-hati: `int('abc')` akan
      error, karena 'abc' bukan angka. `int('3.7')` juga error — tulisan
      dengan titik harus lewat `float()` dulu.

      Kenapa harus bisa mengubah-ubah tipe? Karena data di dunia nyata
      datang bermacam-macam. Harga dari kalkulator bisa 2500.75. Umur
      dari form bisa '13' (tulisan). Programmer yang jago tahu kapan
      mengubah tipe supaya semuanya cocok.

      Oh iya, ingat: `int()` itu memotong, bukan membulatkan. `int(7.9)`
      tetap 7, bukan 8. Kalau suatu hari kamu butuh pembulatan sungguhan,
      ada cara lain — kita cari bersama di bab-bab berikutnya!
    contoh:
      - kode: |
          tinggi = 158.7
          print('Tinggi dibulatkan ke bawah:', int(tinggi))
        penjelasan: "int(tinggi) membuang bagian desimal. Jadi 158.7 menjadi 158."
      - kode: |
          angka = '12'
          print(float(angka))
        penjelasan: "float('12') mengubah tulisan '12' menjadi angka desimal 12.0."
    kuis:
      - soal: "Berapa hasil int(7.9)?"
        pilihan:
          - "7"
          - "8"
          - "7.9"
          - "error"
        jawaban: 0
        penjelasan: "int() membuang bagian desimal. Jadi 7.9 menjadi 7, bukan dibulatkan ke 8."
      - soal: "Berapa hasil int('12')?"
        pilihan:
          - "'12'"
          - "12"
          - "error"
          - "12.0"
        jawaban: 1
        penjelasan: "int('12') mengubah tulisan '12' menjadi angka 12."
      - soal: "Mengapa int('3.7') error?"
        pilihan:
          - "karena 3.7 terlalu besar"
          - "karena tulisan berisi titik harus lewat float() dulu"
          - "karena 3.7 bukan angka"
          - "karena int() cuma bisa dipakai di input()"
        jawaban: 1
        penjelasan: "Tulisan '3.7' punya titik desimal. Pakai float('3.7') dulu, baru boleh diubah lagi."
      - soal: "Berapa hasil float(5)?"
        pilihan:
          - "5"
          - "5.0"
          - "error"
          - "'5'"
        jawaban: 1
        penjelasan: "float() menambahkan titik nol di belakangnya. Angka 5 jadi 5.0."
      - soal: "Berapa hasil int(-3.7)?"
        pilihan:
          - "-4"
          - "-3"
          - "3"
          - "error"
        jawaban: 1
        penjelasan: "int() membuang bagian desimal. -3.7 menjadi -3, bukan dibulatkan ke -4."

  - id: "2-5"
    judul: "Menukar Isi Dua Kotak"
    menit: 7
    materi: |
      Punya dua gelas? Satu berisi susu, satu berisi jus. Kamu mau menukar isinya.
      Gelas susu harus berisi jus. Gelas jus harus berisi susu.

      Bisa? Tidak bisa langsung dituang. Kalau susu dituang ke gelas jus, isinya tercampur!

      ## Butuh gelas ketiga

      Caranya: siapkan gelas kosong ketiga. Tuang susu ke gelas kosong itu.
      Sekarang gelas susu kosong. Tuang jus ke gelas susu.
      Terakhir, tuang susu dari gelas ketiga ke gelas jus. Selesai!

      ## Di Python sama saja

      Variabel itu seperti gelas. Untuk menukar isi dua variabel, kita butuh
      variabel ketiga. Namanya bebas, misalnya `temp`. Temp artinya sementara.

      ```
      temp = a
      a = b
      b = temp
      ```

      Baris pertama: isi a dipindah ke temp. Baris kedua: isi b dipindah ke a.
      Baris ketiga: isi temp (yang tadinya milik a) dipindah ke b.
      Sekarang isi a dan b bertukar!

      Teknik ini dipakai di banyak program: mengurutkan angka, mengacak kartu,
      sampai memutar lagu. Semua butuh menukar isi variabel.

      Coba jalankan contohnya, lalu ganti angka a dan b. Lihat hasilnya bertukar!
    contoh:
      - kode: |
          a = 5
          b = 3
          temp = a
          a = b
          b = temp
          print(a, b)
        penjelasan: "Isi a dan b bertukar: a jadi 3, b jadi 5. Temp menahannya sementara."
      - kode: |
          pulpen = 'biru'
          pensil = 'merah'
          temp = pulpen
          pulpen = pensil
          pensil = temp
          print(pulpen, pensil)
        penjelasan: "Isi pulpen dan pensil bertukar: pulpen jadi merah, pensil jadi biru."
    kuis:
      - soal: "Kode ini mencetak apa?\n\na = 4\nb = 9\ntemp = a\na = b\nb = temp\nprint(a, b)"
        pilihan:
          - "4 9"
          - "9 4"
          - "temp 4"
          - "error"
        jawaban: 1
        penjelasan: "temp menahan 4. Lalu a diisi 9, b diisi 4. Jadi tercetak 9 4."
      - soal: "Kenapa kita butuh variabel temp saat menukar?"
        pilihan:
          - "supaya program lebih panjang"
          - "supaya isi a tidak hilang saat ditimpa isi b"
          - "karena Python wajib memakainya"
          - "supaya angkanya bertambah"
        jawaban: 1
        penjelasan: "Kalau a langsung diisi b, isi a yang lama hilang. Temp menyimpannya dulu."
      - soal: "Kode ini mencetak apa?\n\nx = 1\ny = 2\ntemp = x\nx = y\ny = temp\nprint(x, y)"
        pilihan:
          - "1 2"
          - "2 1"
          - "1 1"
          - "error"
        jawaban: 1
        penjelasan: "Isi x dan y bertukar: x jadi 2, y jadi 1. Tercetak 2 1."


soal:
  - id: "s2-1"
    judul: "Sapaan Si Kancil"
    sulit: "mudah"
    cerita: |
      Si Kancil baru belajar Python. Dia mau membuat program sapaan.
      Program membaca satu nama. Lalu mencetak 'Halo' dan nama itu.
      Kalau Budi yang mengetik, hasilnya 'Halo Budi'. Bantuin Kancil, ya!
    input: "Satu baris: nama (tulisan)."
    output: "Satu baris: kata Halo, satu spasi, lalu nama."
    contoh:
      - input: "Budi"
        output: "Halo Budi"
      - input: "Siti"
        output: "Halo Siti"
    tes:
      - input: "Budi"
        output: "Halo Budi"
      - input: "Siti"
        output: "Halo Siti"
      - input: "Kancil"
        output: "Halo Kancil"
      - input: "Andi"
        output: "Halo Andi"
      - input: "Rina"
        output: "Halo Rina"
    solusi: |
      nama = input()
      print('Halo', nama)
    petunjuk:
      - "Baca nama dengan input(). Simpan ke variabel."
      - "Cetak kata 'Halo' lalu isi variabel nama."
      - "Pakai print('Halo', nama). Koma otomatis memberi satu spasi di antaranya."

  - id: "s2-2"
    judul: "Kasir Kantin yang Pembulat"
    sulit: "sedang"
    cerita: |
      Ibu kasir kantin menghitung harga kue. Hasilnya sering angka
      desimal, misalnya 2500.75. Ibu kasir mau membuang angka di belakang
      koma. Supaya harganya jadi 2500. Bantuin dia: baca harga, lalu
      cetak harga bulatnya.
    input: "Satu baris: harga angka desimal (float)."
    output: "Satu baris: Harga bulat: lalu angka bulat."
    contoh:
      - input: "2500.75"
        output: "Harga bulat: 2500"
      - input: "199.99"
        output: "Harga bulat: 199"
    tes:
      - input: "2500.75"
        output: "Harga bulat: 2500"
      - input: "199.99"
        output: "Harga bulat: 199"
      - input: "0.5"
        output: "Harga bulat: 0"
      - input: "7500.0"
        output: "Harga bulat: 7500"
      - input: "3.14"
        output: "Harga bulat: 3"
    solusi: |
      harga = float(input())
      print('Harga bulat:', int(harga))
    petunjuk:
      - "Baca harga dengan float(input()) supaya jadi angka desimal."
      - "Ubah ke angka bulat dengan int(). Bagian desimal dibuang."
      - "Cetak dengan print('Harga bulat:', int(harga))."

  - id: "s2-3"
    judul: "Kartu Pelajar Baru"
    sulit: "sulit"
    cerita: |
      Sekolah Kancil membuat kartu pelajar baru. Setiap siswa mengetik
      nama, umur, dan tinggi badan. Tinggi bisa desimal, misalnya 150.7.
      Program mencetak tiga baris: Nama, Umur, dan Tinggi. Contoh: Budi
      umur 13 tinggi 150.7. Hasilnya 'Nama: Budi', 'Umur: 13 tahun',
      'Tinggi: 150 cm'. Bagian desimal tinggi dibuang. Baca tiga input
      berurutan, lalu cetak tiga baris kartu.
    input: "Tiga baris: nama (tulisan), umur (int), tinggi (float)."
    output: "Tiga baris: Nama: <nama>, Umur: <umur> tahun, Tinggi: <tinggi bulat> cm."
    contoh:
      - input: "Budi\n13\n150.7"
        output: "Nama: Budi\nUmur: 13 tahun\nTinggi: 150 cm"
      - input: "Siti\n12\n145.2"
        output: "Nama: Siti\nUmur: 12 tahun\nTinggi: 145 cm"
    tes:
      - input: "Budi\n13\n150.7"
        output: "Nama: Budi\nUmur: 13 tahun\nTinggi: 150 cm"
      - input: "Siti\n12\n145.2"
        output: "Nama: Siti\nUmur: 12 tahun\nTinggi: 145 cm"
      - input: "Kancil\n14\n160.9"
        output: "Nama: Kancil\nUmur: 14 tahun\nTinggi: 160 cm"
      - input: "Andi\n11\n138.4"
        output: "Nama: Andi\nUmur: 11 tahun\nTinggi: 138 cm"
      - input: "Rina\n15\n152.0"
        output: "Nama: Rina\nUmur: 15 tahun\nTinggi: 152 cm"
    solusi: |
      nama = input()
      umur = int(input())
      tinggi = float(input())
      print('Nama:', nama)
      print('Umur:', umur, 'tahun')
      print('Tinggi:', int(tinggi), 'cm')
    petunjuk:
      - "Baca tiga input berurutan: nama, umur, lalu tinggi."
      - "Umur dibaca dengan int(input()). Tinggi dengan float(input())."
      - "Cetak tiga baris. Contoh: print('Nama:', nama) dan print('Tinggi:', int(tinggi), 'cm')."

  - id: "s2-4"
    judul: "Nama dan Kelas"
    sulit: "mudah"
    cerita: |
      Sekolah Kancil mengadakan pendataan siswa baru.
      Setiap siswa mengetik nama lalu mengetik kelasnya.
      Komputer harus mencetak dua baris: nama dan kelas.
      Contohnya, Kancil mengetik 'Budi' lalu '7A'.
      Hasilnya:

      Nama: Budi
      Kelas: 7A

      Baca dua ketikan berurutan, lalu cetak dua baris itu.
    input: "Dua baris: nama (tulisan), lalu kelas (tulisan)."
    output: "Dua baris: Nama: <nama>, lalu Kelas: <kelas>."
    contoh:
      - input: "Budi\n7A"
