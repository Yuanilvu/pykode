      Program membaca uang saku lalu harga jajan. Lalu
      mencetak tiga baris: uang saku, harga jajan, dan
      sisa uang. Sisa dihitung dengan mengurangkan harga
      jajan dari uang saku. Bantuin Kancil, ya!
    input: "Dua baris: uang saku (int), lalu harga jajan (int)."
