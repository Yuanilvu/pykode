      umur 13, program bilang tahun depan umurnya 14. Hitung umur
      tahun depan dengan menambah satu. Cetak kalimat lengkap: 'Halo
      Budi! Tahun depan umurmu 14 tahun.' Baca nama dulu, lalu umur.
      Cetak persis seperti contoh.
    input: "Dua baris: nama (tulisan), lalu umur (int)."
    output: "Satu baris: Halo <nama>! Tahun depan umurmu <umur+1> tahun."
    contoh:
      - input: "Budi\n13"
        output: "Halo Budi! Tahun depan umurmu 14 tahun."
      - input: "Siti\n12"
        output: "Halo Siti! Tahun depan umurmu 13 tahun."
    tes:
      - input: "Budi\n13"
        output: "Halo Budi! Tahun depan umurmu 14 tahun."
      - input: "Siti\n12"
