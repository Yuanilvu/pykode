      - input: "Kancil\n15"
        output: "Halo Kancil! Tahun depan umurmu 16 tahun."
      - input: "Rina\n10"
        output: "Halo Rina! Tahun depan umurmu 11 tahun."
      - input: "Andi\n14"
        output: "Halo Andi! Tahun depan umurmu 15 tahun."
    solusi: |
