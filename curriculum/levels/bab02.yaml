      Petugas ingin mencetak dua hal: tinggi aslinya dan tinggi bulatnya.
      Bagian desimal dibuang dengan int(). Contoh: 150.7 menjadi 150.
      Baca satu angka desimal, lalu cetak dua baris:

      Tinggi: 150.7
