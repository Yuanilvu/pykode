bab: 9
judul: "Error Itu Teman"
emoji: "🛠️"
warna: "#ef4444"
deskripsi: "Error bukan musuh: baca pesannya, tangkap dengan try/except."

pelajaran:
  - id: "9-1"
    judul: "Error Itu Temanmu"
    menit: 7
    materi: |
      Saat kamu main game, karaktermu bisa jatuh ke jurang.
      Game tidak langsung mati.
      Game kasih tahu: "Kamu jatuh!"
      Python juga begitu.
      Kalau ada yang salah, Python berteriak lewat **pesan error**.
      Error itu bukan hukuman.
      Error itu petunjuk!

      ## Error yang paling sering muncul

      Ada lima error yang sering muncul:
      - **NameError**: nama variabel belum dibuat. Contoh: `print(umur)` padahal `umur` belum pernah diisi.
      - **TypeError**: jenis data tidak cocok. Contoh: `'5' + 3`. Teks tidak bisa ditambah angka begitu saja.
      - **ValueError**: nilainya tidak cocok. Contoh: `int('abc')` — 'abc' bukan angka.
      - **ZeroDivisionError**: membagi dengan nol. Di matematika pun itu dilarang!
      - **IndexError**: mengambil isi list di posisi yang tidak ada.

      Nama error ada di baris terakhir pesan.
      Kalau kamu tahu namanya, kamu langsung tahu cara memperbaikinya.
      Seperti di game: kalau musuhmu bernama "Golem Batu", kamu tahu harus pakai senjata apa!

      ## Trik menghafal

      Error cuma lima: Name (nama), Type (jenis), Value (nilai),
      Zero (bagi nol), Index (posisi).
      Hafalkan kelimanya, kamu jadi pembaca error yang hebat!
    contoh:
      - kode: |
          print('Baris ini jalan')
          print(angka)  # angka belum pernah dibuat
        penjelasan: "Jalankan, lalu baca pesannya. NameError muncul karena variabel angka belum dibuat."
        error: true
      - kode: |
          angka = 10
          print(angka * 2)
        penjelasan: "Variabel angka dibuat dulu, baru dipakai. Hasilnya 20."
    kuis:
      - soal: "Error NameError muncul kalau kita..."
        pilihan:
          - "membagi dengan nol"
          - "memakai nama variabel yang belum dibuat"
          - "menulis angka di dalam teks"
          - "memakai tanda kutip ganda"
        jawaban: 1
        penjelasan: "NameError = nama yang dipakai belum ada. Buat dulu variabelnya!"
      - soal: "Kode int('abc') akan membuat error..."
        pilihan:
          - "NameError"
          - "TypeError"
          - "ValueError"
          - "IndexError"
        jawaban: 2
        penjelasan: "'abc' bukan angka, jadi nilainya tidak cocok untuk diubah jadi int — itu ValueError."
      - soal: "Error ZeroDivisionError muncul karena..."
        pilihan:
          - "membagi dengan nol"
          - "menjumlahkan teks dan angka"
          - "memakai variabel yang belum ada"
          - "mengambil index yang tidak ada"
        jawaban: 0
        penjelasan: "Membagi dengan nol dilarang di Python, sama seperti di matematika."
      - soal: "Kode '5' + 3 membuat error karena..."
        pilihan:
          - "teks dan angka tidak bisa ditambah"
          - "angka 5 terlalu kecil"
          - "tanda kutipnya salah"
          - "tidak ada variabel"
        jawaban: 0
        penjelasan: "Teks dan angka beda jenis. Menambahkannya memicu TypeError."
      - soal: "Mengambil isi list di posisi yang tidak ada memicu error..."
        pilihan:
          - "NameError"
          - "IndexError"
          - "ValueError"
          - "TypeError"
        jawaban: 1
        penjelasan: "IndexError muncul saat posisi (index) yang diminta tidak ada di list."



  - id: "9-2"
    judul: "try/except: Jaring Pengaman"
    menit: 8
    materi: |
      Di sirkus, pemain sirkus yang gagal tetap aman.
      Kenapa? Ada **jaring pengaman** di bawahnya.
      Di Python, `try/except` adalah jaring pengaman untuk kode kamu.

      ## Cara memasang jaring

      ```python
      try:
          # kode yang mungkin error
      except NameError:
          # yang dilakukan kalau error terjadi
      ```

      Python mencoba menjalankan kode di dalam `try`.
      Kalau muncul error, program **tidak langsung mati**.
      Program melompat ke blok `except` dan menjalankan cara di sana.
      Kalau tidak ada error, blok `except` dilewati begitu saja.

      ## Kenapa penting?

      Bayangkan program kasir di kantin.
      Kalau ada harga yang salah ketik dan program langsung mati, antrean di belakangmu ikut berantakan!
      Dengan try/except, program tetap jalan.
      Program tinggal mencetak pesan ramah: "Maaf, data tidak valid."

      Kamu juga bisa menangkap error spesifik.
      Pakai `except ValueError:` untuk angka yang tidak valid.
      Pakai `except ZeroDivisionError:` untuk pembagian nol.
      Menangkap error yang spesifik itu seperti memakai obat yang tepat untuk penyakit yang tepat.
    contoh:
      - kode: |
          try:
              hasil = 10 / 0
          except ZeroDivisionError:
              print('Tidak bisa membagi dengan nol!')
        penjelasan: "10 / 0 memicu ZeroDivisionError. Jaring pengaman except menangkapnya dan mencetak pesan."
      - kode: |
          try:
              umur = int('dua belas')
              print(umur)
          except ValueError:
              print('Angka tidak valid!')
        penjelasan: "int('dua belas') gagal karena bukan angka, jadi pesan 'Angka tidak valid!' yang muncul."
    kuis:
      - soal: "Apa tugas blok except?"
        pilihan:
          - "menjalankan kode yang berhasil"
          - "menangkap error dan menjalankan cara penyelamat"
          - "menghentikan program lebih cepat"
          - "menghapus kode yang error"
        jawaban: 1
        penjelasan: "except menangkap error dari try lalu menjalankan cara di dalamnya, jadi program tidak mati."
      - soal: "Kalau tidak ada error di dalam try, maka blok except akan..."
        pilihan:
          - "tetap dijalankan"
          - "dilewati"
          - "menyebabkan error baru"
          - "mengulang kode try"
        jawaban: 1
        penjelasan: "except hanya jalan kalau ada error. Kalau aman-aman saja, dia dilewati."
      - soal: "except ZeroDivisionError: cocok untuk menangkap error akibat..."
        pilihan:
          - "nama variabel salah"
          - "membagi dengan nol"
          - "index di luar jangkauan"
          - "membaca file yang hilang"
        jawaban: 1
        penjelasan: "ZeroDivisionError selalu datang dari pembagian dengan nol."
      - soal: "except ValueError cocok untuk menangkap..."
        pilihan:
          - "nilai yang tidak cocok, seperti int('abc')"
          - "nama variabel yang belum dibuat"
          - "membagi dengan nol"
          - "list yang kosong"
        jawaban: 0
        penjelasan: "ValueError muncul saat nilainya tidak cocok. 'abc' bukan angka."
      - soal: "try: angka = int('abc') except ValueError: print('salah'). Outputnya..."
        pilihan:
          - "'salah'"
          - "error"
          - "'abc'"
          - "tidak ada output"
        jawaban: 0
        penjelasan: "int('abc') gagal, jadi blok except jalan dan mencetak 'salah'."



  - id: "9-3"
    judul: "Membaca Pesan Error"
    menit: 6
    materi: |
      Pesan error Python itu seperti peta harta karun.
      Kalau kamu tahu membacanya, kamu langsung tahu di mana masalahnya.

      ## Bagian-bagian pesan error

      Saat error terjadi, Python menampilkan **traceback** — daftar jejak baris yang dilewati sebelum error.
      Yang penting cuma dua hal:
      1. **Baris terakhir**: nama error-nya (misalnya `NameError: name 'angka' is not defined`).
      2. **Baris "File main.py, line N"**: nomor baris tempat masalah terjadi.

      Contoh: kalau pesannya `TypeError ... line 2`, berarti baris 2 yang bermasalah.
      Cek dulu baris itu!

      ## Cara membaca pesan

      Jangan baca dari atas — baca dari **bawah**!
      Nama error dan penjelasan singkatnya selalu ada di baris terakhir.
      Bagian atas hanya jejak langkah yang tidak terlalu penting untuk pemula.

      Biasakan diri membaca pesan error pelan-pelan.
      Semakin sering kamu membaca, semakin cepat kamu paham.
      Programmer hebat pun masih membaca pesan error setiap hari — mereka cuma makin cepat mengerti maksudnya!
    contoh:
      - kode: |
          print('Baris 1')
          print(5 + 'lima')
        penjelasan: "Error di baris 2: angka 5 ditambah teks 'lima' tidak boleh — itu TypeError."
        error: true
      - kode: |
          nama = 'Kancil'
          print('Halo, ' + nama)
        penjelasan: "Teks + teks boleh, jadi baris ini jalan tanpa error."
    kuis:
      - soal: "Bagian pesan error yang paling penting untuk dibaca adalah..."
        pilihan:
          - "baris paling atas"
          - "baris paling bawah"
          - "tengah-tengah"
          - "semua baris sama pentingnya"
        jawaban: 1
        penjelasan: "Nama error dan penjelasannya selalu ada di baris terakhir traceback."
      - soal: "Baris 'File main.py, line 3' memberi tahu..."
        pilihan:
          - "nama file yang salah"
          - "nomor baris tempat error terjadi"
          - "jumlah error yang ada"
          - "waktu error terjadi"
        jawaban: 1
        penjelasan: "Bagian 'line 3' menunjukkan baris ke-3 yang bermasalah — cek baris itu dulu."
      - soal: "Teks 'name \"angka\" is not defined' artinya..."
        pilihan:
          - "variabel angka nilainya nol"
          - "variabel angka belum dibuat"
          - "angka terlalu besar"
          - "angka salah tipe"
        jawaban: 1
        penjelasan: "'is not defined' = belum didefinisikan. Variabel angka harus dibuat dulu."
      - soal: "Traceback adalah..."
        pilihan:
          - "daftar jejak baris sebelum error"
          - "nama program yang error"
          - "hasil program yang benar"
          - "tulisan di dalam program"
        jawaban: 0
        penjelasan: "Traceback menunjukkan baris-baris yang dilewati sebelum error terjadi."
      - soal: "Pesan 'ValueError: invalid literal for int()' muncul saat..."
        pilihan:
          - "membagi dengan nol"
          - "int() diberi teks yang bukan angka"
          - "variabel belum dibuat"
          - "index tidak ada"
        jawaban: 1
        penjelasan: "int() hanya bisa mengubah teks angka. Teks lain memicu ValueError."



  - id: "9-4"
    judul: "Debugging: Jadi Detektif"
    menit: 8
    materi: |
      Program kamu error atau hasilnya aneh?
      Saatnya memakai topi detektif!
      **Debugging** adalah cara mencari dan memperbaiki bug (kesalahan) di kode.
      Namanya dari zaman dulu: ada serangga (bug) yang masuk ke komputer dan membuat program rusak!

      ## Senjata utama detektif: print()

      Cara paling gampang melihat apa yang terjadi di dalam program adalah menaruh `print()` di beberapa titik.
      Dengan begitu kamu bisa melihat isi variabel langkah demi langkah.

      Contoh kasus: program menghitung total tapi hasilnya salah.
      Taruh `print()` di dalam perulangan untuk melihat nilai total setiap kali bertambah.

      ## Langkah debugging

      1. **Tebak** bagian mana yang salah (biasanya dari pesan error).
      2. **Periksa** dengan print() — cetak isi variabel di titik itu.
      3. **Perbaiki** satu hal kecil.
      4. **Jalankan lagi** dan lihat apakah berubah.

      Ulangi sampai benar.
      Detektif sejati tidak menyerah di langkah pertama — dia terus menyelidiki sampai pelakunya tertangkap!
    contoh:
      - kode: |
          total = 0
          for i in range(1, 4):
              total = total + i
              print('Setelah tambah', i, 'total =', total)
          print('Total akhir:', total)
        penjelasan: "print() di dalam loop memperlihatkan total bertambah 1, 2, 3. Total akhir 6."
      - kode: |
          harga = 5000
          print('harga =', harga)  # cek isi variabel
          print('Harga 2 buah:', harga * 2)
        penjelasan: "Baris print pertama membantu memastikan harga terisi 5000, bukan nilai lain."
    kuis:
      - soal: "Debugging adalah..."
        pilihan:
          - "menghapus semua kode"
          - "mencari dan memperbaiki kesalahan di kode"
          - "membuat kode lebih panjang"
          - "mengganti bahasa pemrograman"
        jawaban: 1
        penjelasan: "Debugging = berburu bug (kesalahan) sampai kode berjalan benar."
      - soal: "Cara paling gampang melihat isi variabel saat debugging adalah..."
        pilihan:
          - "menebak-nebak"
          - "memakai print() untuk mencetak isinya"
          - "menghapus variabelnya"
          - "merestart komputer"
        jawaban: 1
        penjelasan: "print() memperlihatkan isi variabel saat itu juga — mata-mata terbaik programmer."
      - soal: "Urutan debugging yang benar adalah..."
        pilihan:
          - "perbaiki dulu, baru tebak"
          - "tebak, periksa, perbaiki, lalu jalankan lagi"
          - "jalankan, hapus, tulis ulang"
          - "tebak sekali dan langsung selesai"
        jawaban: 1
        penjelasan: "Tebak lokasi masalah, periksa dengan print, perbaiki, lalu jalankan lagi untuk cek."
      - soal: "Bug adalah..."
        pilihan:
          - "serangga sungguhan"
          - "kesalahan di dalam kode"
          - "nama variabel"
          - "program yang benar"
        jawaban: 1
        penjelasan: "Bug artinya kesalahan di kode. Debugging adalah memburunya."


  - id: "9-5"
    judul: "Menangkap Banyak Error"
    menit: 7
    materi: |
      Satu try bisa memakai BANYAK except!
      Setiap except menangkap jenis error yang berbeda.
      Seperti pos jaga yang punya banyak pintu.
      Setiap pintu untuk tamu yang berbeda.

      ## Cara menulisnya

      ```
      try:
          umur = int('dua belas')
      except ValueError:
          print('Bukan angka!')
      except ZeroDivisionError:
          print('Jangan bagi nol!')
      ```

      Python mencoba kode di dalam try.
      Kalau error muncul, Python mencari except yang cocok.
      ValueError ditangkap pintu pertama.
      ZeroDivisionError ditangkap pintu kedua.
      Hanya satu except yang jalan.

      ## Kapan memakai ini?

      Program sungguhan bisa kena banyak masalah.
      Input salah ketik, angka nol, file hilang.
      Dengan banyak except, setiap masalah
      mendapat penanganan yang pas.

      ## Yang perlu diingat

      Kode di dalam try dijalankan dari atas.
      Error pertama yang muncul itulah yang ditangkap.
      Kode setelah baris error tidak dijalankan.
      Kalau error tidak cocok dengan except mana pun,
      program tetap berhenti.
    contoh:
      - kode: |
          try:
              hasil = 10 / 0
          except ValueError:
              print('Bukan angka!')
          except ZeroDivisionError:
              print('Jangan bagi nol!')
        penjelasan: "10 / 0 memicu ZeroDivisionError, jadi pesan 'Jangan bagi nol!' yang muncul."
      - kode: |
          try:
              umur = int('dua belas')
          except ValueError:
              print('Bukan angka!')
          except ZeroDivisionError:
              print('Jangan bagi nol!')
        penjelasan: "int('dua belas') memicu ValueError, jadi pesan 'Bukan angka!' yang muncul."
    kuis:
      - soal: "Bolehkah satu try memakai lebih dari satu except?"
        pilihan:
          - "tidak boleh"
          - "hanya dua except"
          - "hanya kalau pakai else"
          - "boleh, satu except untuk tiap jenis error"
        jawaban: 3
        penjelasan: "Boleh! Setiap except menangkap jenis error yang berbeda."
      - soal: "try: 5 / 0 lalu except ValueError dan except ZeroDivisionError. Yang jalan adalah..."
        pilihan:
          - "except ValueError"
          - "except ZeroDivisionError"
          - "kedua except"
          - "error baru"
        jawaban: 1
        penjelasan: "5 / 0 memicu ZeroDivisionError, jadi hanya except ZeroDivisionError yang jalan."
      - soal: "Kalau error yang muncul tidak cocok dengan except mana pun, program akan..."
        pilihan:
          - "tetap jalan"
          - "berhenti dengan error"
          - "mencoba lagi"
          - "mencetak None"
        jawaban: 1
        penjelasan: "Except yang tidak cocok tidak bisa menangkap error. Program tetap berhenti."


soal:
  - id: "s9-1"
    judul: "Kalkulator Aman"
    sulit: "mudah"
    cerita: |
      Si Kancil jualan keripik di kantin.
      Dia mau membuat kalkulator pembagian untuk menghitung harga per bungkus.
      Tapi dia takut ada pembeli yang mengetik angka nol — nanti programnya error!

      Bantu Kancil: baca dua angka.
      Cetak hasil baginya.
      Kalau angka kedua nol, jangan biarkan program mati — cetak pesan "Tidak bisa dibagi nol!" saja.
    input: "Dua baris: angka pertama, lalu angka kedua."
    output: "Satu baris: hasil bagi (bisa desimal), atau 'Tidak bisa dibagi nol!'."
    contoh:
      - input: "10\n2"
        output: "5.0"
      - input: "5\n0"
        output: "Tidak bisa dibagi nol!"
    tes:
      - input: "10\n2"
        output: "5.0"
      - input: "5\n0"
        output: "Tidak bisa dibagi nol!"
      - input: "7\n2"
        output: "3.5"
      - input: "100\n4"
        output: "25.0"
      - input: "0\n5"
        output: "0.0"
      - input: "9\n3"
        output: "3.0"
    solusi: |
      a = int(input())
      b = int(input())
      try:
          print(a / b)
      except ZeroDivisionError:
          print('Tidak bisa dibagi nol!')
    petunjuk:
      - "Baca dua angka dan simpan di dua variabel."
      - "Letakkan pembagian di dalam blok try."
      - "except ZeroDivisionError mencetak pesan kalau angka kedua nol."
      - "Kalau aman, print(a / b) langsung mencetak hasil baginya."

  - id: "s9-2"
    judul: "Mesin Kasir"
    sulit: "sedang"
    cerita: |
      Bu Rina memasang mesin kasir baru di warungnya.
      Mesin itu membaca harga barang dan uang yang dibayar, lalu menghitung kembalian.
      Masalahnya, kadang harga barang diketik salah — bukan angka — dan mesin langsung mati!

      Bantu Bu Rina: baca harga lalu uang bayar.
      Cetak "Kembalian: ...".
      Kalau harga bukan angka, cetak "Harga tidak valid!" dan jangan lanjutkan.
    input: "Dua baris: harga barang, lalu uang yang dibayar."
    output: "Satu baris: 'Kembalian: <angka>' atau 'Harga tidak valid!'."
    contoh:
      - input: "5000\n10000"
        output: "Kembalian: 5000"
      - input: "abc\n10000"
        output: "Harga tidak valid!"
    tes:
      - input: "5000\n10000"
        output: "Kembalian: 5000"
      - input: "abc\n10000"
        output: "Harga tidak valid!"
      - input: "2500\n2000"
        output: "Kembalian: -500"
      - input: "1000\n1000"
        output: "Kembalian: 0"
      - input: "8000\n10000"
        output: "Kembalian: 2000"
      - input: "x\n5000"
        output: "Harga tidak valid!"
    solusi: |
      try:
          harga = int(input())
          uang = int(input())
          print('Kembalian:', uang - harga)
      except ValueError:
          print('Harga tidak valid!')
    petunjuk:
      - "Bungkus int(input()) dan perhitungannya di dalam satu try."
      - "except ValueError menangkap harga yang bukan angka."
      - "Kembalian dihitung dengan uang - harga, bisa negatif kalau uangnya kurang."

  - id: "s9-3"
    judul: "Rata-Rata Kelas"
    sulit: "sulit"
    cerita: |
      Pak Guru mengetik nilai ulangan 7A ke komputer.
      Ada beberapa nilai yang ketikannya salah — huruf ikut masuk!
      Pak Guru ingin menghitung rata-rata.
      Tapi kalau ada data rusak, lebih baik tahu dulu daripada hasilnya salah.

      Baca jumlah nilai, lalu baca nilai-nilainya satu per satu.
      Kalau ada nilai yang bukan angka, cetak "Ada data rusak!" dan berhenti.
      Kalau semua benar, cetak rata-ratanya.
    input: "Baris pertama: jumlah nilai (n). Lalu n baris berisi nilai."
    output: "Satu baris: rata-rata (bisa desimal) atau 'Ada data rusak!'."
    contoh:
      - input: "3\n8\n7\n9"
        output: "8.0"
      - input: "4\n7\n8\na\n9"
        output: "Ada data rusak!"
    tes:
      - input: "3\n8\n7\n9"
        output: "8.0"
      - input: "4\n7\n8\na\n9"
        output: "Ada data rusak!"
      - input: "2\n10\n5"
        output: "7.5"
      - input: "5\n6\n6\n6\n6\n6"
        output: "6.0"
      - input: "1\n9"
        output: "9.0"
      - input: "3\n1\n2\nrusak"
        output: "Ada data rusak!"
    solusi: |
      n = int(input())
      total = 0
      rusak = False
      for i in range(n):
          try:
              total += int(input())
          except ValueError:
              rusak = True
              break
      if rusak:
          print('Ada data rusak!')
      else:
          print(total / n)
    petunjuk:
      - "Letakkan try/except di dalam perulangan, satu nilai per putaran."
      - "Pakai variabel penanda (misalnya rusak) supaya program tahu ada data yang gagal."
      - "Rata-rata = total dibagi n, dicetak hanya kalau tidak ada data rusak."

  - id: "s9-4"
    judul: "Mesin Kuadrat"
    sulit: "mudah"
    cerita: |
      Di kelas komputer, ada mesin penghitung kuadrat.
      Kamu mengetik angka, mesin mencetak angka itu dikali dirinya sendiri.
      Tapi kalau yang diketik bukan angka, mesin jangan mati.
      Cetak 'Bukan angka!' saja.
      Baca satu ketikan.
      Kalau angka, cetak kuadratnya.
      Kalau bukan, cetak 'Bukan angka!'.
    input: "Satu baris: ketikan (bisa angka, bisa bukan angka)."
    output: "Satu baris: kuadratnya, atau 'Bukan angka!'."
    contoh:
      - input: "4"
        output: "16"
      - input: "abc"
        output: "Bukan angka!"
    tes:
      - input: "4"
        output: "16"
      - input: "abc"
        output: "Bukan angka!"
      - input: "7"
        output: "49"
      - input: "0"
        output: "0"
      - input: "12"
        output: "144"
      - input: "x1"
        output: "Bukan angka!"
    solusi: |
      try:
          n = int(input())
          print(n * n)
      except ValueError:
          print('Bukan angka!')
    petunjuk:
      - "Bungkus int(input()) dan perhitungannya di dalam try."
      - "Kalau ketikan bukan angka, int() memicu ValueError."
      - "except ValueError mencetak 'Bukan angka!'."

  - id: "s9-5"
    judul: "Kalkulator Pintar"
    sulit: "sedang"
    cerita: |
      Kancil membuat kalkulator pintar di rumah.
      Kalkulator itu membagi dua angka.
      Kalau ada ketikan yang bukan angka, cetak 'Input bukan angka!'.
      Kalau angka kedua nol, cetak 'Tidak bisa dibagi nol!'.
      Kalau aman, cetak hasil baginya.
      Baca dua ketikan, lalu kerjakan.
    input: "Dua baris: angka pertama, lalu angka kedua."
    output: "Satu baris: hasil bagi (bisa desimal), 'Input bukan angka!', atau 'Tidak bisa dibagi nol!'."
    contoh:
      - input: "10\n2"
        output: "5.0"
      - input: "a\n2"
        output: "Input bukan angka!"
    tes:
      - input: "10\n2"
        output: "5.0"
      - input: "a\n2"
        output: "Input bukan angka!"
      - input: "8\n0"
        output: "Tidak bisa dibagi nol!"
      - input: "9\n4"
        output: "2.25"
      - input: "10\nb"
        output: "Input bukan angka!"
      - input: "0\n5"
        output: "0.0"
    solusi: |
      a = input()
      b = input()
      try:
          a = int(a)
          b = int(b)
          print(a / b)
      except ValueError:
          print('Input bukan angka!')
      except ZeroDivisionError:
          print('Tidak bisa dibagi nol!')
    petunjuk:
      - "Ubah kedua ketikan menjadi angka dengan int()."
      - "Letakkan pengubahan dan pembagian di dalam try."
      - "except ValueError menangkap ketikan bukan angka, except ZeroDivisionError menangkap pembagian nol."

  - id: "s9-6"
    judul: "Peti Harta Karun"
    sulit: "sedang"
    cerita: |
      Kancil menemukan peti harta karun di gudang sekolah.
      Di dalam peti ada deretan angka ajaib.
      Setiap angka punya posisi.
      Posisi pertama nomor 1, lalu 2, 3, dan seterusnya.
      Kancil suka menebak angka di posisi tertentu.
      Kalau posisinya tidak ada, programnya error dan mati.
      Itu membuat Kancil sedih.

      Bantu Kancil. Baca banyak angka, lalu angka-angkanya satu per satu.
      Baca satu posisi.
      Cetak angka di posisi itu.
      Kalau posisinya tidak ada, cetak 'Posisi tidak ada!'.
    input: "Baris 1: banyak angka (n). Lalu n baris angka. Terakhir satu posisi."
    output: "Satu baris: angka di posisi itu, atau 'Posisi tidak ada!'."
    contoh:
      - input: "3\n10\n20\n30\n2"
        output: "20"
      - input: "2\n7\n8\n9"
        output: "Posisi tidak ada!"
    tes:
      - input: "3\n10\n20\n30\n2"
        output: "20"
      - input: "2\n7\n8\n9"
        output: "Posisi tidak ada!"
      - input: "1\n99\n1"
        output: "99"
      - input: "4\n5\n15\n25\n35\n3"
        output: "25"
      - input: "3\n10\n20\n30\n4"
        output: "Posisi tidak ada!"
      - input: "3\n10\n20\n30\n3"
        output: "30"
    solusi: |
      n = int(input())
      a = []
      for i in range(n):
          a.append(int(input()))
      pos = int(input())
      try:
          print(a[pos - 1])
      except IndexError:
          print('Posisi tidak ada!')
    petunjuk:
      - "Baca semua angka dulu, simpan di dalam list."
      - "Posisi 1 artinya index 0. Pakai pos - 1."
      - "Bungkus a[pos - 1] dengan try. except IndexError mencetak 'Posisi tidak ada!'."

  - id: "s9-7"
    judul: "Buku Tabungan Kena Tinta"
    sulit: "sulit"
    cerita: |
      Kancil menabung uang jajan.
      Suatu hari, buku tabungannya kena tinta.
      Beberapa angka jadi tidak terbaca.
      Ada angka yang jelas, ada yang rusak.
      Kancil ingin tahu total uangnya.
      Dia juga ingin tahu berapa angka yang rusak.

      Baca banyak data, lalu data-datanya satu per satu.
      Data yang angka dijumlahkan.
      Data yang bukan angka dihitung sebagai rusak.
      Kalau semua rusak, cetak 'Semua rusak!'.
      Kalau tidak, cetak 'Total: <jumlah> Rusak: <banyak rusak>'.
    input: "Baris 1: banyak data (n). Lalu n baris berisi data."
    output: "Satu baris: 'Total: <n> Rusak: <m>', atau 'Semua rusak!'."
    contoh:
      - input: "3\n1\n2\n3"
        output: "Total: 6 Rusak: 0"
      - input: "2\na\nb"
        output: "Semua rusak!"
    tes:
      - input: "3\n1\n2\n3"
        output: "Total: 6 Rusak: 0"
      - input: "2\na\nb"
        output: "Semua rusak!"
      - input: "3\n1\na\n3"
        output: "Total: 4 Rusak: 1"
      - input: "1\n10"
        output: "Total: 10 Rusak: 0"
      - input: "4\n5\na\nb\n2"
        output: "Total: 7 Rusak: 2"
      - input: "3\na\n1\nb"
        output: "Total: 1 Rusak: 2"
    solusi: |
      n = int(input())
      total = 0
      rusak = 0
      for i in range(n):
          try:
              total += int(input())
          except ValueError:
              rusak += 1
      if rusak == n:
          print('Semua rusak!')
      else:
          print('Total:', total, 'Rusak:', rusak)
    petunjuk:
      - "Coba ubah tiap data dengan int() di dalam try. except ValueError menandai data rusak."
      - "Hitung data rusak di dalam perulangan. Jangan berhenti."
      - "Kalau jumlah rusak sama dengan n, cetak 'Semua rusak!'."
  - id: "s9-9"
    judul: "Harta Karun Angka"
    sulit: "sulit"
    cerita: |
      Kancil menemukan peta harta karun.
      Di peta tertulis angka-angka tersembunyi.
      Angka itu campur dengan kata-kata biasa.
      Kancil harus menjumlahkan semua angka.
      Tapi kata-kata biasa tidak boleh bikin program mati.
      Baca satu baris berisi beberapa ketikan.
      Jumlahkan yang berupa angka.
      Hitung juga banyaknya.
      Kalau tidak ada angka sama sekali, cetak 'Tidak ada angka'.
    input: "Satu baris: beberapa ketikan dipisah spasi (campur angka dan bukan angka)."
    output: "Kalau ada angka: baris 1 'Total: <jumlah>', baris 2 'Banyak: <banyak angka>'. Kalau tidak ada: 'Tidak ada angka'."
    contoh:
      - input: "3 ekor kancil 5 dan 2"
        output: "Total: 10\nBanyak: 3"
      - input: "satu dua tiga"
        output: "Tidak ada angka"
    tes:
      - input: "3 ekor kancil 5 dan 2"
        output: "Total: 10\nBanyak: 3"
      - input: "satu dua tiga"
        output: "Tidak ada angka"
      - input: "10 20 30"
        output: "Total: 60\nBanyak: 3"
      - input: "a 1 b 2 c 3"
        output: "Total: 6\nBanyak: 3"
      - input: "7"
        output: "Total: 7\nBanyak: 1"
      - input: "x y z"
        output: "Tidak ada angka"
    solusi: |
      data = input().split()
      total = 0
      banyak = 0
      for x in data:
          try:
              total = total + int(x)
              banyak = banyak + 1
          except ValueError:
              pass
      if banyak == 0:
          print('Tidak ada angka')
      else:
          print('Total:', total)
          print('Banyak:', banyak)
    petunjuk:
      - "Pecah baris dengan split(). Loop setiap ketikan."
      - "Coba int(x) di dalam try. Kalau gagal, except ValueError melewatinya."
      - "Kalau tidak ada angka sama sekali, cetak 'Tidak ada angka'."

  - id: "s9-8"
    judul: "Bagi-Bagi Snack"
    sulit: "sedang"
    cerita: |
      Kancil membagikan snack ke teman-teman.
      Setiap bungkus dibagi rata ke beberapa anak.
      Tapi catatan Kancil kadang rusak.
      Ada angka yang tertulis aneh.
      Kancil ingin program yang tetap jalan.
      Baca banyak catatan.
      Tiap catatan berisi dua ketikan.
      Kalau ketikan bukan angka, cetak 'Bukan angka!'.
      Kalau angka kedua nol, cetak 'Nol!'.
      Kalau aman, cetak hasil baginya.
    input: "Baris 1: n (banyak catatan). Lalu n baris: dua ketikan dipisah spasi."
    output: "n baris: hasil bagi tiap catatan, 'Bukan angka!', atau 'Nol!'."
    contoh:
      - input: "2\n10 2\n8 0"
        output: "5.0\nNol!"
      - input: "1\nx 2"
        output: "Bukan angka!"
    tes:
      - input: "2\n10 2\n8 0"
        output: "5.0\nNol!"
      - input: "1\nx 2"
        output: "Bukan angka!"
      - input: "2\n9 4\n1 3"
        output: "2.25\n0.3333333333333333"
      - input: "3\n6 2\n7 2\n0 5"
        output: "3.0\n3.5\n0.0"
      - input: "2\n5 0\n1 a"
        output: "Nol!\nBukan angka!"
      - input: "1\n100 8"
        output: "12.5"
    solusi: |
      n = int(input())
      for i in range(n):
          data = input().split()
          try:
              a = int(data[0])
              b = int(data[1])
              if b == 0:
                  print('Nol!')
              else:
                  print(a / b)
          except ValueError:
              print('Bukan angka!')
    petunjuk:
      - "Pecah tiap baris dengan split(). Ubah dua ketikan jadi angka dengan int()."
      - "Bungkus pengubahan dan pembagian di dalam try. except ValueError mencetak 'Bukan angka!'."
      - "Cek angka kedua dengan if b == 0 sebelum membagi."

  - id: "s9-10"
    judul: "Mesin Hitung"
    sulit: "sulit"
    cerita: |
      Di perpustakaan ada mesin hitung.
      Kamu mengetik dua angka.
      Mesin membagi angka pertama dengan angka kedua.
      Kalau ketikanmu bukan angka, mesin bilang 'Bukan angka!'.
      Kalau angka kedua nol, mesin bilang 'Tidak bisa dibagi nol!'.
      Mesin tidak menyerah.
      Dia terus bertanya sampai berhasil.
      Bantu Kancil memakai mesin ini.
    input: "Beberapa baris: tiap baris dua ketikan dipisah spasi. Baris terakhir pasti berhasil."
    output: "Baris 'Bukan angka!' atau 'Tidak bisa dibagi nol!' untuk tiap percobaan gagal, lalu satu baris hasil bagi saat berhasil."
    contoh:
      - input: "10 2"
        output: "5.0"
      - input: "a 2\n10 2"
        output: "Bukan angka!\n5.0"
    tes:
      - input: "10 2"
        output: "5.0"
      - input: "a 2\n10 2"
        output: "Bukan angka!\n5.0"
      - input: "8 0\n8 2"
        output: "Tidak bisa dibagi nol!\n4.0"
      - input: "x y\n3 0\n9 3"
        output: "Bukan angka!\nTidak bisa dibagi nol!\n3.0"
      - input: "1 1"
        output: "1.0"
      - input: "0 5"
        output: "0.0"
    solusi: |
      while True:
          data = input().split()
          try:
              a = int(data[0])
              b = int(data[1])
              print(a / b)
              break
          except ValueError:
              print('Bukan angka!')
          except ZeroDivisionError:
              print('Tidak bisa dibagi nol!')
    petunjuk:
      - "Bungkus membaca dan membagi di dalam try. except ValueError mencetak 'Bukan angka!'."
      - "except ZeroDivisionError mencetak 'Tidak bisa dibagi nol!'."
      - "Letakkan semuanya di dalam while True. Pakai break setelah berhasil mencetak hasil bagi."

  - id: "s9-11"
    judul: "Keranjang Buah"
    sulit: "sulit"
    cerita: |
      Kancil mengisi keranjang buah.
      Tiap buah punya berat.
      Beratnya ditulis di kertas kecil.
      Kadang tulisannya salah, bukan angka.
      Kalau salah, buah itu tidak masuk keranjang.
      Kancil mengetik berat sampai kata 'selesai'.
      Kalau ketikan bukan angka, cetak 'Bukan angka!'.
      Di akhir, cetak total beratnya.
    input: "Beberapa baris: tiap baris satu ketikan. Berakhir dengan kata 'selesai'."
    output: "Satu baris 'Bukan angka!' untuk tiap ketikan yang salah, lalu satu baris 'Total: <jumlah>'."
    contoh:
      - input: "3\n4\nselesai"
        output: "Total: 7"
      - input: "a\n2\nselesai"
        output: "Bukan angka!\nTotal: 2"
    tes:
      - input: "3\n4\nselesai"
        output: "Total: 7"
      - input: "a\n2\nselesai"
        output: "Bukan angka!\nTotal: 2"
      - input: "selesai"
        output: "Total: 0"
      - input: "0\n0\nselesai"
        output: "Total: 0"
      - input: "10\nx\ny\n20\nselesai"
        output: "Bukan angka!\nBukan angka!\nTotal: 30"
      - input: "-5\n5\nselesai"
        output: "Total: 0"
    solusi: |
      total = 0
      while True:
          x = input()
          if x == 'selesai':
              break
          try:
              total = total + int(x)
          except ValueError:
              print('Bukan angka!')
      print('Total:', total)
    petunjuk:
      - "Pakai while True dan berhenti dengan break kalau ketikan sama dengan 'selesai'."
      - "Coba ubah ketikan dengan int() di dalam try. except ValueError mencetak 'Bukan angka!'."
      - "Jumlahkan angka yang berhasil diubah. Setelah keluar dari loop, cetak 'Total:' lalu jumlahnya."


