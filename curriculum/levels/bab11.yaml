  - id: "s11-5"
    judul: "Kotak Paket"
    sulit: "sedang"
    cerita: |
      Kancil membantu di toko paket.
      Setiap paket berbentuk kotak dengan panjang, lebar, dan tinggi.
      Bu Guru ingin tahu volume kotak: panjang dikali lebar dikali tinggi.
      Buat class Kotak dengan tiga attribute.
      Method volume() mengembalikan hasil kalinya.
      Baca tiga angka, lalu cetak 'Volume: <hasil>'.
    input: "Tiga baris: panjang, lebar, lalu tinggi."
    output: "Satu baris: Volume: <hasil>."
    contoh:
      - input: "2\n3\n4"
        output: "Volume: 24"
      - input: "5\n5\n5"
        output: "Volume: 125"
    tes:
      - input: "2\n3\n4"
        output: "Volume: 24"
      - input: "5\n5\n5"
        output: "Volume: 125"
      - input: "1\n1\n1"
        output: "Volume: 1"
      - input: "10\n2\n3"
        output: "Volume: 60"
      - input: "2\n2\n2"
        output: "Volume: 8"
      - input: "3\n4\n5"
        output: "Volume: 60"
    solusi: |
      class Kotak:
          def __init__(self, p, l, t):
              self.p = p
              self.l = l
              self.t = t

          def volume(self):
              return self.p * self.l * self.t

      p = int(input())
      l = int(input())
      t = int(input())
      kotak = Kotak(p, l, t)
      print('Volume:', kotak.volume())
    petunjuk:
      - "__init__ menyimpan panjang, lebar, dan tinggi ke attribute."
      - "Method volume() mengalikan ketiga attribute."
      - "Baca tiga input dengan int() lalu buat object Kotak."

  - id: "s11-6"
    judul: "Kartu Karakter Game"
    sulit: "sedang"
    cerita: |
      Kancil membuat game kecil.
      Tiap pemain punya kartu karakter.
      Kartu berisi nama dan HP (darah).
      Kalau karakter diserang, HP berkurang 10.
      HP tidak boleh kurang dari nol.
      Kancil ingin mencetak kartu karakter setelah diserang.

      Buat class Karakter dengan nama dan hp.
      Method serang() mengurangi hp 10.
      Method __str__ menampilkan '<nama> (HP <hp>)'.
      Baca nama, hp awal, lalu banyak serangan.
    input: "Tiga baris: nama, hp awal, lalu banyak serangan."
    output: "Satu baris: <nama> (HP <hp>)."
    contoh:
      - input: "Milo\n50\n3"
        output: "Milo (HP 20)"
      - input: "Tono\n10\n2"
        output: "Tono (HP 0)"
    tes:
      - input: "Milo\n50\n3"
        output: "Milo (HP 20)"
      - input: "Tono\n10\n2"
        output: "Tono (HP 0)"
      - input: "Kancil\n20\n5"
        output: "Kancil (HP 0)"
      - input: "Budi\n100\n1"
        output: "Budi (HP 90)"
      - input: "Sari\n30\n0"
        output: "Sari (HP 30)"
      - input: "Rina\n40\n4"
        output: "Rina (HP 0)"
    solusi: |
      class Karakter:
          def __init__(self, nama, hp):
              self.nama = nama
              self.hp = hp

          def serang(self):
              self.hp -= 10
              if self.hp < 0:
                  self.hp = 0

          def __str__(self):
              return self.nama + ' (HP ' + str(self.hp) + ')'

      nama = input()
      hp = int(input())
      serangan = int(input())
      k = Karakter(nama, hp)
      for i in range(serangan):
          k.serang()
      print(k)
    petunjuk:
      - "Class Karakter punya __init__ yang menyimpan nama dan hp."
      - "Method serang() mengurangi self.hp dengan 10. Jangan sampai negatif."
      - "Method __str__ mengembalikan teks kartu: nama + ' (HP ' + str(hp) + ')'."

  - id: "s11-7"
    judul: "Celengan Digital"
    sulit: "sulit"
    cerita: |
      Kancil buka celengan digital.
      Ada dua cara: nabung atau ambil uang.
      Kalau ambil lebih banyak dari saldo, Kancil tidak boleh.
      Harus ada pesan 'Saldo kurang!'.
      Di akhir, cetak saldo terakhir.

      Buat class Bank dengan nama dan saldo.
      Method nabung(uang) menambah saldo.
      Method ambil(uang) mengurangi saldo kalau cukup.
      Baca nama, saldo awal, banyak transaksi, lalu transaksinya.
      Tiap transaksi: 'nabung <uang>' atau 'ambil <uang>'.
    input: "Baris 1: nama. Baris 2: saldo awal. Baris 3: banyak transaksi (n). Lalu n baris transaksi."
    output: "Pesan 'Saldo kurang!' kalau ada, lalu satu baris: <nama> punya Rp<saldo>."
    contoh:
      - input: "Kancil\n1000\n3\nnabung 500\nambil 200\nnabung 300"
        output: "Kancil punya Rp1600"
      - input: "Budi\n100\n2\nambil 200\nnabung 50"
        output: "Saldo kurang!\nBudi punya Rp150"
    tes:
      - input: "Kancil\n1000\n3\nnabung 500\nambil 200\nnabung 300"
        output: "Kancil punya Rp1600"
      - input: "Budi\n100\n2\nambil 200\nnabung 50"
        output: "Saldo kurang!\nBudi punya Rp150"
      - input: "Sari\n500\n1\nambil 500"
        output: "Sari punya Rp0"
      - input: "Tono\n1000\n4\nambil 100\nambil 100\nambil 100\nambil 100"
        output: "Tono punya Rp600"
      - input: "Mina\n50\n2\nambil 60\nnabung 10"
        output: "Saldo kurang!\nMina punya Rp60"
      - input: "Umi\n2000\n3\nnabung 500\nambil 1000\nambil 1500"
        output: "Umi punya Rp0"
    solusi: |
      class Bank:
          def __init__(self, nama, saldo):
              self.nama = nama
              self.saldo = saldo

          def nabung(self, uang):
              self.saldo += uang

          def ambil(self, uang):
              if uang > self.saldo:
                  print('Saldo kurang!')
              else:
                  self.saldo -= uang

          def __str__(self):
              return self.nama + ' punya Rp' + str(self.saldo)

      nama = input()
      saldo = int(input())
      n = int(input())
      b = Bank(nama, saldo)
      for i in range(n):
          p = input().split()
          if p[0] == 'nabung':
              b.nabung(int(p[1]))
          else:
              b.ambil(int(p[1]))
      print(b)
    petunjuk:
      - "Class Bank punya method nabung() dan ambil()."
      - "Di method ambil(), cek dulu apakah uang lebih besar dari saldo."
      - "Pecah tiap transaksi dengan .split(). Panggil method yang sesuai dengan isinya."
  - id: "s11-9"
    judul: "Lomba Lari"
    sulit: "sulit"
    cerita: |
      Sekolah mengadakan lomba lari.
      Setiap kelas mengirim satu pelari.
      Waktu tempuh tiap pelari dicatat.
      Pelari dengan waktu terkecil jadi juara.
      Kalau ada waktu yang sama, yang muncul lebih dulu yang menang.
      Buat class Pelari.
      Class itu punya nama dan waktu.
      Method lebih_cepat() membandingkan dua pelari.
      Baca banyak pelari, lalu nama dan waktunya.
      Cetak nama pelari tercepat.
    input: "Baris 1: n (banyak pelari). Lalu n baris: nama dan waktu (dipisah spasi)."
    output: "Satu baris: nama pelari dengan waktu terkecil."
    contoh:
      - input: "3\nBudi 12\nSari 9\nRina 15"
        output: "Sari"
      - input: "2\nTono 10\nAyu 10"
        output: "Tono"
    tes:
      - input: "3\nBudi 12\nSari 9\nRina 15"
        output: "Sari"
      - input: "2\nTono 10\nAyu 10"
        output: "Tono"
      - input: "1\nMila 20"
        output: "Mila"
      - input: "4\nA 5\nB 3\nC 7\nD 3"
        output: "B"
      - input: "3\nX 8\nY 8\nZ 8"
        output: "X"
      - input: "2\nUmi 1\nTono 100"
        output: "Umi"
    solusi: |
      class Pelari:
          def __init__(self, nama, waktu):
              self.nama = nama
              self.waktu = waktu

          def lebih_cepat(self, lain):
              return self.waktu < lain.waktu

      n = int(input())
      terbaik = None
      for i in range(n):
          data = input().split()
          p = Pelari(data[0], int(data[1]))
          if terbaik is None:
              terbaik = p
          elif p.lebih_cepat(terbaik):
              terbaik = p
      print(terbaik.nama)
    petunjuk:
      - "Class Pelari punya attribute nama dan waktu."
      - "Method lebih_cepat(lain) mengembalikan True kalau waktu sendiri lebih kecil."
      - "Simpan pelari tercepat sementara. Ganti hanya kalau ada yang lebih cepat."

  - id: "s11-8"
    judul: "Lampu Ajaib"
    sulit: "sedang"
    cerita: |
      Kancil punya lampu ajaib dari laboratorium.
      Setiap ditekan, lampu berganti nyala atau mati.
      Kalau mati jadi nyala.
      Kalau nyala jadi mati.
      Kancil ingin tahu keadaan lampu setelah ditekan beberapa kali.
      Buat class Lampu.
      Method tekan() mengubah keadaan lampu.
      Method __str__ mengembalikan 'nyala' atau 'mati'.
      Baca banyak tekan.
      Cetak keadaan lampu setelah semua tekan.
    input: "Satu baris: banyak tekan."
    output: "Satu baris: nyala atau mati"
    contoh:
      - input: "3"
        output: "nyala"
      - input: "2"
        output: "mati"
    tes:
      - input: "3"
        output: "nyala"
      - input: "2"
        output: "mati"
      - input: "1"
        output: "nyala"
      - input: "0"
        output: "mati"
      - input: "5"
        output: "nyala"
      - input: "4"
        output: "mati"
    solusi: |
      class Lampu:
          def __init__(self):
              self.nyala = False

          def tekan(self):
              if self.nyala:
                  self.nyala = False
              else:
                  self.nyala = True

          def __str__(self):
              if self.nyala:
                  return 'nyala'
              return 'mati'

      n = int(input())
      lampu = Lampu()
      for i in range(n):
          lampu.tekan()
      print(lampu)
    petunjuk:
      - "Class Lampu punya attribute nyala yang mulai dari False."
      - "Method tekan() membalik keadaan: kalau nyala jadi mati, kalau mati jadi nyala."
      - "Method __str__ mengembalikan 'nyala' atau 'mati'. Cetak object lampu."

  - id: "s11-10"
    judul: "Toko Kue Kancil"
    sulit: "sulit"
    cerita: |
      Kancil membuka toko kue.
      Setiap kue punya harga sendiri.
      Kancil membuat class Kue.
      Method total menghitung harga kali jumlah.
      Method diskon memotong harga.
      Hari ini ada diskon besar.
      Kancil menghitung dua pesanan.
      Dia ingin tahu pesanan mana yang lebih mahal setelah diskon.
      Bantu Kancil: baca harga dan jumlah dua pesanan, lalu persen diskon.
      Cetak total masing-masing dan pesanan yang lebih mahal.
    input: "Lima baris: harga kue 1, jumlah kue 1, harga kue 2, jumlah kue 2, lalu persen diskon."
    output: "Tiga baris: 'Kue 1: <total>', 'Kue 2: <total>', lalu 'Lebih mahal: Kue 1' / 'Lebih mahal: Kue 2' / 'Sama'."
    contoh:
      - input: "5000\n2\n3000\n3\n10"
        output: "Kue 1: 9000\nKue 2: 8100\nLebih mahal: Kue 1"
      - input: "100\n1\n200\n1\n25"
        output: "Kue 1: 75\nKue 2: 150\nLebih mahal: Kue 2"
    tes:
      - input: "5000\n2\n3000\n3\n10"
        output: "Kue 1: 9000\nKue 2: 8100\nLebih mahal: Kue 1"
      - input: "100\n1\n200\n1\n25"
        output: "Kue 1: 75\nKue 2: 150\nLebih mahal: Kue 2"
      - input: "1000\n1\n1000\n1\n0"
        output: "Kue 1: 1000\nKue 2: 1000\nSama"
      - input: "2000\n3\n5000\n1\n50"
        output: "Kue 1: 3000\nKue 2: 2500\nLebih mahal: Kue 1"
      - input: "5000\n2\n3000\n3\n100"
        output: "Kue 1: 0\nKue 2: 0\nSama"
      - input: "1\n5\n1\n5\n50"
        output: "Kue 1: 0\nKue 2: 0\nSama"
    solusi: |
      class Kue:
          def __init__(self, harga):
              self.harga = harga

          def total(self, jumlah):
              return self.harga * jumlah

          def diskon(self, persen):
              return int(self.harga * (100 - persen) / 100)

      h1 = int(input())
      j1 = int(input())
      h2 = int(input())
      j2 = int(input())
      p = int(input())
      kue1 = Kue(h1)
      kue2 = Kue(h2)
      t1 = kue1.diskon(p) * j1
      t2 = kue2.diskon(p) * j2
      print('Kue 1:', t1)
      print('Kue 2:', t2)
      if t1 > t2:
          print('Lebih mahal: Kue 1')
      elif t2 > t1:
          print('Lebih mahal: Kue 2')
      else:
          print('Sama')
    petunjuk:
      - "Class Kue punya __init__ yang menyimpan harga. Method total(jumlah) mengembalikan harga kali jumlah."
      - "Method diskon(persen) mengembalikan harga setelah dipotong: int(harga * (100 - persen) / 100)."
      - "Buat dua object Kue. Bandingkan hasil akhirnya dengan if untuk mencetak yang lebih mahal."

  - id: "s11-11"
    judul: "Komik Tebal Tipis"
    sulit: "sulit"
    cerita: |
      Kancil punya banyak komik.
      Setiap komik punya jumlah halaman.
      Komik yang punya 100 halaman atau lebih disebut tebal.
      Yang kurang dari 100 disebut tipis.
      Kancil ingin mencetak nama semua komik dan ketebalannya.
      Buat class Komik.
      Di __init__, hitung ketebalan dari halaman.
      Method info memberi teks nama dan ketebalan.
      Baca banyak komik, lalu komik-komiknya.
    input: "Baris 1: banyak komik (n). Lalu n baris: judul spasi halaman (judul satu kata)."
    output: "n baris: <judul>: tebal atau tipis."
    contoh:
      - input: "2\nKancil 120\nRusa 80"
        output: "Kancil: tebal\nRusa: tipis"
      - input: "1\nAjaib 100"
        output: "Ajaib: tebal"
    tes:
      - input: "2\nKancil 120\nRusa 80"
        output: "Kancil: tebal\nRusa: tipis"
      - input: "1\nAjaib 100"
        output: "Ajaib: tebal"
      - input: "2\nBumi 99\nLangit 101"
        output: "Bumi: tipis\nLangit: tebal"
      - input: "1\nKosong 0"
        output: "Kosong: tipis"
      - input: "3\nA 100\nB 100\nC 1"
        output: "A: tebal\nB: tebal\nC: tipis"
      - input: "1\nKecil 50"
        output: "Kecil: tipis"
    solusi: |
      class Komik:
          def __init__(self, judul, halaman):
              self.judul = judul
              if halaman >= 100:
                  self.ketebalan = 'tebal'
              else:
                  self.ketebalan = 'tipis'

          def info(self):
              return self.judul + ': ' + self.ketebalan

      n = int(input())
      for i in range(n):
          data = input().split()
          k = Komik(data[0], int(data[1]))
          print(k.info())
    petunjuk:
      - "Di __init__, hitung ketebalan dengan if halaman >= 100."
      - "Method info() mengembalikan teks nama dan ketebalan."
      - "Baca n, lalu loop tiap baris. Pecah dengan .split(). Buat object Komik lalu print(k.info())."


